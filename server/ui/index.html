<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:">
    <title>MixAI Companion</title>
    <!-- Theme attributes from localStorage["mixai:prefs:v1"] BEFORE first paint (no flash). -->
    <script src="./prehydrate.js"></script>
    <!-- Plain token variables so the splash paints with the real palette before React/Tailwind load. -->
    <link rel="stylesheet" href="./tokens.plain.css">
    <style>
        /* Splash-only CSS. Everything else is Tailwind (src/styles.css). */
        html, body { margin: 0; height: 100%; }
        body {
            background: var(--background);
            color: var(--foreground);
            font-family: var(--font-sans);
            overflow: hidden;
        }
        #root { height: 100%; }
        .splash {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            background:
                radial-gradient(circle at 50% 35%, color-mix(in oklch, var(--brand) 22%, transparent), transparent 55%),
                radial-gradient(circle at 50% 80%, color-mix(in oklch, var(--brand-2) 12%, transparent), transparent 60%),
                var(--background);
            transition: opacity 380ms var(--ease-out, ease), transform 380ms var(--ease-out, ease), visibility 380ms;
            -webkit-app-region: drag;
        }
        .splash.hide { opacity: 0; transform: scale(1.03); visibility: hidden; pointer-events: none; }
        .splash-logo {
            position: relative; width: 84px; height: 84px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            box-shadow: 0 12px 40px color-mix(in oklch, var(--brand) 35%, transparent), 0 0 0 1px rgba(255,255,255,0.06) inset;
            color: white;
            opacity: 0; transform: translateY(6px) scale(0.92);
            animation: splash-pop 520ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .splash-logo::before {
            content: ""; position: absolute; inset: -10px; border-radius: 28px;
            border: 2px solid transparent;
            border-top-color: color-mix(in oklch, var(--brand-accent) 80%, transparent);
            border-right-color: color-mix(in oklch, var(--brand-accent) 35%, transparent);
            opacity: 0;
            animation: splash-ring-fadein 600ms ease 200ms forwards, spin 1.4s linear 200ms infinite;
        }
        .splash-text { text-align: center; opacity: 0; transform: translateY(8px); animation: splash-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 150ms forwards; }
        .splash-title { font-family: var(--font-heading); font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
        .splash-title b { color: var(--brand-accent); font-weight: 700; }
        .splash-sub { margin-top: 4px; font-size: 11px; color: var(--muted-foreground); letter-spacing: 0.4px; text-transform: uppercase; }
        .splash-dots { display: flex; gap: 6px; margin-top: 6px; opacity: 0; animation: splash-rise 420ms ease 320ms forwards; }
        .splash-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: splash-bounce 1.1s ease-in-out infinite; }
        .splash-dots span:nth-child(2) { animation-delay: .15s; }
        .splash-dots span:nth-child(3) { animation-delay: .30s; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes splash-pop { from { opacity: 0; transform: translateY(8px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes splash-ring-fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes splash-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .55; } 40% { transform: translateY(-5px); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .splash, .splash-logo, .splash-text, .splash-dots, .splash-dots span, .splash-logo::before {
                animation: none !important; transition: opacity 200ms ease !important; opacity: 1 !important; transform: none !important;
            }
        }
        [data-motion="reduced"] .splash, [data-motion="reduced"] .splash *, [data-motion="reduced"] .splash-logo::before {
            animation: none !important; transition: opacity 200ms ease !important; opacity: 1 !important; transform: none !important;
        }
    </style>
</head>

<body>
    <div id="splash" class="splash" role="status" aria-label="MixAI Companion is starting">
        <div class="splash-logo" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="splash-text">
            <div class="splash-title">Mix<b>AI</b> Companion</div>
            <div class="splash-sub">MMO Server · Low-latency audio bridge</div>
        </div>
        <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>

</html>
