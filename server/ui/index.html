    <style>
        /* Splash-only CSS. Everything else is Tailwind (src/styles.css). */
        html, body { margin: 0; height: 100%; }
        body {
            background: var(--background);
            color: var(--foreground);
            font-family: var(--font-sans);
            overflow: hidden;
        }
        #root { height: 100%; }
        .splash {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            background:
              radial-gradient(circle at 50% 40%, color-mix(in oklch, var(--product-server) 16%, transparent), transparent 55%),
              var(--background);
            transition: opacity 380ms var(--ease-out, ease), transform 380ms var(--ease-out, ease), visibility 380ms;
            -webkit-app-region: drag;
        }
        .splash.hide { opacity: 0; transform: scale(1.03); visibility: hidden; pointer-events: none; }
        .splash-logo, .splash-title { display: flex; }
        .splash-text { display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; transform: translateY(8px); animation: splash-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 150ms forwards; }
        /* Status line: the loading state in words (the only cue under reduced motion). The language comes from
           <html lang>, set by prehydrate.js; CSS because the page CSP allows no inline script. */
        .splash-sub { font-size: 14px; color: var(--muted-foreground); }
        .splash-sub::after { content: "Se pornește…"; }
        :root[lang="en"] .splash-sub::after { content: "Starting…"; }
        @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* Reduced motion: no rise and no scale; the splash still fades out (opacity is not forced on `.splash`,
           otherwise `.hide` could not fade and the screen cut instantly). */
        @media (prefers-reduced-motion: reduce) {
          .splash { transition: opacity 200ms ease, visibility 200ms !important; transform: none !important; }
          .splash-text { animation: none !important; opacity: 1 !important; transform: none !important; }
        }
        [data-motion="reduced"] .splash { transition: opacity 200ms ease, visibility 200ms !important; transform: none !important; }
        [data-motion="reduced"] .splash-text { animation: none !important; opacity: 1 !important; transform: none !important; }
    </style>
