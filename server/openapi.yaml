        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/tracks:
    get:
      operationId: libraryListTracks
      tags: [library]
      summary: List tracks with filters, sorting and pagination
      parameters:
        - { name: genre, in: query, schema: { type: string }, description: Comma-separated list. }
        - { name: subgenre, in: query, schema: { type: string } }
        - { name: minBpm, in: query, schema: { type: integer } }
        - { name: maxBpm, in: query, schema: { type: integer } }
        - { name: energy, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: key, in: query, schema: { type: string }, description: Comma-separated Camelot or musical keys. }
        - { name: isProcessed, in: query, schema: { type: boolean } }
        - { name: isFavorite, in: query, schema: { type: boolean } }
        - { name: isHidden, in: query, schema: { type: boolean } }
        - { name: tag, in: query, schema: { type: string }, description: Comma-separated list. }
        - { name: rating, in: query, schema: { type: integer } }
        - { name: album, in: query, schema: { type: string } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: label, in: query, schema: { type: string } }
        - { name: mood, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - name: sort
          in: query
          schema:
            type: string
            default: addedAt
            enum: [artist, title, bpm, key, genre, energy, duration, rating, favorite, bitrate, year, addedAt]
        - { name: order, in: query, schema: { type: string, default: desc, enum: [asc, desc] } }
      responses:
        '200':
          description: Page of tracks
          content:
            application/json:
              schema:
                type: object
                required: [tracks, total, page, pageSize, totalPages]
                properties:
                  tracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalPages: { type: integer }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/tracks/{id}:
