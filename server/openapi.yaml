      parameters:
        - { $ref: '#/components/parameters/VoiceId' }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoiceAnalyzeRequest' }
      responses:
        '200':
          description: Sidecar analysis result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /voice/pitch-coverage:
