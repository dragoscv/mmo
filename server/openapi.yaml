            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '403': { $ref: '#/components/responses/ForbiddenLocalhost' }

  /audio/native/autocorrect:
    post:
      operationId: setNativeAudioAutocorrect
