      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                required: [running, metrics, status, lastPitch]
                properties:
                  running: { type: boolean }
                  metrics: { $ref: '#/components/schemas/EngineMetrics' }
                  status:
