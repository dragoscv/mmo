                      - { type: 'null' }
                  lastPitch:
                    oneOf:
                      - { $ref: '#/components/schemas/PitchInfo' }
                      - { type: 'null' }
        '403': { $ref: '#/components/responses/ForbiddenLocalhost' }

  /audio/native/scale:
