openapi: 3.1.0
info:
  title: MMO Server API
  version: 3.2.0
  summary: Local-first media companion server (Express 5) behind the MixAI apps.
  description: |
    REST API of the MMO Server (the "companion"): library, video, audio, voice,
    rendering, casting, pairing, sync and an OpenSubsonic-compatible surface.

    The server normally listens on the LAN at port `17899` (configurable) and is
    reached directly by the web app, the desktop/mobile apps and the TV apps.

    ## Authentication

    Every endpoint except the ones marked `security: []` requires the **device
    token** that was handed over during pairing, sent as the `x-device-token`
    header. There is **no** `Authorization: Bearer` support. Failures answer
    `401 {"error":"Unauthorized"}`.

    A subset of routes (marked with the `queryToken` scheme — media streams and
    SSE, which browsers cannot send headers on) also accept `?t=<deviceToken>`;
    those routes additionally copy `?u=<userId>` into the `x-user-id` header.

    Most `/library`, `/voice`, `/plugins` and `/mixai-profile` routes also
    require an `x-user-id` header and answer `400 {"error":"Missing X-User-Id
    header"}` without it.

    The `/audio/native/*` routes use no token at all: they are restricted to
    loopback connections with an allowed `Host`/`Origin` and answer `403`
    otherwise.

    `/rest/*` (OpenSubsonic) has its own query-parameter auth — see the
    `subsonic` tag.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://{host}:{port}
    description: MMO Server on the LAN
    variables:
      host:
        default: localhost
      port:
        default: '17899'
tags:
  - name: health
    description: Liveness, host info and logs.
  - name: metrics
    description: JSON metrics snapshot (not Prometheus exposition).
  - name: auth
    description: OAuth completion callback from the web app.
  - name: pair
    description: Quick Connect pairing (code + secret handshake).
  - name: library
    description: Music library — tracks, playlists, drives, stems, analysis.
  - name: video
    description: Video library — scan, direct play, HLS, subtitles, thumbnails, TMDB.
  - name: watch-party
    description: Synchronised playback rooms.
  - name: audio
    description: Audio streaming and device authorisation.
  - name: audio-native
    description: Low-latency native audio engine (loopback only, no token).
  - name: download
    description: Raw file download.
  - name: fs
    description: Filesystem browsing and existence checks.
  - name: folders
    description: Configured scan folders and their watchers.
  - name: scan
    description: Asynchronous scan jobs.
  - name: voice
    description: Voice cloning, TTS, singing and engine sidecars.
  - name: render
    description: Project render jobs.
  - name: projects
    description: Content-addressed project assets.
  - name: plugins
    description: VST3/AU plugin inventory and offline rendering.
  - name: cast
    description: DLNA and Home Assistant casting.
  - name: profile
    description: MIXAI per-user profile blob.
  - name: sync
    description: Change push from the cloud into the companion.
  - name: subsonic
    description: OpenSubsonic-compatible API.
  - name: media
    description: Media Home brain — TMDB recommendations, streaming availability, watch progress, local library index.
security:
  - deviceToken: []
paths:
  /auth/callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: OAuth completion redirect from the web app
      description: Stores the device token and user identity, then renders an HTML page. Responses are HTML, not JSON.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: token, in: query, schema: { type: string } }
        - { name: deviceId, in: query, schema: { type: string } }
        - { name: userName, in: query, schema: { type: string } }
        - { name: userEmail, in: query, schema: { type: string } }
        - { name: userImage, in: query, schema: { type: string } }
        - { name: webAppUrl, in: query, schema: { type: string } }
      responses:
        '200':
          description: Connected page
          content:
            text/html:
              schema: { type: string }
        '400':
          description: Invalid or expired auth state
          content:
            text/html:
              schema: { type: string }

  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness beacon
      security: []
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /logs/recent:
    get:
      operationId: getRecentLogs
      tags: [health]
      summary: Recent debug-log ring lines
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                required: [lines]
                properties:
                  lines: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /info:
    get:
      operationId: getServerInfo
      tags: [health]
      summary: Host info and configured scan folders
      responses:
        '200':
          description: Server info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /metrics:
    get:
      operationId: getMetrics
      tags: [metrics]
      summary: JSON metrics snapshot
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanionMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /audio/{filePath}:
    get:
      operationId: streamAudio
      tags: [audio]
      summary: Stream an audio file from an allowed scan folder
      description: |
        Express 5 splat route (`/audio/*filePath`). Supports HTTP Range.
        Requests for `/audio/native/*`, `/audio/devices` and `/audio/devices/*`
        fall through to their own handlers.
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded absolute path (may contain slashes).
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200':
          description: Whole file
          content:
            '*/*':
              schema: { type: string, format: binary }
        '206':
          description: Partial content
          content:
            '*/*':
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pair/info:
    get:
      operationId: pairInfo
      tags: [pair]
      summary: Server label for discovery UIs
      security: []
      responses:
        '200':
          description: Server identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairInfo' }

  /pair/request:
    post:
      operationId: pairRequest
      tags: [pair]
      summary: Request a six-digit pairing code
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '201':
          description: Code issued (valid for 10 minutes)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairRequestResponse' }
        '429':
          description: Too many pending pairing requests (max 20)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Server not initialised (no device token yet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pair/poll:
    get:
      operationId: pairPoll
      tags: [pair]
      summary: Poll a pairing code
      description: On approval the device token is handed over exactly once, then the entry is deleted.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, pattern: '^\d{6}$' } }
        - { name: secret, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pairing state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairPollResponse' }
        '400':
          description: Invalid code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Invalid secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Polling faster than once per 2 seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Server not initialised (no device token yet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pair/approve:
    post:
      operationId: pairApprove
      tags: [pair]
      summary: Approve a pending code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairApproveRequest' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairApproveResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown or expired code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: pairApproveByQuery
      tags: [pair]
      summary: Approve a pending code with the device token in the query string
      security:
        - queryToken: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, pattern: '^\d{6}$' } }
        - { name: t, in: query, required: true, schema: { type: string }, description: Device token (constant-time compared). }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairApproveResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown or expired code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pair/deny:
    post:
      operationId: pairDeny
      tags: [pair]
      summary: Deny (delete) a pending code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairApproveRequest' }
      responses:
        '200':
          description: Result; `ok` is false when the code was unknown or expired
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pair/pending:
    get:
      operationId: pairListPending
      tags: [pair]
      summary: Pending pairing requests, without secrets
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending: { type: array, items: { $ref: '#/components/schemas/PairPending' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ErrorJson' }
        '416': { $ref: '#/components/responses/ErrorJson' }

  /download/{filePath}:
    get:
      operationId: downloadFile
      tags: [download]
      summary: Download a whole file as an attachment
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded absolute path (Express 5 splat).
      responses:
        '200':
          description: File bytes
          content:
            '*/*':
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ErrorJson' }

  /fs/drives:
    get:
      operationId: listDrives
      tags: [fs]
      summary: Connected drives (cached)
      responses:
        '200':
          description: Drives
          content:
            application/json:
              schema:
                type: object
                required: [drives]
                properties:
                  drives: { type: array, items: { $ref: '#/components/schemas/Drive' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /fs/list:
    get:
      operationId: listDirectory
      tags: [fs]
      summary: List subdirectories of a path (cached)
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsListing' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /fs/add:
    post:
      operationId: addFolderByPath
      tags: [fs]
      summary: Add a folder to the scan folders by path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                kind: { $ref: '#/components/schemas/FolderKind' }
      responses:
        '200':
          description: Added
          content:
            application/json:
              schema:
                type: object
                required: [added, picked, folders]
                properties:
                  added: { type: boolean }
                  picked: { type: string }
                  folders: { type: array, items: { $ref: '#/components/schemas/ScanFolder' } }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /folders:
    get:
      operationId: listFolders
      tags: [folders]
      summary: Configured scan folders with existence and watcher stats
      responses:
        '200':
          description: Folders
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders: { type: array, items: { $ref: '#/components/schemas/ScanFolder' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /synthesize/voice:
    post:
      operationId: synthesizeVoice
      tags: [voice]
      summary: Piper text-to-speech, returns WAV bytes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                voice: { type: string, enum: [male, female, neutral], default: neutral }
                rate: { type: number, default: 1 }
                pitchSemitones: { type: number, default: 0 }
      responses:
        '200':
          description: WAV audio
          headers:
            X-Duration-Sec: { schema: { type: string } }
            X-Sample-Rate: { schema: { type: string } }
            X-Voice-Model: { schema: { type: string } }
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }
        '504': { $ref: '#/components/responses/ErrorJson' }

  /sing/voice:
    post:
      operationId: singVoice
      tags: [voice]
      summary: Melody-aligned singing (Piper + PSOLA), returns WAV bytes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, melody]
              properties:
                text: { type: string }
                voice: { type: string, enum: [male, female, neutral], default: neutral }
                tempo: { type: number, default: 120 }
                melody:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      beat: { type: number }
                      durationBeats: { type: number }
                      midiPitch: { type: number }
      responses:
        '200':
          description: WAV audio
          headers:
            X-Duration-Sec: { schema: { type: string } }
            X-Sample-Rate: { schema: { type: string } }
            X-Voice-Model: { schema: { type: string } }
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }
        '504': { $ref: '#/components/responses/ErrorJson' }

  /folders/pick:
    post:
      operationId: pickFolder
      tags: [folders]
      summary: Open the native folder picker and add the chosen folder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { $ref: '#/components/schemas/FolderKind' }
      responses:
        '200':
          description: Picker result
          content:
            application/json:
              schema:
                type: object
                required: [canceled, folders]
                properties:
                  canceled: { type: boolean }
                  picked: { type: string }
                  folders: { type: array, items: { $ref: '#/components/schemas/FolderConfig' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /folders/remove:
    post:
      operationId: removeFolder
      tags: [folders]
      summary: Remove a folder and stop its watcher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [success, folders]
                properties:
                  success: { type: boolean }
                  folders: { type: array, items: { $ref: '#/components/schemas/FolderConfig' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /folders/watch:
    post:
      operationId: setFolderWatch
      tags: [folders]
      summary: Toggle the filesystem watcher for a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                watch: { type: boolean }
      responses:
        '200':
          description: Watcher state
          content:
            application/json:
              schema:
                type: object
                required: [success, folders, watcher]
                properties:
                  success: { type: boolean }
                  folders: { type: array, items: { $ref: '#/components/schemas/FolderConfig' } }
                  watcher:
                    oneOf:
                      - { $ref: '#/components/schemas/WatcherStatus' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /folders/kind:
    post:
      operationId: setFolderKind
      tags: [folders]
      summary: Set the purpose label of a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, kind]
              properties:
                path: { type: string }
                kind: { $ref: '#/components/schemas/FolderKind' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [success, folders]
                properties:
                  success: { type: boolean }
                  folders: { type: array, items: { $ref: '#/components/schemas/FolderConfig' } }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /scan:
    post:
      operationId: startScan
      tags: [scan]
      summary: Queue an asynchronous scan job
      description: Rate limited to 60 requests per hour per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder]
              properties:
                folder: { type: string, maxLength: 4096 }
                kind: { type: string, enum: [music, movies, tv-shows, downloads] }
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                required: [jobId, job]
                properties:
                  jobId: { type: string }
                  job: { $ref: '#/components/schemas/ScanJob' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '429':
          description: Rate limited
          headers:
            Retry-After: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [error, retryAfterSec]
                properties:
                  error: { type: string }
                  retryAfterSec: { type: integer }

  /scan/jobs:
    get:
      operationId: listScanJobs
      tags: [scan]
      summary: All in-memory scan jobs and the active count
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs, active]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/ScanJob' } }
                  active: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /scan/jobs/{id}:
    get:
      operationId: getScanJob
      tags: [scan]
      summary: One scan job by id
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/ScanJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /scan/jobs/{id}/ack:
    post:
      operationId: ackScanJob
      tags: [scan]
      summary: Free the job's payload from memory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /watch/events:
    get:
      operationId: getWatchEvents
      tags: [folders]
      summary: Poll watcher events since an id
      description: Plain JSON long-poll, not SSE.
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events, highWatermark, watchers]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/WatchEvent' } }
                  highWatermark: { type: integer }
                  watchers: { type: array, items: { $ref: '#/components/schemas/WatcherStatus' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /check-files:
    post:
      operationId: checkFiles
      tags: [fs]
      summary: Existence check for up to 10000 paths inside allowed folders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths: { type: array, maxItems: 10000, items: { type: string } }
      responses:
        '200':
          description: Map of path to existence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: boolean }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/ErrorJson' }

  /audio/native/probe:
    get:
      operationId: probeNativeAudio
      tags: [audio-native]
      summary: Presence beacon (loopback only, no token)
      security: []
      responses:
        '200':
          description: Beacon
          content:
            application/json:
              schema:
                type: object
                required: [ok, product, version, platform, headless, available, capabilities]
                properties:
                  ok: { type: boolean, const: true }
                  product: { type: string, const: MMOCompanion }
                  version: { type: string }
                  platform: { type: string }
                  headless: { type: boolean }
                  available: { type: boolean }
                  reason: { type: string }
                  capabilities: { type: array, items: { type: string } }
        '403': { $ref: '#/components/responses/ForbiddenLocalhost' }

  /audio/native/info:
    get:
      operationId: getNativeAudioInfo
      tags: [audio-native]
      summary: Native engine support, backends and running state
      security: []
      responses:
        '200':
          description: Engine info
          content:
            application/json:
              schema:
                type: object
                required: [supported, platform, backends, running]
                properties:
                  supported: { type: boolean }
                  platform: { type: string }
                  backends: { type: array, items: { $ref: '#/components/schemas/BackendInfo' } }
                  running: { type: boolean }
                  metrics: { $ref: '#/components/schemas/EngineMetrics' }
                  error: { type: string }
        '403': { $ref: '#/components/responses/ForbiddenLocalhost' }
        '500':
          description: Engine unavailable
          content:
            application/json:
              schema:
                type: object
                required: [supported, error]
                properties:
                  supported: { type: boolean, const: false }
                  error: { type: string }

  /audio/native/devices:
    get:
      operationId: listNativeAudioDevices
      tags: [audio-native]
      summary: Enumerate audio devices per backend
      security: []
      parameters:
        - { name: backend, in: query, schema: { $ref: '#/components/schemas/AudioBackend' } }
        - { name: refresh, in: query, schema: { type: string, enum: ['1'] }, description: Bust the inventory cache. }
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [backend, devices, backends, authorized]
                properties:
                  backend: { type: string }
                  devices: { type: array, items: { $ref: '#/components/schemas/AudioDevice' } }
                  backends: { type: array, items: { $ref: '#/components/schemas/NativeBackendGroup' } }
                  authorized: { type: array, items: { $ref: '#/components/schemas/AuthorizedAudioDevice' } }
        '403': { $ref: '#/components/responses/ForbiddenLocalhost' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /audio/native/start:
    post:
      operationId: startNativeAudio
      tags: [audio-native]
      summary: Start the native low-latency engine
      security: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/EngineConfig' }
                - type: object
                  properties:
                    inputDeviceName: { type: string }
                    inputBackend: { $ref: '#/components/schemas/AudioBackend' }
                    outputDeviceName: { type: string }
                    outputBackend: { $ref: '#/components/schemas/AudioBackend' }
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [success, metrics]
                properties:
                  success: { type: boolean, const: true }
                  metrics: { $ref: '#/components/schemas/EngineMetrics' }
        '403': { $ref: '#/components/responses/ForbiddenLocalhost' }
        '500':
          description: Engine failed to start
          content:
            application/json:
              schema:
                type: object
                required: [error, lastError]
                properties:
                  error: { type: string }
                  lastError: { type: [string, 'null'] }

  /audio/native/stop:
    post:
      operationId: stopNativeAudio
      tags: [audio-native]
      summary: Stop the native engine
      security: []
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '403': { $ref: '#/components/responses/ForbiddenLocalhost' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /audio/native/metrics:
    get:
      operationId: getNativeAudioMetrics
      tags: [audio-native]
      summary: Live engine metrics, DSP status and last detected pitch
