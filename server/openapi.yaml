                mode: { type: string, enum: [upload, native], default: upload }
      responses:
        '200':
          description: Job created
          content:
            application/json:
              schema:
                type: object
                required: [id, stage, format, mode]
                properties:
                  id: { type: string }
                  stage: { $ref: '#/components/schemas/RenderStage' }
                  format: { type: string, enum: [wav, mp3] }
                  mode: { type: string, enum: [upload, native] }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /render:
    get:
      operationId: renderList
      tags: [render]
      summary: List recent render jobs
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/RenderJob' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /render/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: renderGet
      tags: [render]
      summary: Render job status
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
    delete:
      operationId: renderDelete
      tags: [render]
      summary: Remove a render job
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /render/{id}/upload:
    post:
      operationId: renderUpload
      tags: [render]
      summary: Stream the bounced audio bytes into a job
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          '*/*':
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                type: object
                required: [id, stage, bytes]
                properties:
                  id: { type: string }
                  stage: { $ref: '#/components/schemas/RenderStage' }
                  bytes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /render/{id}/download:
    get:
      operationId: renderDownload
      tags: [render]
      summary: Download the rendered file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200':
          description: Audio
          content:
            audio/wav: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
        '206':
          description: Partial content
          content:
            audio/wav: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /projects/assets/upload:
    post:
      operationId: projectsUploadAsset
      tags: [projects]
      summary: Store a content-addressed asset blob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, name, bytes]
              properties:
                sha256: { type: string }
                name: { type: string }
                mimeType: { type: string }
                bytes: { type: string, contentEncoding: base64 }
      responses:
        '200':
          description: Stored asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAsset' }
        '400':
          description: Missing fields or digest mismatch
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  expected: { type: string }
                  actual: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /projects/assets/{sha256}:
    get:
      operationId: projectsGetAsset
      tags: [projects]
      summary: Stream a stored asset blob
      parameters:
        - { name: sha256, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Blob
          headers:
            X-Content-Sha256: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /projects/assets/register-local:
    post:
      operationId: projectsRegisterLocalAsset
      tags: [projects]
      summary: Register an existing local file as an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourcePath]
              properties:
                sourcePath: { type: string }
                sha256: { type: string }
                name: { type: string }
      responses:
        '200':
          description: Registered asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAsset' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /plugins:
    get:
      operationId: pluginsGetCached
      tags: [plugins]
      summary: Cached plugin inventory
      responses:
        '200':
          description: Inventory, or null before the first scan
          content:
            application/json:
              schema:
                type: object
                required: [cached]
                properties:
                  cached:
                    oneOf:
                      - { $ref: '#/components/schemas/PluginScanResult' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plugins/scan:
    post:
      operationId: pluginsScan
      tags: [plugins]
      summary: Run a full plugin scan
      description: Streams progress as SSE (events `progress`, `done`, `error`) unless `stream` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paths: { type: array, items: { type: string } }
                stream: { type: boolean, default: true }
      responses:
        '200':
          description: SSE progress or the scan result
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/PluginScanResult' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /plugins/describe:
    post:
      operationId: pluginsDescribe
      tags: [plugins]
      summary: Re-introspect a plugin already in the inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        '200':
          description: Plugin description
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /plugins/render:
    post:
      operationId: pluginsRenderStart
      tags: [plugins]
      summary: Enqueue an offline render through a plugin chain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, chain]
              properties:
                input: { type: string }
                chain: { type: array, items: { $ref: '#/components/schemas/PluginChainStep' } }
      responses:
        '200':
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                required: [id, stage]
                properties:
                  id: { type: string }
                  stage: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /plugins/render/{id}:
    get:
      operationId: pluginsRenderGet
      tags: [plugins]
      summary: Poll a plugin render job
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRenderStatus' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /plugins/render/{id}/audio:
    get:
      operationId: pluginsRenderAudio
      tags: [plugins]
      summary: Stream the rendered WAV
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200': { $ref: '#/components/responses/Wav' }
        '206': { $ref: '#/components/responses/Wav' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /plugins/status:
    get:
      operationId: pluginsStatus
      tags: [plugins]
      summary: Plugin host snapshot
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                type: object
                required: [inventory, scannedAt, renders]
                properties:
                  inventory: { type: integer }
                  scannedAt: { type: [integer, 'null'] }
                  renders: { type: array, items: { $ref: '#/components/schemas/PluginRenderStatus' } }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cast/devices:
    get:
      operationId: castListDevices
      tags: [cast]
      summary: DLNA and Home Assistant media players
      parameters:
        - { name: refresh, in: query, schema: { type: string, enum: ['1'] }, description: Force SSDP rediscovery. }
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [devices, haConfigured]
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/CastDevice' } }
                  haConfigured: { type: boolean }
                  errors: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cast/play:
    post:
      operationId: castPlay
      tags: [cast]
      summary: Play a URL on a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, url]
              properties:
                deviceId: { type: string, description: '`dlna:<udn>` or `ha:media_player.<id>`.' }
                url: { type: string }
                mime: { type: string, default: video/mp4 }
                title: { type: string, maxLength: 300, default: MixAI }
                thumb: { type: string }
                subtitleUrl: { type: string }
                startSec: { type: number }
      responses:
        '200':
          description: Playing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ErrorJson' }

  /cast/command:
    post:
      operationId: castCommand
      tags: [cast]
      summary: Transport or volume command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, action]
              properties:
                deviceId: { type: string }
                action: { type: string, enum: [play, pause, stop, seek, volume_set, volume_mute, next, previous] }
                value:
                  oneOf:
                    - { type: number }
                    - { type: boolean }
                  description: Seconds for `seek`, level for `volume_set`, flag for `volume_mute`.
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ErrorJson' }

  /cast/status/{deviceId}:
    get:
      operationId: castStatus
      tags: [cast]
      summary: Playback status of a device
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/DlnaStatus' }
                  - { $ref: '#/components/schemas/HaStatus' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ErrorJson' }

  /mixai-profile:
    get:
      operationId: profileGet
      tags: [profile]
      summary: Stored MIXAI profile blob for this user
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [profile, updatedAt]
                properties:
                  profile:
                    oneOf:
                      - { type: object, additionalProperties: true }
                      - { type: 'null' }
                  updatedAt: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: profilePut
      tags: [profile]
      summary: Store or replace the profile blob
      description: Maximum 256 KB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [success, updatedAt]
                properties:
                  success: { type: boolean }
                  updatedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/ErrorJson' }

  /v1/sync:
    post:
      operationId: syncPush
      tags: [sync]
      summary: Push remote changes into the companion
      description: Changes are enqueued to the local sync queue and applied asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/SyncChange' } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [ok, applied, errors]
                properties:
                  ok: { type: boolean }
                  applied: { type: integer }
                  errors:
                    type: array
                    items:
                      type: object
                      required: [index, error]
                      properties:
                        index: { type: integer }
                        error: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/ErrorJson' }

  /rest/{method}:
    parameters:
      - name: method
        in: path
        required: true
        schema: { type: string }
        description: |
          Subsonic method name, with or without the `.view` suffix — for
          example `ping.view`, `getArtists.view`, `search3`, `stream`,
          `getCoverArt`. Implemented: ping, getLicense,
          getOpenSubsonicExtensions, getMusicFolders, getIndexes, getArtists,
          getArtist, getAlbum, getSong, getGenres, getAlbumList2,
          getRandomSongs, getSongsByGenre, getStarred2, search3, star, unstar,
          setRating, scrobble, getPlaylists, getPlaylist, createPlaylist,
          updatePlaylist, deletePlaylist, stream, download, getCoverArt,
          getLyricsBySongId, getUser, getScanStatus, startScan.
    get:
      operationId: subsonicCall
      tags: [subsonic]
      summary: OpenSubsonic API call
      description: |
        Mounted without the companion device-token middleware. Authentication
        comes from query parameters, one of: `apiKey=<deviceToken>`;
        `u` + `t` + `s` where `t = md5(deviceToken + s)`; or `u` + `p`
        (plain or `enc:<hex>`). The username is informational. Mixing
        mechanisms answers error code 43, missing credentials 10, wrong
        credentials 40, unknown method 70. API-level errors are returned
        with HTTP 200 inside the envelope.

        `f=json` returns `{"subsonic-response": {...}}`, `f=jsonp` wraps it in
        `callback(...)`, the default is XML. `stream`, `download` and
        `getCoverArt` write the media bytes directly (range-aware).
      security: []
      parameters:
        - { name: u, in: query, schema: { type: string }, description: Username (any value). }
        - { name: p, in: query, schema: { type: string }, description: 'Device token, plain or enc:<hex>.' }
        - { name: t, in: query, schema: { type: string }, description: '`md5(deviceToken + s)` as lowercase hex.' }
        - { name: s, in: query, schema: { type: string }, description: Salt for `t`. }
        - { name: apiKey, in: query, schema: { type: string }, description: Device token (OpenSubsonic API key auth). }
        - { name: v, in: query, schema: { type: string }, description: Client API version. }
        - { name: c, in: query, schema: { type: string }, description: Client name. }
        - { name: f, in: query, schema: { type: string, enum: [xml, json, jsonp], default: xml } }
        - { name: callback, in: query, schema: { type: string }, description: JSONP callback name. }
      responses:
        '200':
          description: Envelope (JSON, XML or JSONP) or media bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubsonicResponse' }
            text/xml:
              schema: { type: string }
            application/javascript:
              schema: { type: string }
            '*/*':
              schema: { type: string, format: binary }
    post:
      operationId: subsonicCallPost
      tags: [subsonic]
      summary: OpenSubsonic API call via form POST
      description: Same as the GET form (`formPost` extension); form fields are merged with the query string.
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Envelope (JSON, XML or JSONP) or media bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubsonicResponse' }
            text/xml:
              schema: { type: string }
            application/javascript:
              schema: { type: string }
            '*/*':
              schema: { type: string, format: binary }

  # ---- media (Media Home brain, WP10) ---------------------------------------
  /media/status:
    get:
      operationId: mediaStatus
      tags: [media]
      summary: Media module status
      description: Configured API keys (booleans only), region/language, revision counters, server identity and push-sync state. Requires the device token — unlike `/video/probe` it reveals configuration and library size.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/etag:
    get:
      operationId: mediaEtag
      tags: [media]
      summary: Cheap poll for changes
      responses:
        '200':
          description: Revision counters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaEtag' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/library:
    get:
      operationId: mediaLibrary
      tags: [media]
      summary: Local video library index (full or delta)
      description: |
        Without `since` (or with a stale/future value) the response is the full index (`full: true`).
        With `since=<libraryEtag>` from a previous call only rows written after that etag are returned,
        plus the `removed` file ids (tombstones). `serverFileId` is the id `/video/direct/{fileId}` expects.
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: 'Previously seen libraryEtag.' }
      responses:
        '200':
          description: Library index
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryIndex' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/providers:
    get:
      operationId: mediaProviders
      tags: [media]
      summary: Streaming providers available in a region
      parameters:
        - { name: region, in: query, schema: { type: string }, description: 'ISO 3166-1 alpha-2; defaults to the server region.' }
      responses:
        '200':
          description: Provider catalog merged with launch data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/home:
    get:
      operationId: mediaHome
      tags: [media]
      summary: Home rows for a profile
      description: Empty `rows` (no error) when `TMDB_API_KEY` is not configured.
      parameters:
        - { name: profile, in: query, schema: { type: string, default: default } }
        - { name: region, in: query, schema: { type: string } }
        - { name: providers, in: query, schema: { type: string }, description: Comma-separated TMDB provider ids the user subscribes to. }
        - { name: force, in: query, schema: { type: string, enum: ['1'] }, description: Bypass the 24 h rows cache. }
      responses:
        '200':
          description: Home rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaHome' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/title/{kind}/{tmdbId}:
    get:
      operationId: mediaTitle
      tags: [media]
      summary: Title details, availability, local files and progress
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/MediaKind' } }
        - { name: tmdbId, in: path, required: true, schema: { type: integer } }
        - { name: region, in: query, schema: { type: string } }
        - { name: profile, in: query, schema: { type: string, default: default } }
      responses:
        '200':
          description: Title
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaTitleResponse' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '503':
          description: TMDB not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /media/search:
    get:
      operationId: mediaSearch
      tags: [media]
      summary: TMDB multi search (movies + tv), flags titles present locally
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: Search page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSearchPage' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/progress:
    get:
      operationId: mediaGetProgress
      tags: [media]
      summary: Watch progress for a profile
      description: '`since` is a revision watermark (from `revision` in any media response): only rows written after it are returned — the web → TV direction of progress sync.'
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/MediaKind' } }
        - { name: tmdbId, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: integer }, description: Revision watermark. }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        '200':
          description: Progress entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressList' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: mediaPutProgress
      tags: [media]
      summary: Upsert watch progress (single entry or batch)
      description: |
        Body is one `ProgressInput` or an array of 1..500. `completed` is derived at ≥ 90 % when omitted.
        Older `updatedAt` than the stored row is ignored (last-write-wins). Every write bumps `revision`
        and schedules a debounced push to the web app (`POST {webAppUrl}/api/media/sync`).
      parameters:
        - { name: profile, in: query, schema: { type: string }, description: 'Fallback profileId for entries without one.' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/ProgressInput' }
                - { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/ProgressInput' } }
      responses:
        '200':
          description: Stored entry (single) or entries (batch) plus the new revision
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [entry, revision]
                    properties:
                      entry: { $ref: '#/components/schemas/ProgressEntry' }
                      revision: { type: integer }
                  - type: object
                    required: [entries, revision]
                    properties:
                      entries: { type: array, items: { $ref: '#/components/schemas/ProgressEntry' } }
                      revision: { type: integer }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /media/plays:
    get:
      operationId: mediaListPlays
      tags: [media]
      summary: Recent music plays for a profile
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200':
          description: Plays, newest first
          content:
            application/json:
              schema:
                type: object
                required: [plays]
                properties:
                  plays: { type: array, items: { $ref: '#/components/schemas/TrackPlay' } }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: mediaRecordPlay
      tags: [media]
      summary: Record a music play
      parameters:
        - { name: profile, in: query, schema: { type: string }, description: 'Fallback profileId.' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackPlayInput' }
      responses:
        '201':
          description: Stored play
          content:
            application/json:
              schema:
                type: object
                required: [play, revision]
                properties:
                  play: { $ref: '#/components/schemas/TrackPlay' }
                  revision: { type: integer }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    deviceToken:
      type: apiKey
      in: header
      name: x-device-token
      description: Device token handed over during pairing. Compared in constant time.
    queryToken:
      type: apiKey
      in: query
      name: t
      description: Same device token as a query parameter; accepted only on routes that declare it.
  parameters:
    QueryT:
      name: t
      in: query
      schema: { type: string }
      description: Device token (alternative to the `x-device-token` header).
    QueryU:
      name: u
      in: query
      schema: { type: string }
      description: User id, copied into the `x-user-id` header.
    Range:
      name: Range
      in: header
      schema: { type: string }
      description: HTTP byte range, e.g. `bytes=0-`.
    TrackId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Numeric track id; non-numeric values answer 404.
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string }
      description: Opaque id returned by `/video/scan` or `/video/lookup`.
    VoiceId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    ErrorJson:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid device token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MissingUser:
      description: Missing `x-user-id` header
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenLocalhost:
      description: Rejected by the loopback guard (non-loopback socket, invalid Host or disallowed Origin)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EventStream:
      description: Server-sent events
      content:
        text/event-stream:
          schema: { type: string }
    Wav:
      description: WAV audio (range-aware)
      content:
        audio/wav:
          schema: { type: string, format: binary }
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: true
      properties:
        error: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    # ---- health / host ------------------------------------------------------
    Health:
      type: object
      required: [status, version, hostname, platform, uptime]
      properties:
        status: { type: string, const: ok }
        version: { type: string }
        hostname: { type: string }
        platform: { type: string }
        uptime: { type: number, description: Process uptime in seconds. }
    FolderKind:
      type: string
      enum: [music, movies, tv-shows, samples, recordings, other]
    FolderConfig:
      type: object
      required: [path]
      properties:
        path: { type: string }
        watch: { type: boolean }
        kind: { $ref: '#/components/schemas/FolderKind' }
    ServerInfo:
      type: object
      required: [hostname, platform, arch, cpus, totalMemory, freeMemory, folders]
      properties:
        hostname: { type: string }
        platform: { type: string }
        arch: { type: string }
        cpus: { type: integer }
        totalMemory: { type: integer }
        freeMemory: { type: integer }
        folders: { type: array, items: { $ref: '#/components/schemas/FolderConfig' } }
    ScanFolder:
      type: object
      required: [path, exists, label, kind, watch, watchActive, watchEvents, watchError]
      properties:
        path: { type: string }
        exists: { type: boolean }
        label: { type: string }
        kind: { $ref: '#/components/schemas/FolderKind' }
        watch: { type: boolean }
        watchActive: { type: boolean }
        watchEvents: { type: integer }
        watchError: { type: [string, 'null'] }
    CompanionMetrics:
      type: object
      required: [capturedAt, version, uptimeSeconds, memoryTotalBytes, memoryFreeBytes, processRssBytes, cpuCount, platform, drivesConnected, scanJobs, watchers]
      properties:
        capturedAt: { type: string, format: date-time }
        version: { type: string }
        uptimeSeconds: { type: integer }
        memoryTotalBytes: { type: integer }
        memoryFreeBytes: { type: integer }
        processRssBytes: { type: integer }
        cpuCount: { type: integer }
        platform: { type: string }
        drivesConnected: { type: integer }
        scanJobs:
          type: object
          required: [active, total, completed, failed, averageDurationSeconds, filesDiscovered, filesScanned, filesErrored]
          properties:
            active: { type: integer }
            total: { type: integer }
            completed: { type: integer }
            failed: { type: integer }
            averageDurationSeconds: { type: number }
            filesDiscovered: { type: integer }
            filesScanned: { type: integer }
            filesErrored: { type: integer }
        watchers:
          type: object
          required: [active, eventsTotal]
          properties:
            active: { type: integer }
            eventsTotal: { type: integer }
    Drive:
      type: object
      required: [path, label, type]
      properties:
        path: { type: string }
        label: { type: string }
        type: { type: string, enum: [fixed, removable, network, root, home, unknown] }
        free: { type: integer }
        total: { type: integer }
    FsEntry:
      type: object
      required: [name, path, hasChildren]
      properties:
        name: { type: string }
        path: { type: string }
        hasChildren: { type: [boolean, 'null'] }
    FsListing:
      type: object
      required: [path, parent, entries]
      properties:
        path: { type: string }
        parent: { type: [string, 'null'] }
        entries: { type: array, items: { $ref: '#/components/schemas/FsEntry' } }
        partial: { type: boolean }
    ScanJob:
      type: object
      required: [id, folder, kind, status, discovered, scanned, errored, currentFile, total, startedAt, finishedAt, error, tracks, videos, origin]
      properties:
        id: { type: string }
        folder: { type: string }
        kind: { type: string, enum: [audio, video] }
        status: { type: string, enum: [pending, discovering, scanning, complete, error, canceled] }
        discovered: { type: integer }
        scanned: { type: integer }
        errored: { type: integer }
        currentFile: { type: [string, 'null'] }
        total: { type: integer, description: '-1 while discovering.' }
        startedAt: { type: integer }
        finishedAt: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        tracks: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        videos: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        origin: { type: string, enum: [manual, watcher] }
    WatchEvent:
      type: object
      required: [id, folder, kind, filepath, payload, timestamp]
      properties:
        id: { type: integer }
        folder: { type: string }
        kind: { type: string, enum: [add, change, unlink] }
        filepath: { type: string }
        payload: { type: [object, 'null'], additionalProperties: true }
        timestamp: { type: integer }
    WatcherStatus:
      type: object
      required: [folder, active, readyAt, eventsSeen, error]
      properties:
        folder: { type: string }
        active: { type: boolean }
        readyAt: { type: [integer, 'null'] }
        eventsSeen: { type: integer }
        error: { type: [string, 'null'] }

    # ---- audio --------------------------------------------------------------
    AudioBackend:
      type: string
      enum: [auto, asio, wasapi, coreaudio, alsa, jack, pulse]
    AudioDevice:
      type: object
      required: [id, name, inputChannels, outputChannels, duplexChannels, isDefaultInput, isDefaultOutput, sampleRates, preferredSampleRate]
      properties:
        id: { type: integer }
        name: { type: string }
        inputChannels: { type: integer }
        outputChannels: { type: integer }
        duplexChannels: { type: integer }
        isDefaultInput: { type: boolean }
        isDefaultOutput: { type: boolean }
        sampleRates: { type: array, items: { type: integer } }
        preferredSampleRate: { type: integer }
    BackendInfo:
      type: object
      required: [backend, apiName, available]
      properties:
        backend: { $ref: '#/components/schemas/AudioBackend' }
        apiName: { type: string }
        available: { type: boolean }
    BackendDeviceGroup:
      allOf:
        - { $ref: '#/components/schemas/BackendInfo' }
        - type: object
          required: [devices]
          properties:
            devices: { type: array, items: { $ref: '#/components/schemas/AudioDevice' } }
    NativeBackendGroup:
      type: object
      required: [backend, available, devices]
      properties:
        backend: { type: string }
        available: { type: boolean }
        devices: { type: array, items: { $ref: '#/components/schemas/AudioDevice' } }
    AuthorizedAudioDevice:
      type: object
      required: [name, direction, backend]
      properties:
        name: { type: string }
        direction: { type: string, enum: [input, output] }
        backend: { type: string }
        preferredSampleRate: { type: number }
    ScaleConfig:
      type: object
      required: [keyIndex, intervals]
      properties:
        keyIndex: { type: integer, minimum: 0, maximum: 11 }
        intervals: { type: [array, 'null'], items: { type: integer } }
        amount: { type: number, minimum: 0, maximum: 1 }
    EngineConfig:
      type: object
      properties:
        inputDeviceId: { type: integer }
        outputDeviceId: { type: integer }
        sampleRate: { type: integer }
        frameSize: { type: integer }
        backend: { $ref: '#/components/schemas/AudioBackend' }
        autoCorrect: { type: boolean }
        formantPreserve: { type: boolean }
        scale: { $ref: '#/components/schemas/ScaleConfig' }
        minimizeLatency: { type: boolean }
        realtimeSchedule: { type: boolean }
        exclusiveMode: { type: boolean }
    EngineMetrics:
      type: object
      required: [running, backend, sampleRate, frameSize, streamLatencyFrames, streamLatencyMs, dspBlockMaxMs, dspBlockAvgMs, underruns, callbackCount, inputChannels, outputChannels, lastError, outputBufferDepthMs, bufferFlushes, inPeak, outPeak, inRms, outRms]
      properties:
        running: { type: boolean }
        backend: { type: string }
        sampleRate: { type: integer }
        frameSize: { type: integer }
        streamLatencyFrames: { type: integer }
        streamLatencyMs: { type: number }
        dspBlockMaxMs: { type: number }
        dspBlockAvgMs: { type: number }
        underruns: { type: integer }
        callbackCount: { type: integer }
        inputChannels: { type: integer }
        outputChannels: { type: integer }
        lastError: { type: [string, 'null'] }
        outputBufferDepthMs: { type: number }
        bufferFlushes: { type: integer }
        inPeak: { type: number }
        outPeak: { type: number }
        inRms: { type: number }
        outRms: { type: number }
    PitchInfo:
      type: object
      required: [frequency, midi, exactMidi, confidence, cents, rms]
      properties:
        frequency: { type: number }
        midi: { type: number }
        exactMidi: { type: number }
        confidence: { type: number }
        cents: { type: number }
        rms: { type: number }
    DspStatus:
      type: object
      required: [ratio, targetRatio, sourceMidi, targetMidi, rms]
      properties:
        ratio: { type: number }
        targetRatio: { type: number }
        sourceMidi: { type: [number, 'null'] }
        targetMidi: { type: [number, 'null'] }
        rms: { type: number }

    # ---- pair ---------------------------------------------------------------
    PairInfo:
      type: object
      required: [name, version, lanUrl, port, pairingSupported, hasToken]
      properties:
        name: { type: string, description: Host name of the companion. }
        version: { type: string }
        lanUrl: { type: [string, 'null'], examples: ['http://192.168.1.10:17899'] }
        port: { type: integer }
        pairingSupported: { type: boolean }
        hasToken: { type: boolean }
    PairRequest:
      type: object
      properties:
        deviceName: { type: string, maxLength: 64, default: Unknown device }
        platform: { type: string, maxLength: 64, default: unknown }
    PairRequestResponse:
      type: object
      required: [code, secret, expiresAt, qr, approveUrl]
      properties:
        code: { type: string, pattern: '^\d{6}$' }
        secret: { type: string, description: 64 hex characters. }
        expiresAt: { type: integer, description: Epoch milliseconds. }
        qr: { type: string, examples: ['mixai://pair?host=192.168.1.10&port=17899&code=123456'] }
        approveUrl: { type: string, examples: ['https://mixai.ro/pair?host=192.168.1.10&port=17899&code=123456'] }
    PairStatus:
      type: string
      enum: [pending, approved, expired]
    PairPollResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/PairStatus' }
        deviceToken: { type: string, description: Present only when `status` is `approved`. }
        userId: { type: [string, 'null'], description: Present only when `status` is `approved`. }
    PairApproveRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^\d{6}$' }
    PairApproveResponse:
      type: object
      required: [ok, code]
      properties:
        ok: { type: boolean }
        code: { type: string }
    PairPending:
      type: object
      required: [code, deviceName, platform, createdAt, expiresAt, approved]
      properties:
        code: { type: string }
        deviceName: { type: string }
        platform: { type: string }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        approved: { type: boolean }

    # ---- library ------------------------------------------------------------
    Track:
      type: object
      description: 'Row of the companion tracks table. Every field except id, userId, filepath and filename is nullable.'
      properties:
        id: { type: integer }
        userId: { type: string }
        filepath: { type: string }
        filename: { type: string }
        artist: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        album: { type: [string, 'null'] }
        remix: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        bpm: { type: [number, 'null'] }
        keyCamelot: { type: [string, 'null'] }
        keyMusical: { type: [string, 'null'] }
        duration: { type: [integer, 'null'] }
        energy: { type: [integer, 'null'] }
        genre: { type: [string, 'null'] }
        subgenre: { type: [string, 'null'] }
        mood: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        vocalType: { type: [string, 'null'] }
        setPosition: { type: [string, 'null'] }
        mixability: { type: [integer, 'null'] }
        isProcessed: { type: [boolean, 'null'] }
        fileSize: { type: [integer, 'null'] }
        format: { type: [string, 'null'] }
        bitrate: { type: [integer, 'null'] }
        sampleRate: { type: [integer, 'null'] }
        addedAt: { type: [string, 'null'] }
        analyzedAt: { type: [string, 'null'] }
        rating: { type: [integer, 'null'] }
        isFavorite: { type: [boolean, 'null'] }
        tags: { type: [string, 'null'], description: JSON-encoded string array. }
        artworkUrl: { type: [string, 'null'] }
        musicbrainzId: { type: [string, 'null'] }
        releaseMbid: { type: [string, 'null'] }
        isrc: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        comment: { type: [string, 'null'] }
        lyrics: { type: [string, 'null'] }
        syncedLyrics: { type: [string, 'null'] }
        isHidden: { type: [boolean, 'null'] }
        sourceUrl: { type: [string, 'null'] }
        sourcePlatform: { type: [string, 'null'] }
        sourceId: { type: [string, 'null'] }
        relatedTrackId: { type: [integer, 'null'] }
        deviceId: { type: [string, 'null'] }
        isOfflineAvailable: { type: [boolean, 'null'] }
        stemsStatus: { type: [string, 'null'] }
        stemsVocalsPath: { type: [string, 'null'] }
        stemsDrumsPath: { type: [string, 'null'] }
        stemsBassPath: { type: [string, 'null'] }
        stemsMelodyPath: { type: [string, 'null'] }
        stemsAnalyzedAt: { type: [string, 'null'] }
        stemsModel: { type: [string, 'null'] }
        stemsError: { type: [string, 'null'] }
        loudnessLufs: { type: [number, 'null'] }
        loudnessTruePeakDbfs: { type: [number, 'null'] }
        loudnessRangeLu: { type: [number, 'null'] }
        acoustidFingerprint: { type: [string, 'null'] }
        acoustidId: { type: [string, 'null'] }
        bpmConfidence: { type: [number, 'null'] }
        keyConfidence: { type: [number, 'null'] }
        beats: { type: [string, 'null'], description: JSON-encoded number array. }
        downbeats: { type: [string, 'null'], description: JSON-encoded number array. }
        chordProgression: { type: [string, 'null'], description: JSON-encoded array. }
        structureSegments: { type: [string, 'null'], description: JSON-encoded array. }
        dspAnalyzedAt: { type: [string, 'null'] }
        sha256: { type: [string, 'null'] }
        fieldVersions: { type: [string, 'null'], description: JSON-encoded map of column to ISO-8601 timestamp. }
    Playlist:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        userId: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'] }
        externalId: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'] }
    ScanLog:
      type: object
      required: [id, userId, action, filepath]
      properties:
        id: { type: integer }
        userId: { type: string }
        action: { type: string }
        filepath: { type: string }
        details: { type: [string, 'null'] }
        scannedAt: { type: [string, 'null'] }
    Download:
      type: object
      required: [url]
      properties:
        id: { type: integer }
        userId: { type: string }
        url: { type: string }
        title: { type: [string, 'null'] }
        artist: { type: [string, 'null'] }
        duration: { type: [integer, 'null'] }
        thumbnail: { type: [string, 'null'] }
        extractor: { type: [string, 'null'] }
        filePath: { type: [string, 'null'] }
        fileSize: { type: [integer, 'null'] }
        format: { type: [string, 'null'] }
        quality: { type: [string, 'null'] }
        status: { type: string }
        trackId: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        downloadedAt: { type: [string, 'null'] }
    SavedDrive:
      type: object
      required: [id, userId, path, label, type]
      properties:
        id: { type: integer }
        userId: { type: string }
        path: { type: string }
        label: { type: string }
        type: { type: string }
        format: { type: [string, 'null'] }
        isActive: { type: [boolean, 'null'] }
        createdAt: { type: [string, 'null'] }
    DriveInfo:
      type: object
      required: [path, label, format, totalSize, freeSpace, usedSpace, type]
      properties:
        path: { type: string }
        label: { type: string }
        format: { type: string }
        totalSize: { type: number }
        freeSpace: { type: number }
        usedSpace: { type: number }
        type: { type: string, enum: [fixed, removable, network, unknown] }
    RekordboxDriveStatus:
      type: object
      required: [hasClassic, hasDeviceLibraryPlus, hasOneLibrary, hasContents, trackCount, dbBytes]
      properties:
        hasClassic: { type: boolean }
        hasDeviceLibraryPlus: { type: boolean }
        hasOneLibrary: { type: boolean }
        hasContents: { type: boolean }
        trackCount: { type: integer }
        dbBytes: { type: integer }
    AnnotatedDrive:
      allOf:
        - { $ref: '#/components/schemas/DriveInfo' }
        - type: object
          required: [rekordbox]
          properties:
            rekordbox:
              oneOf:
                - { $ref: '#/components/schemas/RekordboxDriveStatus' }
                - { type: 'null' }
    LibraryStats:
      type: object
      required: [total, processed, unprocessed, analyzed, favorites, avgBpm, totalDuration, totalSize, playlistCount, genreStats, energyStats, bpmRanges, keyStats, formatStats, health, recentTracks, topRated]
      properties:
        total: { type: integer }
        processed: { type: integer }
        unprocessed: { type: integer }
        analyzed: { type: integer }
        favorites: { type: integer }
        avgBpm: { type: integer }
        totalDuration: { type: number }
        totalSize: { type: number }
        playlistCount: { type: integer }
        genreStats:
          type: array
          items:
            type: object
            required: [genre, count]
            properties:
              genre: { type: string }
              count: { type: integer }
        energyStats:
          type: array
          items:
            type: object
            required: [energy, count]
            properties:
              energy: { type: integer }
              count: { type: integer }
        bpmRanges:
          type: array
          items:
            type: object
            required: [range, count]
            properties:
              range: { type: string }
              count: { type: integer }
        keyStats:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string }
              count: { type: integer }
        formatStats:
          type: array
          items:
            type: object
            required: [format, count]
            properties:
              format: { type: string }
              count: { type: integer }
        health:
          type: object
          required: [total, missingGenre, missingBpm, missingKey, missingEnergy, missingArtwork]
          properties:
            total: { type: integer }
            missingGenre: { type: integer }
            missingBpm: { type: integer }
            missingKey: { type: integer }
            missingEnergy: { type: integer }
            missingArtwork: { type: integer }
        recentTracks: { type: array, items: { $ref: '#/components/schemas/Track' } }
        topRated: { type: array, items: { $ref: '#/components/schemas/Track' } }
    AnalyzeCategory:
      type: string
      enum: [dsp, stems, fingerprint]
    CategoryOrAll:
      type: string
      enum: [dsp, stems, fingerprint, all]
      default: all
    AnalyzeOptions:
      type: object
      properties:
        dsp: { type: boolean, default: true }
        fingerprint: { type: boolean, default: false }
        stems: { type: boolean, default: false }
        stemsModel: { type: string }
        metadata: { type: boolean, default: false }
        metaFields:
          type: object
          properties:
            tags: { type: boolean }
            artwork: { type: boolean }
            lyrics: { type: boolean }
            bpm: { type: boolean }
    JobRef:
      type: object
      required: [id, trackId]
      properties:
        id: { type: string }
        trackId: { type: integer }
    AnalyzeJob:
      type: object
      required: [id, trackId, path, enqueuedAt, stage]
      properties:
        id: { type: string }
        requestId: { type: string }
        batchId: { type: string }
        batchLabel: { type: string }
        category: { $ref: '#/components/schemas/AnalyzeCategory' }
        trackId: { type: integer }
        path: { type: string }
        options: { $ref: '#/components/schemas/AnalyzeOptions' }
        enqueuedAt: { type: number }
        startedAt: { type: number }
        finishedAt: { type: number }
        progress: { type: number }
        stage: { type: string, description: 'One of queued, dsp, fp, stems, done, error, canceled.' }
        message: { type: string }
        state: { type: string }
        data: { type: object, additionalProperties: true }
        error: { type: string }
    QueuedJob:
      type: object
      required: [id, trackId, enqueuedAt, stage]
      properties:
        id: { type: string }
        trackId: { type: integer }
        enqueuedAt: { type: number }
        stage: { type: string }
        category: { $ref: '#/components/schemas/AnalyzeCategory' }
    LaneStatus:
      type: object
      required: [category, paused, current, queue, queueDepth]
      properties:
        category: { $ref: '#/components/schemas/AnalyzeCategory' }
        paused: { type: boolean }
        current:
          oneOf:
            - { $ref: '#/components/schemas/AnalyzeJob' }
            - { type: 'null' }
        queue: { type: array, items: { $ref: '#/components/schemas/QueuedJob' } }
        queueDepth: { type: integer }
    AnalyzerStatus:
      type: object
      required: [current, queue, completed, lanes, paused, anyPaused]
      properties:
        current:
          oneOf:
            - { $ref: '#/components/schemas/AnalyzeJob' }
            - { type: 'null' }
        queue: { type: array, items: { $ref: '#/components/schemas/QueuedJob' } }
        completed:
          type: array
          items:
            type: object
            required: [id, trackId, stage]
            properties:
              id: { type: string }
              trackId: { type: integer }
              stage: { type: string }
              error: { type: string }
              startedAt: { type: number }
              finishedAt: { type: number }
              category: { $ref: '#/components/schemas/AnalyzeCategory' }
        lanes: { type: array, items: { $ref: '#/components/schemas/LaneStatus' } }
        paused: { type: boolean }
        anyPaused: { type: boolean }
        finishedSince: { type: integer, description: Present only when `since` was given. }
    BatchSummary:
      type: object
      required: [batchId, label, total, tracks, tracksFinished, queued, running, done, errored, canceled, finished, progress, state, categories, enqueuedAt, startedAt, finishedAt, lanes]
      properties:
        batchId: { type: string }
        label: { type: string }
        total: { type: integer }
        tracks: { type: integer }
        tracksFinished: { type: integer }
        queued: { type: integer }
        running: { type: integer }
        done: { type: integer }
        errored: { type: integer }
        canceled: { type: integer }
        finished: { type: integer }
        progress: { type: number }
        state: { type: string, enum: [running, done, error] }
        categories: { type: array, items: { $ref: '#/components/schemas/AnalyzeCategory' } }
        enqueuedAt: { type: number }
        startedAt: { type: [number, 'null'] }
        finishedAt: { type: [number, 'null'] }
        lanes: { type: array, items: { type: object, additionalProperties: true } }
    GpuInfo:
      type: object
      required: [hasNvidia, gpuName, cudaRuntime, onnxPackage, onnxProviders, onnxGpuActive, torchCuda, recommendation]
      properties:
        hasNvidia: { type: boolean }
        gpuName: { type: [string, 'null'] }
        cudaRuntime: { type: [string, 'null'] }
        onnxPackage: { type: [string, 'null'] }
        onnxProviders: { type: array, items: { type: string } }
        onnxGpuActive: { type: boolean }
        torchCuda: { type: boolean }
        recommendation: { type: string, enum: [ready, install_onnx_gpu, install_cuda_runtime, no_gpu] }
    AnalyzerHealthReport:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        pythonPath: { type: string }
        pythonVersion: { type: string }
        pythonExecutable: { type: string }
        available: { type: object, additionalProperties: { type: boolean } }
        gpu: { $ref: '#/components/schemas/GpuInfo' }
        reason: { type: string }
    AnalyzerLogEntry:
      type: object
      required: [seq, ts, level, message]
      properties:
        seq: { type: integer }
        ts: { type: number }
        level: { type: string, enum: [info, warn, error, debug] }
        message: { type: string }
        jobId: { type: string }

    # ---- video --------------------------------------------------------------
    VideoFlags:
      type: object
      required: [preRemuxAutoOnScan]
      properties:
        preRemuxAutoOnScan: { type: boolean }
    ParsedFilename:
      type: object
      required: [title, year, season, episode]
      properties:
        title: { type: string }
        year: { type: [integer, 'null'] }
        season: { type: [integer, 'null'] }
        episode: { type: [integer, 'null'] }
    AudioTrack:
      type: object
      required: [index, codec, channels, lang, title]
      properties:
        index: { type: integer }
        codec: { type: string }
        channels: { type: integer }
        lang: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
    SubtitleTrack:
      type: object
      required: [index, codec, lang, title, forced]
      properties:
        index: { type: integer }
        codec: { type: string }
        lang: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        forced: { type: boolean }
    VideoFile:
      type: object
      description: One entry of `POST /video/scan` `files`.
      required: [fileId, parsed, path, sizeBytes, mtime, container, videoCodec, audioCodec, width, height, durationSec, bitrateKbps, hdr, audioTracks, subtitleTracks]
      properties:
        fileId: { type: string }
        parsed: { $ref: '#/components/schemas/ParsedFilename' }
        path: { type: string }
        sizeBytes: { type: integer }
        mtime: { type: string, format: date-time }
        container: { type: [string, 'null'] }
        videoCodec: { type: [string, 'null'] }
        audioCodec: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        durationSec: { type: [number, 'null'] }
        bitrateKbps: { type: [integer, 'null'] }
        hdr: { type: [string, 'null'], enum: [sdr, hdr10, hlg, dolby, null] }
        audioTracks: { type: array, items: { $ref: '#/components/schemas/AudioTrack' } }
        subtitleTracks: { type: array, items: { $ref: '#/components/schemas/SubtitleTrack' } }
    VideoScanResult:
      type: object
      required: [files, rootsScanned]
      properties:
        files: { type: array, items: { $ref: '#/components/schemas/VideoFile' } }
        rootsScanned: { type: integer, description: Roots answered from the registry. }
        pendingRoots:
          type: array
          items: { type: string }
          description: Roots with no registered files yet; a scan job was enqueued for each.
        jobIds:
          type: array
          items: { type: string }
          description: Scan job ids (one per pending root), pollable via `/scan/jobs/{id}`.
    VideoInfo:
      allOf:
        - { $ref: '#/components/schemas/VideoFile' }
        - type: object
          required: [hasSidecar]
          properties:
            hasSidecar: { type: boolean }
    TimeRange:
      type: object
      properties:
        start: { type: number }
        end: { type: number }
    SubtitleResult:
      type: object
      required: [provider, id, language, title, downloadToken]
      properties:
        provider: { type: string, enum: [opensubtitles, addic7ed] }
        id: { type: string }
        language: { type: string }
        title: { type: string }
        release: { type: string }
        downloads: { type: integer }
        downloadToken: { type: string }
    PreRemuxJob:
      type: object
      required: [fileId, sourcePath, sidecarPath, status, progress, durationSec, error, enqueuedAt, startedAt, finishedAt]
      properties:
        fileId: { type: string }
        sourcePath: { type: string }
        sidecarPath: { type: string }
        status: { type: string, enum: [queued, running, done, failed, skipped] }
        progress: { type: number, minimum: 0, maximum: 1 }
        durationSec: { type: [number, 'null'] }
        error: { type: [string, 'null'] }
        enqueuedAt: { type: integer }
        startedAt: { type: [integer, 'null'] }
        finishedAt: { type: [integer, 'null'] }
    PartyMember:
      type: object
      required: [id, userId, name]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
    PartyRoomState:
      type: object
      required: [playing, timeSec, lastUpdatedMs]
      properties:
        fileId: { type: string }
        title: { type: string }
        playing: { type: boolean }
        timeSec: { type: number }
        lastUpdatedMs: { type: integer }

    # ---- voice --------------------------------------------------------------
    VoiceEngine:
      type: string
      enum: [xtts, f5]
    VoiceMeta:
      type: object
      required: [id, name, engine, language, samples, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        engine: { $ref: '#/components/schemas/VoiceEngine' }
        language: { type: string }
        samples: { type: array, items: { type: string } }
        notes: { type: string }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    VoiceHealth:
      type: object
      required: [engines, languages, romanianFallback, sidecarReady, pendingJobs]
      properties:
        engines:
          type: object
          required: [xtts, f5]
          properties:
            xtts: { type: boolean }
            f5: { type: boolean }
        languages: { type: array, items: { type: string } }
        romanianFallback: { type: string }
        sidecarReady: { type: boolean }
        pendingJobs: { type: integer }
    VoiceRenderResult:
      type: object
      required: [renderId, durationSec, sampleRate, engine, streamUrl]
      properties:
        renderId: { type: string }
        durationSec: { type: number }
        sampleRate: { type: integer }
        engine: { $ref: '#/components/schemas/VoiceEngine' }
        language: { type: string }
        streamUrl: { type: string }
    VoiceAnalyzeRequest:
      type: object
      properties:
        expectedText: { type: string }
        language: { type: string }
        intent: { type: string }
    EngineStatus:
      type: object
      required: [id, ready, installed, capabilities]
      properties:
        id: { type: string, enum: [demucs, rvc, ace-step, fish-speech] }
        ready: { type: boolean }
        installed: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        version: { type: string }
        device: { type: object, additionalProperties: true }
        installHint: { type: [string, 'null'] }
        error: { type: string }
        extra: { type: object, additionalProperties: true }

    # ---- render / projects / plugins ----------------------------------------
    RenderStage:
      type: string
      enum: [queued, uploading, ready, error]
    RenderJob:
      type: object
      required: [id, projectExternalId, format, mode, stage, bytes, createdAt]
      properties:
        id: { type: string }
        projectExternalId: { type: string }
        format: { type: string, enum: [wav, mp3] }
        mode: { type: string, enum: [upload, native] }
        stage: { $ref: '#/components/schemas/RenderStage' }
        bytes: { type: integer }
        error: { type: string }
        createdAt: { type: integer }
        finishedAt: { type: integer }
    ProjectAsset:
      type: object
      required: [sha256, path, size]
      properties:
        sha256: { type: string }
        path: { type: string }
        size: { type: integer }
        deduped: { type: boolean, description: Present only when the blob already existed. }
    PluginParameter:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        label: { type: string }
        type: { type: string }
        min_value: { type: number }
        max_value: { type: number }
        step_size: { type: number }
        valid_values: { type: array, items: { type: string } }
        string_value: { type: string }
        raw_value: { type: number }
        default_raw_value: { type: number }
    PluginDescriptor:
      type: object
      required: [path, name, manufacturer, format, isInstrument, isEffect, parameters]
      properties:
        path: { type: string }
        name: { type: string }
        manufacturer: { type: string }
        format: { type: string }
        isInstrument: { type: boolean }
        isEffect: { type: boolean }
        parameters: { type: array, items: { $ref: '#/components/schemas/PluginParameter' } }
    PluginScanResult:
      type: object
      required: [scannedAt, inventory, failures, roots]
      properties:
        scannedAt: { type: integer }
        inventory: { type: array, items: { $ref: '#/components/schemas/PluginDescriptor' } }
        failures:
          type: array
          items:
            type: object
            required: [path, error]
            properties:
              path: { type: string }
              error: { type: string }
        roots: { type: array, items: { type: string } }
    PluginChainStep:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Must already be in the cached inventory. }
        params:
          type: object
          additionalProperties:
            oneOf:
              - { type: number }
              - { type: string }
              - { type: boolean }
        bypass: { type: boolean }
    PluginRenderStatus:
      type: object
      required: [id, stage, progress, message]
      properties:
        id: { type: string }
        stage: { type: string, description: 'One of queued, render, done, error.' }
        progress: { type: number, minimum: 0, maximum: 1 }
        message: { type: string }
        error: { type: string }
        durationSec: { type: number }
        startedAt: { type: integer }
        finishedAt: { type: integer }

    # ---- cast / sync / subsonic ---------------------------------------------
    CastDevice:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string }
        kind: { type: string, enum: [dlna, home-assistant, google-cast-ha] }
        name: { type: string }
        state: { type: string }
        model: { type: string }
    DlnaStatus:
      type: object
      required: [state, positionSec, durationSec, uri]
      properties:
        state: { type: string }
        positionSec: { type: [number, 'null'] }
        durationSec: { type: [number, 'null'] }
        uri: { type: [string, 'null'] }
    HaStatus:
      type: object
      required: [state, positionSec, durationSec, title, volume]
      properties:
        state: { type: string }
        positionSec: { type: [number, 'null'] }
        durationSec: { type: [number, 'null'] }
        title: { type: [string, 'null'] }
        volume: { type: [number, 'null'] }
    SyncChange:
      type: object
      required: [entity, entityId, op, updatedAt]
      additionalProperties: true
      properties:
        entity:
          type: string
          enum: [tracks, playlists, playlist_tracks, tags, track_tags, cuepoints, daw_projects, editor_projects, live_sessions, mixer_setups, visualization_presets, project_snapshots, project_assets, daw_tracks, daw_clips, editor_regions, live_cues, mixer_channels, viz_layers]
        entityId: { type: string, minLength: 1, maxLength: 256 }
        op: { type: string, enum: [upsert, delete] }
        updatedAt: { type: string, format: date-time }
    SubsonicResponse:
      type: object
      required: [subsonic-response]
      properties:
        subsonic-response:
          type: object
          additionalProperties: true
          required: [status, version, type, serverVersion, openSubsonic]
          properties:
            status: { type: string, enum: [ok, failed] }
            version: { type: string }
            type: { type: string }
            serverVersion: { type: string }
            openSubsonic: { type: boolean }
            error:
              type: object
              required: [code, message]
              properties:
                code: { type: integer }
                message: { type: string }

    # ---- media (Media Home brain) -------------------------------------------
    MediaKind:
      type: string
      enum: [movie, tv]
    OfferType:
      type: string
      enum: [subscription, rent, buy, free, ads]
    LaunchData:
      type: object
      required: [web, search]
      description: How to open a title on a provider — exact deep link when known, otherwise the provider's search page; native intents for TVs.
      properties:
        web: { type: string, format: uri }
        search: { type: string, format: uri }
        android:
          type: object
          required: [package]
          properties:
            package: { type: string }
            uri: { type: string }
        tizen:
          type: object
          required: [appId]
          properties:
            appId: { type: string }
            payload: { type: string }
    Offer:
      type: object
      required: [providerId, name, logo, type, launch]
      properties:
        providerId: { type: integer, description: TMDB watch-provider id. }
        name: { type: string }
        logo: { type: [string, 'null'], description: TMDB logo path. }
        type: { $ref: '#/components/schemas/OfferType' }
        link: { type: string, format: uri, description: 'Exact deep link (Movie of the Night); absent with TMDB/JustWatch data.' }
        launch: { $ref: '#/components/schemas/LaunchData' }
    Availability:
      type: object
      required: [offers, source, attribution]
      properties:
        offers: { type: array, items: { $ref: '#/components/schemas/Offer' } }
        source: { type: string, enum: [motn, tmdb, none] }
        attribution: { type: array, items: { type: string }, description: 'Data-source credits that must be shown (JustWatch, Movie of the Night).' }
        fetchedAt: { type: integer }
    TitleCard:
      type: object
      required: [kind, tmdbId, title, posterPath, backdropPath, genreIds]
      properties:
        kind: { $ref: '#/components/schemas/MediaKind' }
        tmdbId: { type: integer }
        title: { type: string }
        originalTitle: { type: string }
        overview: { type: string }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        releaseDate: { type: string }
        voteAverage: { type: number }
        voteCount: { type: integer }
        popularity: { type: number }
        genreIds: { type: array, items: { type: integer } }
        inLibrary: { type: boolean, description: "Present in this server's library_index." }
        progress: { type: number, minimum: 0, maximum: 1, description: Watched fraction (continue rows). }
        reason: { type: string }
    Person:
      type: object
      required: [id, name, role, profilePath]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        profilePath: { type: [string, 'null'] }
    TitleDetails:
      allOf:
        - { $ref: '#/components/schemas/TitleCard' }
        - type: object
          required: [genres, keywords, cast, crew, externalIds, videos, logoPath, recommendations, similar, watchProviders]
          properties:
            runtime: { type: integer }
            status: { type: string }
            tagline: { type: string }
            genres: { type: array, items: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } } }
            keywords: { type: array, items: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } } }
            cast: { type: array, items: { $ref: '#/components/schemas/Person' } }
            crew: { type: array, items: { $ref: '#/components/schemas/Person' } }
            collectionId: { type: [integer, 'null'] }
            numberOfSeasons: { type: integer }
            numberOfEpisodes: { type: integer }
            externalIds: { type: object, additionalProperties: true }
            videos:
              type: array
              items:
                type: object
                required: [key, site, type, name]
                properties:
                  key: { type: string }
                  site: { type: string }
                  type: { type: string }
                  name: { type: string }
            logoPath: { type: [string, 'null'] }
            certification: { type: string }
            recommendations: { type: array, items: { $ref: '#/components/schemas/TitleCard' } }
            similar: { type: array, items: { $ref: '#/components/schemas/TitleCard' } }
            watchProviders: { type: object, additionalProperties: true, description: 'Raw TMDB watch/providers.results keyed by region.' }
    HomeRow:
      type: object
      required: [id, title, kind, items]
      properties:
        id: { type: string, description: 'Stable row id (continue, trending, because:<tmdbId>, provider:<id>, …).' }
        title:
          type: object
          required: [ro, en]
          properties:
            ro: { type: string }
            en: { type: string }
        kind: { type: string, enum: [mixed, movie, tv] }
        items: { type: array, items: { $ref: '#/components/schemas/TitleCard' } }
        reason: { type: string }
    MediaHome:
      type: object
      required: [region, profile, configured, revision, libraryEtag, serverId, serverName, rows]
      properties:
        region: { type: string }
        profile: { type: string }
        configured: { type: boolean, description: TMDB key present; rows are empty when false. }
        revision: { type: integer }
        libraryEtag: { type: integer }
        serverId: { type: [string, 'null'], description: Device id of this server (attribution in multi-server setups). }
        serverName: { type: string }
        rows: { type: array, items: { $ref: '#/components/schemas/HomeRow' } }
    LibraryIndexRow:
      type: object
      required: [serverFileId, kind, tmdbId, season, episode, path, size, mtime, updatedAt]
      properties:
        serverFileId: { type: string, description: 'Same id as /video/direct/{fileId}.' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        tmdbId: { type: [integer, 'null'], description: Null when the title could not be matched (or no TMDB key). }
        season: { type: [integer, 'null'] }
        episode: { type: [integer, 'null'] }
        path: { type: string }
        size: { type: integer }
        mtime: { type: integer }
        updatedAt: { type: integer }
        rev: { type: integer, description: Library etag at which this row was last written. }
    LibraryIndex:
      type: object
      required: [revision, full, items, removed, serverId, serverName]
      properties:
        revision: { type: integer, description: 'Current libraryEtag; pass back as since.' }
        full: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/LibraryIndexRow' } }
        removed: { type: array, items: { type: string }, description: 'File ids removed since `since` (empty on a full response).' }
        serverId: { type: [string, 'null'] }
        serverName: { type: string }
    MediaTitleResponse:
      type: object
      required: [title, availability, files, progress, serverId, serverName]
      properties:
        title: { $ref: '#/components/schemas/TitleDetails' }
        availability: { $ref: '#/components/schemas/Availability' }
        files: { type: array, items: { $ref: '#/components/schemas/LibraryIndexRow' } }
        progress: { type: array, items: { $ref: '#/components/schemas/ProgressEntry' } }
        serverId: { type: [string, 'null'] }
        serverName: { type: string }
    MediaSearchPage:
      type: object
      required: [page, totalPages, results]
      properties:
        page: { type: integer }
        totalPages: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/TitleCard' } }
    ProviderCatalog:
      type: object
      required: [region, fetchedAt, providers]
      properties:
        region: { type: string }
        fetchedAt: { type: integer }
        providers:
          type: array
          items:
            type: object
            required: [providerId, key, name, logo, displayPriority, launch]
            properties:
              providerId: { type: integer }
              key: { type: string }
              name: { type: string }
              logo: { type: [string, 'null'] }
              displayPriority: { type: integer }
              launch: { $ref: '#/components/schemas/LaunchData' }
    ProgressInput:
      type: object
      required: [kind, tmdbId, positionSec]
      properties:
        profileId: { type: string, description: 'Required unless ?profile= is given.' }
        kind: { $ref: '#/components/schemas/MediaKind' }
        tmdbId: { type: integer, minimum: 1 }
        season: { type: integer, minimum: 0, default: 0 }
        episode: { type: integer, minimum: 0, default: 0 }
        positionSec: { type: number, minimum: 0 }
        durationSec: { type: number, minimum: 0, default: 0 }
        completed: { type: boolean }
        updatedAt: { type: integer, description: Epoch ms; defaults to server time. }
    ProgressEntry:
      type: object
      required: [profileId, kind, tmdbId, season, episode, positionSec, durationSec, completed, updatedAt]
      properties:
        profileId: { type: string }
        kind: { $ref: '#/components/schemas/MediaKind' }
        tmdbId: { type: integer }
        season: { type: integer }
        episode: { type: integer }
        positionSec: { type: number }
        durationSec: { type: number }
        completed: { type: boolean }
        updatedAt: { type: integer }
        rev: { type: integer, description: Revision at which this row was last written. }
    ProgressList:
      type: object
      required: [revision, entries]
      properties:
        revision: { type: integer }
        entries: { type: array, items: { $ref: '#/components/schemas/ProgressEntry' } }
    TrackPlayInput:
      type: object
      required: [trackKey]
      properties:
        profileId: { type: string }
        trackKey: { type: string, maxLength: 512 }
        durationSec: { type: number, minimum: 0, default: 0 }
        completed: { type: boolean, default: false }
        playedAt: { type: integer }
    TrackPlay:
      type: object
      required: [id, profileId, trackKey, playedAt, durationSec, completed]
      properties:
        id: { type: integer }
        profileId: { type: string }
        trackKey: { type: string }
        playedAt: { type: integer }
        durationSec: { type: number }
        completed: { type: boolean }
        rev: { type: integer }
    MediaEtag:
      type: object
      required: [revision, libraryEtag]
      properties:
        revision: { type: integer, description: Bumps on every progress/play write. }
        libraryEtag: { type: integer, description: Bumps on every library index change. }
    MediaSyncResult:
      type: object
      required: [ok, status, pushed, revision]
      properties:
        ok: { type: boolean }
        status:
          oneOf:
            - { type: integer }
            - { type: string, enum: [offline, skipped] }
        pushed: { type: integer }
        revision: { type: integer }
    MediaStatus:
      type: object
      required: [configured, tmdb, motn, region, language, revision, libraryEtag, libraryCount, serverId, serverName, sync]
      properties:
        configured: { type: boolean }
        tmdb: { type: boolean }
        motn: { type: boolean }
        region: { type: string }
        language: { type: string }
        revision: { type: integer }
        libraryEtag: { type: integer }
        libraryCount: { type: integer }
        serverId: { type: [string, 'null'] }
        serverName: { type: string }
        sync:
          oneOf:
            - type: 'null'
            - type: object
              required: [lastPushedRevision, last]
              properties:
                lastPushedRevision: { type: integer }
                last:
                  oneOf:
                    - { type: 'null' }
                    - { $ref: '#/components/schemas/MediaSyncResult' }
