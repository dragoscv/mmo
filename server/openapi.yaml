      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Track' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
    delete:
      operationId: libraryDeleteTrack
      tags: [library]
      summary: Delete a track
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

