      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [playlist]
                properties:
                  playlist: { $ref: '#/components/schemas/Playlist' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/playlists/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: libraryUpdatePlaylist
      tags: [library]
      summary: Rename or redescribe a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
    delete:
      operationId: libraryDeletePlaylist
      tags: [library]
      summary: Delete a playlist and its track links
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /library/playlists/{id}/tracks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: libraryListPlaylistTracks
      tags: [library]
      summary: Tracks of a playlist, in position order
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200':
          description: Page of tracks
          content:
            application/json:
              schema:
                type: object
                required: [tracks, total, page, pageSize, totalPages]
                properties:
                  tracks:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Track' }
                        - type: object
                          properties:
                            position: { type: integer }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalPages: { type: integer }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
    post:
      operationId: libraryAddPlaylistTracks
      tags: [library]
      summary: Append tracks to a playlist
      description: Deduplicated; only tracks owned by the user are added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trackIds: { type: array, maxItems: 5000, items: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Number added
          content:
            application/json:
              schema:
                type: object
                required: [success, added]
                properties:
                  success: { type: boolean }
                  added: { type: integer }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '413': { $ref: '#/components/responses/ErrorJson' }

  /library/playlists/{id}/tracks/{trackId}:
    delete:
      operationId: libraryRemovePlaylistTrack
      tags: [library]
      summary: Remove a track from a playlist
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: trackId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /library/playlists/{id}/reorder:
    post:
      operationId: libraryReorderPlaylist
      tags: [library]
      summary: Rewrite playlist positions from an ordered id list
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema:
                type: object
                required: [success, count]
                properties:
                  success: { type: boolean }
                  count: { type: integer }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /library/downloads:
    get:
      operationId: libraryListDownloads
      tags: [library]
      summary: Download history
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        '200':
          description: Downloads
          content:
            application/json:
              schema:
                type: object
                required: [downloads]
                properties:
                  downloads: { type: array, items: { $ref: '#/components/schemas/Download' } }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: libraryCreateDownload
      tags: [library]
      summary: Record a download
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Download' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [download]
                properties:
                  download: { $ref: '#/components/schemas/Download' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze:
    post:
      operationId: libraryAnalyzeTracks
      tags: [library]
      summary: Enqueue analyser jobs for tracks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds: { type: array, minItems: 1, items: { type: integer } }
                options: { $ref: '#/components/schemas/AnalyzeOptions' }
                batchId: { type: string }
                batchLabel: { type: string, default: Analysis }
      responses:
        '200':
          description: Enqueued jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs, batchId]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/JobRef' } }
                  batchId: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/status:
    get:
      operationId: libraryAnalyzeStatus
      tags: [library]
      summary: Current, queued and recently completed analyser jobs
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: Epoch milliseconds; adds `finishedSince`. }
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyzerStatus' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/batches:
    get:
      operationId: libraryAnalyzeBatches
      tags: [library]
      summary: One row per analysis run with aggregate progress
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Batches
          content:
            application/json:
              schema:
                type: object
                required: [batches]
                properties:
                  batches: { type: array, items: { $ref: '#/components/schemas/BatchSummary' } }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/resync:
    post:
      operationId: libraryAnalyzeResync
      tags: [library]
      summary: Re-enqueue cloud sync upserts for every analysed track
      responses:
        '200':
          description: Queue counts
          content:
            application/json:
              schema:
                type: object
                required: [queued, total]
                properties:
                  queued: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/job/{id}:
    get:
      operationId: libraryAnalyzeGetJob
      tags: [library]
      summary: Single analyser job snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/AnalyzeJob' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /library/analyze/cancel/{id}:
    post:
      operationId: libraryAnalyzeCancelJob
      tags: [library]
      summary: Cancel a queued or in-flight job
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Whether a job was cancelled
          content:
            application/json:
              schema:
                type: object
                required: [canceled]
                properties:
                  canceled: { type: boolean }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/batch/{batchId}/cancel:
    post:
      operationId: libraryAnalyzeCancelBatch
      tags: [library]
      summary: Cancel every sub-job of a batch
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Number cancelled
          content:
            application/json:
              schema:
                type: object
                required: [canceled]
                properties:
                  canceled: { type: integer }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/retry/{id}:
    post:
      operationId: libraryAnalyzeRetryJob
      tags: [library]
      summary: Re-enqueue a job with its original path and options
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: New job reference
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/JobRef' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /library/analyze/queue/clear:
    post:
      operationId: libraryAnalyzeClearQueue
      tags: [library]
      summary: Drop queued jobs, optionally for one lane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { $ref: '#/components/schemas/CategoryOrAll' }
      responses:
        '200':
          description: Removed count
          content:
            application/json:
              schema:
                type: object
                required: [removed, category]
                properties:
                  removed: { type: integer }
                  category: { $ref: '#/components/schemas/CategoryOrAll' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/pause:
    post:
      operationId: libraryAnalyzePause
      tags: [library]
      summary: Pause one lane or all lanes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { $ref: '#/components/schemas/CategoryOrAll' }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema:
                type: object
                required: [paused, category]
                properties:
                  paused: { type: boolean }
                  category: { $ref: '#/components/schemas/CategoryOrAll' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/resume:
    post:
      operationId: libraryAnalyzeResume
      tags: [library]
      summary: Resume one lane or all lanes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { $ref: '#/components/schemas/CategoryOrAll' }
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                required: [paused, category]
                properties:
                  paused: { type: boolean }
                  category: { $ref: '#/components/schemas/CategoryOrAll' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/completed/{id}:
    delete:
      operationId: libraryAnalyzeRemoveCompleted
      tags: [library]
      summary: Drop one entry from the recently-completed buffer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Whether an entry was removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: boolean }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/completed/clear:
    post:
      operationId: libraryAnalyzeClearCompleted
      tags: [library]
      summary: Clear the recently-completed buffer
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, errored, done], default: all } }
      responses:
        '200':
          description: Removed count
          content:
            application/json:
              schema:
                type: object
                required: [removed, filter]
                properties:
                  removed: { type: integer }
                  filter: { type: string, enum: [all, errored, done] }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/retry-failed:
    post:
      operationId: libraryAnalyzeRetryFailed
      tags: [library]
      summary: Retry every errored entry in the in-memory buffer
      responses:
        '200':
          description: Enqueued jobs
          content:
            application/json:
              schema:
                type: object
                required: [enqueued, jobs]
                properties:
                  enqueued: { type: integer }
                  jobs: { type: array, items: { $ref: '#/components/schemas/JobRef' } }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/retry-all-failed:
    post:
      operationId: libraryAnalyzeRetryAllFailed
      tags: [library]
      summary: Re-enqueue every persisted errored job
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [enqueued, skipped]
                properties:
                  enqueued: { type: integer }
                  skipped: { type: integer }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/health:
    get:
      operationId: libraryAnalyzeHealth
      tags: [library]
      summary: Python sidecar availability, dependencies and GPU info
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyzerHealthReport' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/analyze/gpu/install:
    post:
      operationId: libraryAnalyzeGpuInstall
      tags: [library]
      summary: Install GPU acceleration packages and restart the sidecar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, enum: [onnx, torch, all], default: onnx }
      responses:
        '200':
          description: Install result
          content:
            application/json:
              schema:
                type: object
                required: [installed, gpu, log]
                properties:
                  installed: { type: string }
                  gpu: { $ref: '#/components/schemas/GpuInfo' }
                  log: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /library/analyze/restart:
    post:
      operationId: libraryAnalyzeRestart
      tags: [library]
      summary: Restart the Python sidecar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Restarted
          content:
            application/json:
              schema:
                type: object
                required: [ok, health]
                properties:
                  ok: { type: boolean }
                  health: { $ref: '#/components/schemas/AnalyzerHealthReport' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ErrorJson' }

  /library/analyze/logs:
    get:
      operationId: libraryAnalyzeLogs
      tags: [library]
      summary: Append-only analyser log feed
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs: { type: array, items: { $ref: '#/components/schemas/AnalyzerLogEntry' } }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /library/tracks/{id}/audio:
    get:
      operationId: libraryGetTrackAudio
      tags: [library]
      summary: Stream the source audio file of a track
      description: Supports HTTP Range.
      parameters:
        - { $ref: '#/components/parameters/TrackId' }
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200':
          description: Whole file
          content:
            audio/*:
              schema: { type: string, format: binary }
        '206':
          description: Partial content
          content:
            audio/*:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /library/stems/{trackId}/{stem}:
    get:
      operationId: libraryGetStem
      tags: [library]
      summary: Serve a cached stem WAV
      description: Supports HTTP Range.
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: integer } }
        - name: stem
          in: path
          required: true
          schema: { type: string }
          description: File name such as `vocals.wav`, `drums.wav`, `bass.wav`, `other.wav`.
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200':
          description: Whole file
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '206':
          description: Partial content
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /library/tracks/{id}/peaks:
    get:
      operationId: libraryGetTrackPeaks
      tags: [library]
      summary: Waveform overview peaks
      description: Binary Int16 little-endian, interleaved `[min, max]` pairs.
      parameters:
        - { $ref: '#/components/parameters/TrackId' }
      responses:
        '200':
          description: Peaks sidecar
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }


  /video/probe:
    get:
      operationId: videoProbe
      tags: [video]
      summary: Health and capabilities beacon
      security: []
      responses:
        '200':
          description: Beacon
          content:
            application/json:
              schema:
                type: object
                required: [ok, capabilities, ffmpeg]
                properties:
                  ok: { type: boolean, const: true }
                  capabilities: { type: array, items: { type: string } }
                  ffmpeg: { type: boolean }

  /video/flags:
    get:
      operationId: videoGetFlags
      tags: [video]
      summary: Read the video feature flags
      responses:
        '200':
          description: Flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoFlags' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: videoSetFlags
      tags: [video]
      summary: Update the video feature flags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preRemuxAutoOnScan: { type: boolean }
      responses:
        '200':
          description: Flags after update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoFlags' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/scan:
    post:
      operationId: videoScan
      tags: [video]
      summary: Registered (already probed) videos under the library roots
      description: |
        When `roots` is omitted or empty the configured scan folders are used.
        Answers from the persisted registry and never runs ffprobe inline.
        Roots with nothing registered yet get a background video scan job
        (`GET /scan/jobs/{id}`) and are listed in `pendingRoots`; call again
        once the job completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roots:
                  type: array
                  items: { type: string }
                  description: Absolute folder paths.
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoScanResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/file/{fileId}/info:
    get:
      operationId: videoFileInfo
      tags: [video]
      summary: Registry metadata for a known file id
      parameters:
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: File info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /video/lookup:
    get:
      operationId: videoLookup
      tags: [video]
      summary: Resolve an absolute path inside a library root to a file id
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: File id
          content:
            application/json:
              schema:
                type: object
                required: [fileId]
                properties:
                  fileId: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ErrorJson' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '415': { $ref: '#/components/responses/ErrorJson' }

  /video/direct/{fileId}:
    get:
      operationId: videoDirect
      tags: [video]
      summary: Direct-play a file (or its pre-remuxed sidecar)
      description: Supports HTTP Range.
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200':
          description: Whole file
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
            video/x-matroska: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '206':
          description: Partial content
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
            video/x-matroska: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown file id or missing file (empty body) }
        '416': { description: Malformed Range header (empty body) }

  /video/stream/{fileId}/pause:
    post:
      operationId: videoStreamPause
      tags: [video]
      summary: Destroy in-flight transcode sessions for a file
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200':
          description: Sessions destroyed
          content:
            application/json:
              schema:
                type: object
                required: [ok, destroyed]
                properties:
                  ok: { type: boolean }
                  destroyed: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/stream/{fileId}:
    get:
      operationId: videoStreamPlaylist
      tags: [video]
      summary: HLS playlist for a file
      description: |
        Spawns or reuses a transcode session. Segment URIs are rewritten to
        absolute `/video/stream/{fileId}/seg/{sessionKey}/...` URLs carrying
        `?t=` and `?u=`. While encoding, `#EXT-X-PLAYLIST-TYPE:EVENT` is injected.
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
        - { name: q, in: query, schema: { type: string, enum: [original, 1080p, 720p, 480p], default: 720p } }
        - { name: start, in: query, schema: { type: number, default: 0 }, description: Start offset in seconds. }
        - { name: caps, in: query, schema: { type: string }, description: Comma-separated client capability list. }
        - { name: mode, in: query, schema: { type: string, enum: [remux, audio-transcode, full-transcode] } }
      responses:
        '200':
          description: HLS playlist
          headers:
            X-MMO-Mode:
              schema: { type: string, enum: [remux, audio-transcode, full-transcode] }
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /video/stream/{fileId}/seg/{sessionKey}/{seg}:
    get:
      operationId: videoStreamSegment
      tags: [video]
      summary: HLS segment or init fragment
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { name: sessionKey, in: path, required: true, schema: { type: string } }
        - name: seg
          in: path
          required: true
          schema: { type: string }
          description: For example `seg_00001.ts`, `seg_00001.m4s` or `init.mp4`.
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200':
          description: Segment bytes
          content:
            video/iso.segment: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
            application/vnd.apple.mpegurl: { schema: { type: string } }
        '400': { description: Malformed session key (empty body) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown file id (empty body) or the segment never appeared
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  segPath: { type: string }
                  dir: { type: string }
                  sample: { type: array, items: { type: string } }
                  logTail: { type: string }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /video/subs/{fileId}/{track}:
    get:
      operationId: videoSubtitleTrack
      tags: [video]
      summary: Extract an embedded subtitle stream as WebVTT
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - name: track
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
          description: Zero-based subtitle stream index.
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt:
              schema: { type: string }
        '400': { description: Track index is not an integer (empty body) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown file id (empty body) }

  /video/tmdb-image/{size}/{rest}:
    get:
      operationId: videoTmdbImage
      tags: [video]
      summary: Cached TMDB image proxy
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - name: size
          in: path
          required: true
          schema: { type: string }
          description: TMDB size token such as `w500` or `original`.
        - name: rest
          in: path
          required: true
          schema: { type: string }
          description: Remaining TMDB image path (Express 5 splat, may contain slashes).
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200':
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /video/discord/init:
    post:
      operationId: videoDiscordInit
      tags: [video]
      summary: Initialise Discord rich presence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId: { type: string }
      responses:
        '200':
          description: Initialised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/discord/presence:
    post:
      operationId: videoDiscordPresence
      tags: [video]
      summary: Set Discord rich presence
      description: The body is forwarded to the RPC client unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/discord/shutdown:
    post:
      operationId: videoDiscordShutdown
      tags: [video]
      summary: Shut down Discord rich presence
      responses:
        '200':
          description: Shut down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/discord/stream:
    get:
      operationId: videoDiscordStream
      tags: [video]
      summary: Server-sent stream of Discord state changes
      description: 'Events: `hello` (`{at}`), `state`, `presence`.'
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/watch/events:
    get:
      operationId: videoWatchEvents
      tags: [video]
      summary: Server-sent stream of library watcher changes
      description: 'Starts the watcher. Events: `hello` (`{at}`), `change`, `error` (`{message}`).'
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/subs/search:
    get:
      operationId: videoSubsSearch
      tags: [video]
      summary: Search external subtitle providers
      description: Rate limited to 20 requests per minute.
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
        - { name: title, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: imdb, in: query, schema: { type: string } }
        - { name: tmdb, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string, enum: [movie, tv] } }
        - { name: season, in: query, schema: { type: integer } }
        - { name: episode, in: query, schema: { type: integer } }
        - { name: lang, in: query, schema: { type: string, default: 'ro,en' }, description: Comma-separated language codes. }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/SubtitleResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /video/subs/download:
    get:
      operationId: videoSubsDownload
      tags: [video]
      summary: Download an external subtitle as WebVTT
      description: Rate limited to 20 requests per minute.
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
        - { name: provider, in: query, required: true, schema: { type: string, enum: [opensubtitles] } }
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /video/intro/{fileId}:
    get:
      operationId: videoIntroDetect
      tags: [video]
      summary: Heuristic intro detection
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { name: engine, in: query, schema: { type: string, enum: [silence, chromaprint], default: silence } }
      responses:
        '200':
          description: Intro range, or an empty object when none was found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeRange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /video/chapters/{fileId}:
    get:
      operationId: videoChapters
      tags: [video]
      summary: Embedded chapter markers
      parameters:
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: Chapters
          content:
            application/json:
              schema:
                type: object
                required: [chapters]
                properties:
                  chapters:
                    type: array
                    items:
                      type: object
                      required: [start, title]
                      properties:
                        start: { type: number }
                        title: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /video/recap/{fileId}:
    get:
      operationId: videoRecapDetect
      tags: [video]
      summary: Recap detection against the previous episode
      parameters:
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: Recap range, or an empty object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeRange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /video/credits/{fileId}:
    get:
      operationId: videoCreditsDetect
      tags: [video]
      summary: Credits start detection
      parameters:
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: Credits start, or an empty object
          content:
            application/json:
              schema:
                type: object
                properties:
                  start: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /video/loudness/{fileId}:
    get:
      operationId: videoLoudness
      tags: [video]
      summary: EBU R128 integrated loudness and normalisation gain
      parameters:
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: Loudness, or an empty object
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrated: { type: number }
                  gainDb: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /video/cropdetect/{fileId}:
    get:
      operationId: videoCropDetect
      tags: [video]
      summary: Most common crop rectangle
      parameters:
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: Crop rectangle, or an empty object
          content:
            application/json:
              schema:
                type: object
                properties:
                  x: { type: integer }
                  y: { type: integer }
                  w: { type: integer }
                  h: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /video/thumbs/{fileId}/sprite.jpg:
    get:
      operationId: videoThumbsSprite
      tags: [video]
      summary: Scrubber thumbnail sprite
      description: A 12x12 grid of 160x90 tiles, generated lazily and cached on disk.
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200':
          description: Sprite
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown file id or missing file (empty body) }
        '503': { description: ffmpeg unavailable or sprite generation failed (empty body) }

  /video/thumbs/{fileId}/thumbs.vtt:
    get:
      operationId: videoThumbsVtt
      tags: [video]
      summary: WebVTT cues mapping time to sprite tiles
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/FileId' }
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown file id or missing file (empty body) }
        '503': { description: ffmpeg unavailable or sprite generation failed (empty body) }

  /video/audio-tracks/{fileId}/extract:
    post:
      operationId: videoAudioTracksExtract
      tags: [video]
      summary: Extract every audio stream to a sibling file
      description: Idempotent; produces AAC 192k `.m4a` files.
      parameters:
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: Produced files
          content:
            application/json:
              schema:
                type: object
                required: [ok, tracks]
                properties:
                  ok: { type: boolean }
                  tracks:
                    type: array
                    items:
                      type: object
                      required: [index, lang, path, bytes]
                      properties:
                        index: { type: integer }
                        lang: { type: string }
                        path: { type: string }
                        bytes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }
        '503': { $ref: '#/components/responses/ErrorJson' }

  /video/intro/fingerprint/{fileId}:
    get:
      operationId: videoIntroFingerprint
      tags: [video]
      summary: Coarse audio fingerprint of the first 90 seconds
      parameters:
        - { $ref: '#/components/parameters/FileId' }
      responses:
        '200':
          description: Fingerprint
          content:
            application/json:
              schema:
                type: object
                required: [ok, fingerprint, durationSec]
                properties:
                  ok: { type: boolean }
                  fingerprint: { type: string, contentEncoding: base64 }
                  durationSec: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }
        '503': { $ref: '#/components/responses/ErrorJson' }

  /video/intro/match:
    post:
      operationId: videoIntroMatch
      tags: [video]
      summary: Align a reference fingerprint inside a target fingerprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, target]
              properties:
                reference: { type: string, contentEncoding: base64 }
                target: { type: string, contentEncoding: base64 }
      responses:
        '200':
          description: Match, or null when nothing aligned
          content:
            application/json:
              schema:
                type: object
                required: [ok, match]
                properties:
                  ok: { type: boolean }
                  match:
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [startSec, endSec, confidence]
                        properties:
                          startSec: { type: integer }
                          endSec: { type: integer }
                          confidence: { type: number }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /video/preremux/jobs:
    get:
      operationId: videoPreRemuxJobs
      tags: [video]
      summary: List in-memory pre-remux jobs
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/PreRemuxJob' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/preremux/events:
    get:
      operationId: videoPreRemuxEvents
      tags: [video]
      summary: Server-sent stream of pre-remux progress
      description: |
        Events: `hello` (`{jobs}`), `change`. Note that this route is registered
        after `GET /video/preremux/{fileId}` and is therefore shadowed by it.
      security:
        - deviceToken: []
        - queryToken: []
      parameters:
        - { $ref: '#/components/parameters/QueryT' }
        - { $ref: '#/components/parameters/QueryU' }
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/preremux/{fileId}:
    parameters:
      - { $ref: '#/components/parameters/FileId' }
    post:
      operationId: videoPreRemuxEnqueue
      tags: [video]
      summary: Enqueue a pre-remux job
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/PreRemuxJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
    get:
      operationId: videoPreRemuxStatus
      tags: [video]
      summary: Job status, or sidecar presence when no job is active
      responses:
        '200':
          description: Job or sidecar info
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    oneOf:
                      - { $ref: '#/components/schemas/PreRemuxJob' }
                      - { type: 'null' }
                  hasSidecar: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
    delete:
      operationId: videoPreRemuxCancel
      tags: [video]
      summary: Cancel a pre-remux job
      responses:
        '200':
          description: Cancel result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/party/create:
    post:
      operationId: watchPartyCreate
      tags: [watch-party]
      summary: Create a watch-party room
      description: The room expires five minutes after the last member leaves.
      responses:
        '200':
          description: Room id
          content:
            application/json:
              schema:
                type: object
                required: [roomId]
                properties:
                  roomId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /video/party/{roomId}/info:
    get:
      operationId: watchPartyInfo
      tags: [watch-party]
      summary: Watch-party room snapshot
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema:
                type: object
                required: [roomId, members, state, hostId]
                properties:
                  roomId: { type: string }
                  members: { type: array, items: { $ref: '#/components/schemas/PartyMember' } }
                  state: { $ref: '#/components/schemas/PartyRoomState' }
                  hostId: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }


  /voice/staged:
    post:
      operationId: voiceStageSample
      tags: [voice]
      summary: Upload one raw audio clip to the staging area
      description: Any container ffmpeg can read. Body limit 25 MB; staged clips expire after one hour.
      parameters:
        - { name: X-Filename, in: header, schema: { type: string, default: sample.wav } }
      requestBody:
        required: true
        content:
          '*/*':
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Staged clip
          content:
            application/json:
              schema:
                type: object
                required: [stagedId, bytes]
                properties:
                  stagedId: { type: string }
                  bytes: { type: integer }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /voice:
    get:
      operationId: voiceListVoices
      tags: [voice]
      summary: List voices on this companion
      responses:
        '200':
          description: Voices
          content:
            application/json:
              schema:
                type: object
                required: [voices]
                properties:
                  voices: { type: array, items: { $ref: '#/components/schemas/VoiceMeta' } }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: voiceCreateVoice
      tags: [voice]
      summary: Finalise a voice from staged clips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stagedIds]
              properties:
                name: { type: string, default: Untitled voice }
                engine: { $ref: '#/components/schemas/VoiceEngine' }
                language: { type: string, default: en }
                stagedIds: { type: array, minItems: 1, items: { type: string } }
                notes: { type: string }
      responses:
        '200':
          description: Created voice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceMeta' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /voice/health:
    get:
      operationId: voiceHealth
      tags: [voice]
      summary: Engine availability and sidecar state
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceHealth' }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/engines:
    get:
      operationId: voiceListEngines
      tags: [voice]
      summary: Status of the engine sidecars
      responses:
        '200':
          description: Engines
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines: { type: array, items: { $ref: '#/components/schemas/EngineStatus' } }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/engines/demucs/separate:
    post:
      operationId: voiceDemucsSeparate
      tags: [voice]
      summary: Split a file into stems with Demucs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputPath]
              properties:
                inputPath: { type: string }
                model: { type: string, default: htdemucs }
                twoStems: { type: boolean, default: false }
                stems: { type: [string, 'null'] }
                mp3: { type: boolean, default: false }
      responses:
        '200':
          description: Separation result
          content:
            application/json:
              schema:
                type: object
                required: [jobId, outputDir, stems, sampleRate, model, downloadBase]
                properties:
                  jobId: { type: string }
                  outputDir: { type: string }
                  stems: { type: object, additionalProperties: { type: string }, description: Stem name to path relative to `outputDir`. }
                  sampleRate: { type: integer }
                  model: { type: string }
                  downloadBase: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/engines/rvc/models:
    get:
      operationId: voiceRvcListModels
      tags: [voice]
      summary: List trained RVC models
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema:
                type: object
                required: [models, modelsRoot]
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      required: [id, path, pth, sizeMB]
                      properties:
                        id: { type: string }
                        path: { type: string }
                        pth: { type: string }
                        index: { type: string }
                        sizeMB: { type: number }
                  modelsRoot: { type: string }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/engines/rvc/convert:
    post:
      operationId: voiceRvcConvert
      tags: [voice]
      summary: Convert a vocal track with an RVC model
      description: One of `inputPath` or `inputStagedId` is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                inputPath: { type: string }
                inputStagedId: { type: string }
                modelId: { type: string }
                pitchSemitones: { type: number, default: 0 }
                indexRate: { type: number, default: 0.66 }
                f0Method: { type: string, default: rmvpe }
                protect: { type: number, default: 0.33 }
                filterRadius: { type: number, default: 3 }
                isolateVocalsFirst: { type: boolean, default: false }
      responses:
        '200':
          description: Conversion result
          content:
            application/json:
              schema:
                type: object
                required: [jobId, outputDir, stems, sampleRate, durationSec, device, downloadBase]
                properties:
                  jobId: { type: string }
                  outputDir: { type: string }
                  converted: { type: string }
                  mix: { type: string }
                  stems: { type: object, additionalProperties: { type: string } }
                  sampleRate: { type: integer }
                  durationSec: { type: number }
                  device: { type: string }
                  downloadBase: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/engines/ace-step/loras:
    get:
      operationId: voiceAceStepListLoras
      tags: [voice]
      summary: List trained ACE-Step LoRA checkpoints
      responses:
        '200':
          description: LoRAs
          content:
            application/json:
              schema:
                type: object
                required: [loras]
                properties:
                  loras:
                    type: array
                    items:
                      type: object
                      required: [exp, ckpts]
                      properties:
                        exp: { type: string }
                        ckpts:
                          type: array
                          items:
                            type: object
                            required: [name, absPath, sizeMB]
                            properties:
                              name: { type: string }
                              absPath: { type: string }
                              sizeMB: { type: integer }
        '400': { $ref: '#/components/responses/MissingUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /voice/engines/ace-step/song:
    post:
      operationId: voiceAceStepGenerateSong
      tags: [voice]
      summary: Generate a song with ACE-Step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
                lyrics: { type: string, default: '' }
                durationSec: { type: number, default: 30 }
                inferStep: { type: integer, default: 30 }
                guidanceScale: { type: number, default: 15 }
                seeds: { type: array, items: { type: integer } }
                loraPath: { type: string }
                loraWeight: { type: number, default: 1 }
                loraPaths: { type: array, items: { type: string } }
                loraWeights: { type: array, items: { type: number } }
                splitStems: { type: boolean, default: true }
      responses:
        '200':
          description: Generation result
          content:
            application/json:
              schema:
                type: object
                required: [jobId, outputDir, stems, sampleRate, device, downloadBase]
                properties:
                  jobId: { type: string }
                  outputDir: { type: string }
                  song: { type: string }
                  stems: { type: object, additionalProperties: { type: string } }
                  sampleRate: { type: integer }
                  device: { type: string }
                  downloadBase: { type: string }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/engines/jobs/{jobId}/{file}:
    get:
      operationId: voiceEngineJobArtifact
      tags: [voice]
      summary: Stream an artifact produced by an engine job
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Audio
          content:
            audio/wav: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }

  /voice/engines/clap/embed:
    post:
      operationId: voiceClapEmbed
      tags: [voice]
      summary: Compute a CLAP audio embedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputPath]
              properties:
                inputPath: { type: string }
                device: { type: string, enum: [cpu, cuda] }
      responses:
        '200':
          description: Embedding
          content:
            application/json:
              schema:
                type: object
                required: [ok, embedding, model, dim, durationSec]
                properties:
                  ok: { type: boolean }
                  embedding: { type: array, items: { type: number } }
                  model: { type: string }
                  dim: { type: integer }
                  durationSec: { type: [number, 'null'] }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Input file not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  inputPath: { type: string }
        '500':
          description: CLAP script failed
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  exitCode: { type: integer }
                  stderr: { type: string }
        '503':
          description: CLAP virtualenv missing
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  hint: { type: string }

  /voice/engines/{engineId}/{command}:
    post:
      operationId: voiceEngineCommand
      tags: [voice]
      summary: Generic passthrough to an engine sidecar command
      description: |
        `command` may be `foo` or `prefix.foo`; without a dot it is prefixed with
        the engine namespace. The body is forwarded verbatim and the sidecar
        reply is returned unchanged.
      parameters:
        - { name: engineId, in: path, required: true, schema: { type: string, enum: [demucs, rvc, ace-step, fish-speech] } }
        - { name: command, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Sidecar reply
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/staged/{stagedId}/analyze:
    post:
      operationId: voiceAnalyzeStagedSample
