        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /voice/{id}/reference:
    parameters:
      - { $ref: '#/components/parameters/VoiceId' }
    post:
      operationId: voiceSetReference
      tags: [voice]
      summary: Choose the reference sample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sampleIndex]
              properties:
                sampleIndex: { type: integer }
      responses:
        '200':
          description: Updated voice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceMeta' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: voiceGetReference
      tags: [voice]
      summary: Stream the reference WAV
      parameters:
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200': { $ref: '#/components/responses/Wav' }
        '206': { $ref: '#/components/responses/Wav' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '416': { description: Range not satisfiable }

  /voice/{id}/rename:
    post:
      operationId: voiceRename
      tags: [voice]
      summary: Rename a voice
      parameters:
        - { $ref: '#/components/parameters/VoiceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Updated voice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceMeta' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /voice/{id}/sample/{n}:
    get:
      operationId: voiceGetSample
      tags: [voice]
      summary: Stream the n-th raw sample
      parameters:
        - { $ref: '#/components/parameters/VoiceId' }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200': { $ref: '#/components/responses/Wav' }
        '206': { $ref: '#/components/responses/Wav' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '416': { description: Range not satisfiable }

  /voice/{id}/synthesize:
    post:
      operationId: voiceSynthesize
      tags: [voice]
      summary: Text-to-speech with a cloned voice
      parameters:
        - { $ref: '#/components/parameters/VoiceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                language: { type: string }
                engine: { $ref: '#/components/schemas/VoiceEngine' }
                speed: { type: number }
      responses:
        '200':
          description: Render
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceRenderResult' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/{id}/sing:
    post:
      operationId: voiceSing
      tags: [voice]
      summary: Sing text to a melody with a cloned voice
      parameters:
        - { $ref: '#/components/parameters/VoiceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, melody]
              properties:
                text: { type: string }
                language: { type: string }
                engine: { $ref: '#/components/schemas/VoiceEngine' }
                tempo: { type: number, default: 120, description: BPM; honoured only between 20 and 400. }
                melody:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [beat, durationBeats, midiPitch]
                    properties:
                      beat: { type: number }
                      durationBeats: { type: number, exclusiveMinimum: 0 }
                      midiPitch: { type: number, exclusiveMinimum: 0 }
                polish: { type: boolean, default: true }
                vibratoCents: { type: number }
                vibratoRateHz: { type: number }
      responses:
        '200':
          description: Render
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceRenderResult' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ErrorJson' }

  /voice/{id}/render/{renderId}:
    get:
      operationId: voiceGetRender
      tags: [voice]
      summary: Stream a rendered WAV
      parameters:
        - { $ref: '#/components/parameters/VoiceId' }
        - { name: renderId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200': { $ref: '#/components/responses/Wav' }
        '206': { $ref: '#/components/responses/Wav' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ErrorJson' }
        '416': { description: Range not satisfiable }

