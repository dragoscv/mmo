      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '400': { $ref: '#/components/responses/ErrorJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
