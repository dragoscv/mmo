        '400': { $ref: '#/components/responses/ErrorJson' }
        '403': { $ref: '#/components/responses/ForbiddenLocalhost' }

  /audio/devices:
    get:
      operationId: listAudioDevices
      tags: [audio]
      summary: All backends with devices plus the authorised list
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
