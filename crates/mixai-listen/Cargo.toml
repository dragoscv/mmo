[package]
name = "mixai-listen"
version = "0.1.0"
description = "Streaming key, BPM, beat phase, tuning, chords, pitch and loudness analysis for MixAI (on-device, permissive deps only)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
realfft = "3.5.1"
ebur128 = "0.1.11"
symphonia = { version = "0.5.5", optional = true, default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis", "adpcm"] }
tract-onnx = { version = "0.23.10", optional = true }

[features]
default = []
# File mode: decode mp3/aac/m4a/flac/wav/ogg to mono PCM (symphonia, MPL-2.0).
decode = ["dep:symphonia"]
# Key CNN (models/key_cnn.onnx embedded, tract inference). Phones + desktop; the watch keeps the classic path.
cnn = ["dep:tract-onnx"]
