[project]
name = "mixai-listen-train"
version = "0.1.0"
description = "Trains the MixAI key CNN (AllConv, Korzeniowski & Widmer 2018) on features dumped by mixai-listen-bench"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.3",
    "torch>=2.9",
    "onnx>=1.19",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
