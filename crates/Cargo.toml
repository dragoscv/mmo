[workspace]
resolver = "3"
members = ["mixai-listen", "mixai-listen-bench", "mixai-listen-ffi"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/dragoscv/mmo"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true

# Debug app builds (Android debug APK, iOS dev) still need a real-time engine: unoptimised DSP took 167 s for a
# 2-minute file on the A51 and cannot keep up with the mic. Optimise every crate, keep debug info for our own.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.mixai-listen]
opt-level = 3
