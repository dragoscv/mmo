# Grouped weekly dependency PRs, one per lockfile dir (WP20-09). Majors stay separate so they get a real review;
# the pnpm 24 h quarantine (minimumReleaseAge 1440 in each pnpm-workspace.yaml) still applies on install.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/apps/extension"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
