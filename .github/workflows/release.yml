name: Release (Changesets)

# Disabled by default: the project doesn't actually use changesets-driven
# releases — companion ships via tag-based `companion-release.yml`, the
# web app auto-deploys via Vercel, and the extension/native packages have
# their own release workflows. Running this on every push to main would
# just open a "Version Packages" PR no one ever merges.
#
# Kept in the repo (rather than deleted) so it can be re-enabled with a
# single-line change if we ever adopt changesets. To re-arm, add:
#   push:
#     branches: [main]
# back into the `on:` block below.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Open / update Version PR
    runs-on: ubuntu-latest
    # Skip on the version PR itself to avoid loops.
    if: "!contains(github.event.head_commit.message, 'chore(release): version packages')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create Release PR
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
