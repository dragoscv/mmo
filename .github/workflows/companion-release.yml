name: Companion — build & release

# Cross-platform builder for the MMO Companion (Electron). Triggered by:
#   1. Pushing a tag like `companion-v1.2.3` (legacy / manual path).
#   2. Pushing to `main` with changes under `server/**` or to this
#      workflow file. We read `server/package.json#version` and only
#      build when no GitHub Release exists for that version yet — so
#      pushing a perf fix without bumping the version is a no-op, but
#      bumping the version automatically cuts a release.
#   3. Manually via the Actions tab (workflow_dispatch).
# Bare `v*` tags are intentionally NOT a trigger so that tagging the
# web app or another package never starts a 7-minute 3-runner build.
#
# Produces:
#   - Windows: NSIS installer (.exe) + latest.yml (electron-updater feed)
#   - macOS:   DMG (.dmg) + latest-mac.yml
#   - Linux:   AppImage + .deb + .rpm + latest-linux.yml
# All artifacts are uploaded to a GitHub Release named after the version.
#
# The web app's /api/companion/download route reads the latest release
# and redirects browsers to the appropriate installer for their OS.

on:
  push:
    tags:
      - "companion-v*"
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/companion-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Release (true) or just build artifacts (false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write   # needed to publish releases
  id-token: write

jobs:
  # On a branch push (auto-trigger), decide whether the build should run.
  # We build iff `server/package.json#version` does not already have a
  # matching GitHub Release — so bumping the version is what cuts a
  # release, not every commit under server/**. Tag pushes and manual
  # runs skip this and go straight to preflight/build.
  detect:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Read server/package.json version
        id: read
        shell: bash
        run: |
          v="$(node -p "require('./server/package.json').version")"
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "server version: $v"
      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # electron-builder publishes to a release tagged `v<version>`
          # (its default; `companion-v<version>` is only the *trigger*
          # tag for the tag-push path). We gate on the release tag here.
          tag="v${{ steps.read.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "No release for $tag — will build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # Cheap preflight (~5s) that fails the whole pipeline before we burn 3
  # OS-runner minutes if the pushed tag doesn't match server/package.json.
  # electron-builder publishes whatever version is in package.json under a
  # release named after that version — so a `v0.4.0` tag pointing at a
  # commit where package.json still says 0.3.5 silently produces a 0.3.5
  # release and leaves the v0.4.0 tag dangling. This guard makes that an
  # explicit failure instead of a confusing success. Skipped for manual
  # workflow_dispatch runs (no tag context) and for branch auto-triggers
  # (no tag exists yet — detect job is the gate there).
  preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches server/package.json#version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Strip leading "v" or "companion-v" prefix.
          tagver="${tag#v}"
          tagver="${tagver#companion-v}"
          pkgver="$(node -p "require('./server/package.json').version")"
          echo "Tag version : $tagver"
          echo "package.json: $pkgver"
          if [[ "$tagver" != "$pkgver" ]]; then
            echo "::error::Tag $tag (resolves to $tagver) does not match server/package.json version $pkgver"
            exit 1
          fi

  build:
    needs: [preflight, detect]
    # Allow workflow_dispatch (which skips preflight/detect) to still proceed.
    # Build runs when: tag push (preflight passed), or branch auto-trigger
    # with version bump (detect=true), or manual dispatch.
    if: |
      always() && (
        needs.preflight.result == 'success' ||
        (needs.detect.result == 'success' && needs.detect.outputs.should_build == 'true') ||
        (needs.preflight.result == 'skipped' && needs.detect.result == 'skipped')
      )
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux runners need a few system packages so electron-builder can
      # produce .deb / .rpm / .AppImage and so the bundled audio adapter
      # has its dev dependencies (rpmbuild, fakeroot, libarchive-tools).
      # We also install pulseaudio-utils so a smoke test of `pactl info`
      # could be wired in later without surprise.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm \
            fakeroot \
            libarchive-tools \
            dpkg \
            libnss3 \
            libxss1 \
            libgbm1 \
            libsecret-1-0 \
            libasound2t64 \
            pulseaudio-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        # The `pnpm.onlyBuiltDependencies` array in server/package.json already
        # whitelists `audify`, so prebuild-install runs automatically.
        run: pnpm install --no-frozen-lockfile

      - name: Approve native build scripts (audify, electron)
        # pnpm v10 requires explicit approval for postinstall scripts even
        # when listed in onlyBuiltDependencies; this rebuilds the prebuilt
        # binaries downloaded by prebuild-install. Scoped to the deps we
        # actually need — an unscoped `pnpm rebuild` also fires
        # electron-winstaller's install script which calls `node` from a
        # subshell that doesn't inherit PATH on the windows runner and
        # fails the build (we use NSIS via electron-builder, not Squirrel).
        run: pnpm rebuild audify electron better-sqlite3

      - name: Build TypeScript
        run: pnpm build

      - name: Fetch bundled virtual-audio drivers (BlackHole, VirtualAudioDriver)
        # The Windows .sys/.cat/.inf and macOS .pkg are gitignored to keep the
        # repo lightweight, so each CI build pulls them from the upstream
        # releases (with SHA-256 pins enforced by scripts/fetch-virtual-audio.mjs).
        # Without this step, electron-builder packages an empty
        # virtual-audio/{macos,windows} layout and the runtime install flow
        # fails with "installer not bundled". Linux ships no binaries — the
        # adapter wraps the host's pactl, so the fetch is a no-op there.
        shell: bash
        run: pnpm fetch:virtual-audio

      - name: Fetch bundled cloudflared binary
        # cloudflared powers the per-device Cloudflare Tunnel that lets
        # the browser talk to the companion directly with no LAN games
        # (server/src/cloudflared.ts). The binary is platform-specific
        # so each runner downloads its own from CF's GitHub releases.
        shell: bash
        run: pnpm fetch:cloudflared

      - name: Reinstall production deps with npm (flat tree for electron-builder)
        # pnpm's symlinked layout — even with hoisting — leaves transitive
        # dependencies of native packages (audify→bindings→file-uri-to-path,
        # express→qs→side-channel→get-intrinsic→es-object-atoms, etc.)
        # unreachable to electron-builder's asar packer. We wipe node_modules
        # after the TypeScript build (which only needs them transiently) and
        # let npm produce a guaranteed-flat tree for packaging. We keep
        # devDependencies so `electron-builder` itself stays available;
        # electron-builder auto-prunes devDeps when writing app.asar.
        shell: bash
        run: |
          rm -rf node_modules
          npm install --ignore-scripts --no-audit --no-fund
          # Rebuild only the native module we actually use; ignore the rest
          # to avoid electron-winstaller / postinstall surprises on Windows.
          npm rebuild audify better-sqlite3 || true

      # Publish flag: tag pushes always publish; branch auto-triggers
      # (detect job confirmed version is unreleased) always publish;
      # workflow_dispatch publishes only when the input is "true".
      - name: Determine publish flag
        id: pub
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "flag=--publish always" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.publish }}" == "true" ]]; then
            echo "flag=--publish always" >> $GITHUB_OUTPUT
          else
            echo "flag=--publish never" >> $GITHUB_OUTPUT
          fi

      # Pull the topmost CHANGELOG.md section into release/RELEASE_NOTES.md
      # so electron-builder can attach it to the GitHub Release body via
      # --config.releaseInfo.releaseNotesFile. Without this the release
      # body is empty and users have to dig through the repo to find what
      # changed. The script gracefully falls back to "See CHANGELOG.md"
      # if the file is missing or malformed, so it never fails the build.
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: node scripts/extract-release-notes.mjs release/RELEASE_NOTES.md

      # ── Windows ────────────────────────────────────────────────────────
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win --x64 --config.releaseInfo.releaseNotesFile=release/RELEASE_NOTES.md ${{ steps.pub.outputs.flag }}

      # ── macOS ──────────────────────────────────────────────────────────
      # Unsigned build (no Apple developer certificate). Users will see a
      # Gatekeeper warning on first run; right-click → Open or
      # `xattr -dr com.apple.quarantine /Applications/MMO\ Companion.app`
      # works around it.
      - name: Build macOS DMG (unsigned, x64 + arm64)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --mac --x64 --arm64 --config.releaseInfo.releaseNotesFile=release/RELEASE_NOTES.md ${{ steps.pub.outputs.flag }}
      # ── Linux ───────────────────────────────────────────────────
      # Produces three formats so distros without AppImage support get a
      # native package: .deb (Ubuntu/Debian/Mint), .rpm (Fedora/openSUSE),
      # .AppImage (everything else, including Arch). The runtime audio
      # adapter calls `pactl` from PipeWire's PulseAudio compatibility
      # layer, which the .deb's `Recommends` line surfaces to the user
      # but does not hard-require (PipeWire is the default on Ubuntu
      # 22.10+, Fedora 34+, etc., and the adapter degrades gracefully
      # to a "driver unavailable" probe result if pactl is missing).
      - name: Build Linux packages (.deb, .rpm, .AppImage)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_SYSTEM_FPM: "false"
        run: pnpm exec electron-builder --linux --x64 --config.releaseInfo.releaseNotesFile=release/RELEASE_NOTES.md ${{ steps.pub.outputs.flag }}
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.os }}
          path: |
            server/release/*.exe
            server/release/*.dmg
            server/release/*.zip
            server/release/*.AppImage
            server/release/*.deb
            server/release/*.rpm
            server/release/latest*.yml
          if-no-files-found: warn
          retention-days: 14
