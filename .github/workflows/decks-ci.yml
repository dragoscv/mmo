name: decks-ci

# MixAI Decks (apps/mixai, Tauri 2 + Rust audio core) — frontend, Rust and licence gates. WP19-02.
# apps/mixai keeps its own pnpm lockfile (repo rule: per-app lockfiles, never install at the root).
# src-tauri/icons and dist/ are gitignored, but tauri-build's generate_context! needs both to compile the
# `mixai` crate, so the rust job generates icons (`pnpm tauri:icon`) and an empty dist/ before clippy.

on:
    push:
        branches: [main]
        paths:
            - "apps/mixai/**"
            - ".github/workflows/decks-ci.yml"
    pull_request:
        paths:
            - "apps/mixai/**"
            - ".github/workflows/decks-ci.yml"

concurrency:
    group: decks-ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    HUSKY: 0
    CARGO_TERM_COLOR: always

jobs:
    frontend:
        name: frontend (typecheck + vite build)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: apps/mixai
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: apps/mixai/pnpm-lock.yaml
            - name: Install deps (apps/mixai + packages/ui, consumed from source)
              run: |
                  pnpm install --frozen-lockfile
                  pnpm -C ../../packages/ui install --frozen-lockfile
            - run: pnpm typecheck
            - name: unit tests (node --test, Node strips TS types)
              run: node --test 'src/**/*.test.ts'
            - run: pnpm exec vite build

    rust:
        name: rust (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        defaults:
            run:
                working-directory: apps/mixai/src-tauri
        steps:
            - uses: actions/checkout@v5

            - name: Install Linux system deps
              if: runner.os == 'Linux'
              working-directory: .
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev \
                    libasound2-dev \
                    libdbus-1-dev \
                    libudev-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    libssl-dev \
                    pkg-config

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/mixai/src-tauri -> target

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: apps/mixai/pnpm-lock.yaml

            - name: Generate icons + placeholder dist (gitignored, required by tauri-build)
              working-directory: apps/mixai
              shell: bash
              run: |
                  pnpm install --frozen-lockfile
                  pnpm tauri:icon
                  mkdir -p dist
                  test -f dist/index.html || echo '<!doctype html><title>ci</title>' > dist/index.html

            - name: cargo fmt --check (Decks crates; shared crates/mixai-listen is formatted by its own workspace)
              run: cargo fmt --check -p mixai -p mixai-core -p decks-analysis -p decks-library -p decks-mapping -p decks-dvs -p decks-render -p decks-stems -p decks-remote -p decks-transition -p decks-setlog -p decks-packs -p decks-layout -p decks-ffi

            # Clippy is BLOCKING on ubuntu-24.04 (the reference platform). On Windows/macOS it is report-only:
            # platform-specific cfg branches (WASAPI/ASIO, CoreAudio, hidapi backends) get their warnings surfaced
            # in the log without failing the matrix leg; the Linux leg is the one that gates merges.
            - name: cargo clippy -D warnings
              continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings

            # Whole Decks workspace: mixai, mixai-core, decks-analysis, decks-library, decks-mapping, decks-dvs, decks-render, decks-stems, decks-remote, decks-transition, decks-setlog.
            - name: cargo test --workspace
              run: cargo test --workspace --all-features

    licences:
        name: licences (cargo-deny)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
            - uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  manifest-path: apps/mixai/src-tauri/Cargo.toml
                  # cargo-deny 0.20 has no `check --config`; it reads the deny.toml next to the manifest.
                  # --workspace --all-features so every Decks crate (rhai, wgpu, rusqlite…) is licence-checked.
                  arguments: --workspace --all-features
                  command: check
                  command-arguments: licenses bans sources
