name: Native — build & release

# Cross-platform builder for the MMO native shells (Tauri 2 desktop +
# Capacitor mobile). Triggered by pushing a tag like `native-v0.2.0`,
# or manually via the Actions tab.
#
# Produces:
#   - Windows: .msi + .exe (NSIS)
#   - macOS:   .dmg + .app.tar.gz
#   - Linux:   .AppImage + .deb + .rpm
#   - Android: .apk + .aab
#   - iOS:     .ipa (only on macOS runner, only when secrets present)
#
# All artifacts are uploaded to a GitHub Release named after the tag.
# Store-publishing steps run conditionally — they SKIP gracefully when
# the relevant secrets are not configured, instead of failing the build.

on:
    push:
        tags:
            - "native-v*"
    workflow_dispatch:
        inputs:
            publish:
                description: "Publish to GitHub Release (true) or just build artifacts (false)"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

permissions:
    contents: write
    id-token: write

jobs:
    # Fast preflight (~5s) that fails before we burn 4 OS-runner minutes
    # if the pushed tag doesn't match apps/native/package.json#version.
    preflight:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Assert tag matches apps/native/package.json#version
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME}"
                  tagver="${tag#native-v}"
                  pkgver="$(node -p "require('./apps/native/package.json').version")"
                  echo "Tag version : $tagver"
                  echo "package.json: $pkgver"
                  if [[ "$tagver" != "$pkgver" ]]; then
                    echo "::error::Tag $tag (resolves to $tagver) does not match apps/native/package.json version $pkgver"
                    exit 1
                  fi

    create-release:
        needs: [preflight]
        if: ${{ always() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
        runs-on: ubuntu-latest
        outputs:
            release_id: ${{ steps.create.outputs.id }}
            upload_url: ${{ steps.create.outputs.upload_url }}
            tag_name: ${{ steps.tag.outputs.tag }}
        steps:
            - uses: actions/checkout@v4
            - name: Resolve tag name
              id: tag
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" == "push" ]]; then
                    echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
                  else
                    pkgver="$(node -p "require('./apps/native/package.json').version")"
                    echo "tag=native-v${pkgver}-dispatch-${{ github.run_id }}" >> $GITHUB_OUTPUT
                  fi
            - name: Extract release notes from CHANGELOG
              id: notes
              shell: bash
              run: |
                  if [[ -f CHANGELOG.md ]]; then
                    awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md > release_notes.md
                  else
                    echo "Native build ${{ steps.tag.outputs.tag }}" > release_notes.md
                  fi
            - name: Create GitHub Release (draft)
              id: create
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: ${{ steps.tag.outputs.tag }}
                  body_path: release_notes.md
                  draft: true
                  prerelease: false

    # ── Tauri desktop (Windows / macOS / Linux) ─────────────────────────
    tauri-desktop:
        needs: [create-release]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      rust_target: x86_64-pc-windows-msvc
                      artifact_glob: |
                          apps/native/src-tauri/target/release/bundle/msi/*.msi
                          apps/native/src-tauri/target/release/bundle/nsis/*.exe
                    - os: macos-latest
                      rust_target: aarch64-apple-darwin
                      artifact_glob: |
                          apps/native/src-tauri/target/release/bundle/dmg/*.dmg
                          apps/native/src-tauri/target/release/bundle/macos/*.app.tar.gz
                    - os: macos-13
                      rust_target: x86_64-apple-darwin
                      artifact_glob: |
                          apps/native/src-tauri/target/release/bundle/dmg/*.dmg
                    - os: ubuntu-22.04
                      rust_target: x86_64-unknown-linux-gnu
                      artifact_glob: |
                          apps/native/src-tauri/target/release/bundle/appimage/*.AppImage
                          apps/native/src-tauri/target/release/bundle/deb/*.deb
                          apps/native/src-tauri/target/release/bundle/rpm/*.rpm
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                working-directory: apps/native
        steps:
            - uses: actions/checkout@v4

            # Tauri's Linux dependencies. Ubuntu 22.04 ships webkit2gtk-4.0;
            # Tauri 2 requires webkit2gtk-4.1.
            - name: Install Linux system deps
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libgtk-3-dev \
                    libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev \
                    libssl-dev \
                    rpm

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: apps/native/pnpm-lock.yaml

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_target }}

            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/native/src-tauri

            - name: Install Node deps
              run: pnpm install --no-frozen-lockfile

            - name: Generate Tauri icons from apps/web/public/icon-512.png
              shell: bash
              run: pnpm tauri:icon

            - name: Decode Apple signing certificate (macOS only)
              if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              run: |
                  echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
                  security create-keychain -p actions build.keychain
                  security default-keychain -s build.keychain
                  security unlock-keychain -p actions build.keychain
                  security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
                  rm /tmp/cert.p12

            - name: Decode Windows signing certificate (Windows only)
              if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
              env:
                  WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
              shell: pwsh
              run: |
                  $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
                  [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\\cert.pfx", $bytes)
                  echo "CSC_LINK=$env:RUNNER_TEMP\\cert.pfx" >> $env:GITHUB_ENV

            - name: Build Tauri bundle
              env:
                  # macOS notarization (silently skipped when not set)
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  # Windows code-signing
                  CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
              run: pnpm tauri:build --target ${{ matrix.rust_target }}

            - name: Upload artifacts to release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.create-release.outputs.tag_name }}
                  files: ${{ matrix.artifact_glob }}
                  fail_on_unmatched_files: false
                  draft: true

    # ── Capacitor Android ───────────────────────────────────────────────
    android:
        needs: [create-release]
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/native
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: apps/native/pnpm-lock.yaml

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - uses: android-actions/setup-android@v3

            - name: Install Node deps
              run: pnpm install --no-frozen-lockfile

            # Capacitor needs *some* webDir on disk; we just mirror our
            # placeholder index.html into dist/ so `cap sync` is happy.
            - name: Prepare webDir
              run: |
                  mkdir -p dist
                  cp index.html dist/

            - name: Scaffold android/ project
              run: pnpm cap:add:android

            - name: Sync Capacitor config
              run: pnpm cap:sync android

            - name: Decode Android keystore (optional)
              id: keystore
              if: env.ANDROID_KEYSTORE != ''
              env:
                  ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
              run: |
                  echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/release.keystore
                  echo "have_keystore=true" >> $GITHUB_OUTPUT

            - name: Build debug APK (always)
              run: pnpm android:build:debug

            - name: Build release APK + AAB (signed)
              if: steps.keystore.outputs.have_keystore == 'true'
              env:
                  KEYSTORE_PATH: ${{ github.workspace }}/apps/native/android/app/release.keystore
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: pnpm android:build:release

            - name: Upload Android artifacts
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.create-release.outputs.tag_name }}
                  files: |
                      apps/native/android/app/build/outputs/apk/debug/*.apk
                      apps/native/android/app/build/outputs/apk/release/*.apk
                      apps/native/android/app/build/outputs/bundle/release/*.aab
                  fail_on_unmatched_files: false
                  draft: true

            - name: Publish to Google Play (internal track, optional)
              if: env.GOOGLE_PLAY_SERVICE_ACCOUNT != '' && steps.keystore.outputs.have_keystore == 'true'
              uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
                  packageName: ro.muzicai.app
                  releaseFiles: apps/native/android/app/build/outputs/bundle/release/app-release.aab
                  track: internal
                  status: draft
              continue-on-error: true

    # ── Capacitor iOS ───────────────────────────────────────────────────
    # iOS builds REQUIRE a macOS runner AND signing certs to be useful.
    # When the Apple signing secret is missing we still scaffold and
    # build an unsigned IPA so reviewers can at least install on a
    # developer device via Xcode.
    ios:
        needs: [create-release]
        runs-on: macos-latest
        defaults:
            run:
                working-directory: apps/native
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: apps/native/pnpm-lock.yaml

            - name: Install Node deps
              run: pnpm install --no-frozen-lockfile

            - name: Install CocoaPods
              run: sudo gem install cocoapods --no-document

            - name: Prepare webDir
              run: |
                  mkdir -p dist
                  cp index.html dist/

            - name: Scaffold ios/ project
              run: pnpm cap:add:ios

            - name: Sync Capacitor config
              run: pnpm cap:sync ios

            - name: Decode Apple App Store API key (optional)
              id: appstore_key
              if: env.APPLE_APP_STORE_API_KEY != ''
              env:
                  APPLE_APP_STORE_API_KEY: ${{ secrets.APPLE_APP_STORE_API_KEY }}
              run: |
                  mkdir -p ~/private_keys
                  echo "$APPLE_APP_STORE_API_KEY" | base64 --decode > ~/private_keys/AuthKey.p8
                  echo "have_appstore_key=true" >> $GITHUB_OUTPUT

            - name: Build iOS archive (unsigned by default)
              continue-on-error: true
              run: |
                  cd ios/App
                  xcodebuild -workspace App.xcworkspace \
                    -scheme App \
                    -configuration Release \
                    -archivePath $RUNNER_TEMP/App.xcarchive \
                    -allowProvisioningUpdates \
                    CODE_SIGNING_ALLOWED=NO \
                    archive

            - name: Export IPA (unsigned)
              continue-on-error: true
              run: |
                  cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                    <dict>
                      <key>method</key>
                      <string>development</string>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>compileBitcode</key>
                      <false/>
                    </dict>
                  </plist>
                  EOF
                  xcodebuild -exportArchive \
                    -archivePath $RUNNER_TEMP/App.xcarchive \
                    -exportPath $RUNNER_TEMP/ipa \
                    -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
                    -allowProvisioningUpdates || true

            - name: Upload iOS archive
              uses: actions/upload-artifact@v4
              with:
                  name: ios-archive
                  path: |
                      ${{ runner.temp }}/App.xcarchive
                      ${{ runner.temp }}/ipa/*.ipa
                  if-no-files-found: warn
                  retention-days: 14

    # ── Publish the GitHub Release ───────────────────────────────────────
    publish-release:
        needs: [tauri-desktop, android, ios, create-release]
        if: ${{ always() && needs.create-release.result == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - name: Publish the draft release
              uses: actions/github-script@v7
              with:
                  script: |
                      const releaseId = '${{ needs.create-release.outputs.release_id }}';
                      if (!releaseId) {
                        core.warning('No release id; skipping publish step.');
                        return;
                      }
                      await github.rest.repos.updateRelease({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        release_id: Number(releaseId),
                        draft: false,
                      });
