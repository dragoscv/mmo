name: ci-lint

# Lints the workflow files themselves (actionlint + shellcheck of run: blocks). WP13-05.

on:
    push:
        branches: [main]
        paths:
            - ".github/workflows/**"
            - ".github/actionlint.yaml"
    pull_request:
        paths:
            - ".github/workflows/**"
            - ".github/actionlint.yaml"

concurrency:
    group: ci-lint-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    actionlint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
            - uses: raven-actions/actionlint@v2
              with:
                  fail-on-error: true
                  flags: -ignore 'SC2016' -ignore 'SC2086'
