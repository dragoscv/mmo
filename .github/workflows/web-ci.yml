name: web-ci

on:
    push:
        branches: [main]
        paths:
            - "apps/web/**"
            - "packages/**"
            - "scripts/**"
            - ".github/workflows/web-ci.yml"
    pull_request:
        paths:
            - "apps/web/**"
            - "packages/**"
            - "scripts/**"
            - ".github/workflows/web-ci.yml"

concurrency:
    group: web-ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    HUSKY: 0

jobs:
    fast-gates:
        name: fast gates (i18n parity, hex gate, version/migration guards)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            # Pure-Node scripts: no install needed.
            - name: i18n parity (web + extension)
              run: |
                  node apps/web/scripts/i18n-parity.mjs
                  node scripts/i18n-parity-ext.mjs
            - name: Hard-coded colour gate
              run: node scripts/hex-gate.mjs
            - name: Version bump + migration guards (web)
              if: github.event_name == 'pull_request'
              run: |
                  git fetch origin "${{ github.base_ref }}" --depth=50
                  node apps/web/scripts/check-version.mjs --base="origin/${{ github.base_ref }}"
                  node apps/web/scripts/check-migrations.mjs --base="origin/${{ github.base_ref }}"

    packages:
        name: packages (design-tokens, ui)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            matrix:
                pkg: [design-tokens, ui]
        defaults:
            run:
                working-directory: packages/${{ matrix.pkg }}
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: packages/${{ matrix.pkg }}/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - name: Generated tokens are committed
              if: matrix.pkg == 'design-tokens'
              run: |
                  pnpm build
                  git diff --exit-code -- dist ../../apps ../../server/ui/public || (echo "::error::Run pnpm -C packages/design-tokens build and commit the output" && exit 1)

    web:
        name: web (lint, typecheck, test, build, bundle budget)
        runs-on: ubuntu-latest
        timeout-minutes: 25
        defaults:
            run:
                working-directory: apps/web
        env:
            NEXT_TELEMETRY_DISABLED: 1
            SKIP_ENV_VALIDATION: 1
            # Build-time route config collection imports the db module; nothing connects to this.
            DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
            AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: |
                      apps/web/pnpm-lock.yaml
                      packages/*/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            # packages/* are consumed through tsconfig paths and import their own deps (Base UI, AI SDK, ...);
            # install them like apps/web/Dockerfile does.
            - name: Install packages/* (tsconfig-path consumers)
              run: for d in ../../packages/*/; do (cd "$d" && pnpm install --frozen-lockfile --reporter=append-only); done
            - name: Lint (baseline-aware)
              run: pnpm lint:check
            - run: pnpm typecheck
            - run: pnpm test
            - name: Build
              run: pnpm build
            # .bundle-baseline.json method is `next-dir` → measure the Turbopack .next directly.
            # (A `--webpack` log baseline would need `pnpm build:webpack > log` + `--check log`.)
            - name: Bundle budget
              run: node scripts/bundle-budget.mjs --check .next
            - name: Bundle size report
              if: always()
              run: |
                  if [ -d .next ]; then du -sh .next/static 2>/dev/null || true; fi

    runtime:
        name: web runtime (Lighthouse CI, axe a11y)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: apps/web
        env:
            NEXT_TELEMETRY_DISABLED: 1
            SKIP_ENV_VALIDATION: 1
            # Pages under test (/, /offline, /status, /library, /settings/appearance, /get)
            # render their landing / NotSignedIn state without a DB. The dummy URL only
            # satisfies the env shape; nothing connects to it.
            DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
            AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
            # lib/env.ts refuses to boot a production server without Google OAuth creds.
            AUTH_GOOGLE_ID: ci-only.apps.googleusercontent.com
            AUTH_GOOGLE_SECRET: ci-only-not-a-secret
            NEXTAUTH_URL: http://localhost:13789
            PORT: 13789
            PLAYWRIGHT_BASE_URL: http://localhost:13789
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: |
                      apps/web/pnpm-lock.yaml
                      packages/*/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            # packages/* are consumed through tsconfig paths and import their own deps (Base UI, AI SDK, ...);
            # install them like apps/web/Dockerfile does.
            - name: Install packages/* (tsconfig-path consumers)
              run: for d in ../../packages/*/; do (cd "$d" && pnpm install --frozen-lockfile --reporter=append-only); done
            - name: Build (production)
              run: pnpm build
            # LHCI hides the server output; probe the pages first so a 500 shows its stack trace.
            - name: Smoke public pages (prints the server log on failure)
              run: |
                  nohup pnpm start > smoke-start.log 2>&1 &
                  pid=$!
                  for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:13789/status && break; sleep 2; done
                  rc=0
                  for u in / /offline /status /get; do
                    code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:13789$u")
                    echo "$u -> $code"
                    if [ "$code" -ge 500 ]; then rc=1; fi
                  done
                  kill "$pid" || true; fuser -k 13789/tcp || true; sleep 2
                  if [ "$rc" -ne 0 ]; then echo "::error::public page returned 5xx"; tail -n 200 smoke-start.log; fi
                  exit "$rc"
            - name: Lighthouse CI (starts `pnpm start` itself)
              run: pnpm exec lhci autorun --config=./lighthouserc.cjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: lighthouse-report
                  path: apps/web/.lighthouseci
                  if-no-files-found: ignore
                  retention-days: 14
            - name: Install Playwright chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Start production server
              run: |
                  nohup pnpm start > next-start.log 2>&1 &
                  for _ in $(seq 1 60); do
                    if curl -fsS http://localhost:13789/status >/dev/null; then echo ready; exit 0; fi
                    sleep 2
                  done
                  echo "::error::next start never became ready"; cat next-start.log; exit 1
            - name: axe-core accessibility gate (w390 + w1440, light + dark)
              # 127.0.0.1 (not localhost) so playwright.config.ts skips its own webServer and uses
              # the production server started above instead of failing on the busy port.
              env:
                  PLAYWRIGHT_BASE_URL: http://127.0.0.1:13789
              run: pnpm exec playwright test e2e/a11y.spec.ts --project=w390 --project=w1440
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-a11y-report
                  path: |
                      apps/web/test-results
                      apps/web/playwright-report
                  if-no-files-found: ignore
                  retention-days: 14

    knip:
        name: knip (unused files/exports/deps — report only)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: apps/web
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: apps/web/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            # Report-only until the baseline is triaged (WP13-06); then drop --no-exit-code.
            - name: knip
              run: pnpm dlx knip@6 --reporter compact --no-exit-code | tee knip-report.txt
            - uses: actions/upload-artifact@v4
              with:
                  name: knip-report
                  path: apps/web/knip-report.txt
                  retention-days: 14
