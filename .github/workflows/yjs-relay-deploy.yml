name: Deploy Yjs Relay

on:
    push:
        branches: [main]
        paths:
            - "infra/yjs-relay/**"
            - ".github/workflows/yjs-relay-deploy.yml"
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: infra/yjs-relay
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
                  cache-dependency-path: infra/yjs-relay/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Deploy to Cloudflare Workers
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: infra/yjs-relay
                  command: deploy
