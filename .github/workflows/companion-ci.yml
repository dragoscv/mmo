name: companion-ci

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/companion-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/companion-ci.yml"

concurrency:
  group: companion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # The companion uses native deps (better-sqlite3, audify) that
      # need build tools to compile from source on Linux runners. Most
      # of these are already present on ubuntu-latest, but libasound2-dev
      # is required for audify's RtAudio binding.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Approve native build scripts so better-sqlite3 / audify compile.
      # Mirrors the release workflow.
      - name: Approve native build scripts
        run: pnpm approve-builds || true
        continue-on-error: true

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test --run
