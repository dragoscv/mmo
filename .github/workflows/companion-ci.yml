name: companion-ci

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/companion-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/companion-ci.yml"

concurrency:
  group: companion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # The companion uses native deps (better-sqlite3, audify) that
      # need build tools to compile from source on Linux runners. Most
      # of these are already present on ubuntu-latest, but libasound2-dev
      # is required for audify's RtAudio binding.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Native bindings: prebuild-install pulls prebuilt .node files for
      # better-sqlite3 and audify on most Node × OS combos. In pnpm v10
      # the install script of a whitelisted `onlyBuiltDependencies` entry
      # runs as part of `pnpm install`, but the cached `~/.local/share/pnpm`
      # symlink layout sometimes leaves the binding file outside the path
      # `require('bindings')` searches in this repo (see the path list
      # in the previous CI failure). Running an explicit `npm rebuild`
      # against the deps that actually need a .node file recompiles them
      # in-place under `node_modules/<pkg>/build/Release/` where the
      # bindings resolver looks first.
      - name: Rebuild native modules (in-place)
        run: npm rebuild better-sqlite3 audify

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test --run
