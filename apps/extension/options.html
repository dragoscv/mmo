<!DOCTYPE html>
<html lang="en" data-accent="violet">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <title data-i18n="optionsTitle">MixAI Downloader – Settings</title>
    <script>
        // Options page cannot read the site's localStorage; follow the OS scheme.
        var m = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-mode", m);
        document.documentElement.classList.toggle("dark", m === "dark");
    </script>
    <link rel="stylesheet" href="tokens.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--background);
            color: var(--foreground);
            padding: 24px;
            min-width: 400px;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            font-size: 20px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field > label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted-foreground);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            min-height: var(--control-h);
            padding: 0 14px;
            border-radius: var(--radius);
            border: 1px solid var(--input);
            background: var(--card);
            color: var(--foreground);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
        }

        input:focus {
            border-color: var(--ring);
            box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent);
        }

        .hint {
            font-size: 10px;
            color: var(--muted-foreground);
            margin-top: 4px;
        }

        .checkbox-field {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: var(--radius);
            background: var(--card);
            border: 1px solid var(--border);
        }

        .checkbox-field input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-field .text {
            flex: 1;
            cursor: pointer;
        }

        .checkbox-field .text .title {
            font-size: 12px;
            font-weight: 500;
        }

        .checkbox-field .text .desc {
            font-size: 10px;
            color: var(--muted-foreground);
            margin-top: 2px;
        }

        .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: var(--control-h-sm);
            padding: 0 20px;
            border: none;
            border-radius: var(--radius);
            background: var(--primary);
            color: var(--primary-foreground);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: filter var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
        }

        .btn-save:hover {
            filter: brightness(1.08);
            box-shadow: var(--surface-glow);
        }

        .btn-save:focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }

        .saved-msg {
            display: none;
            font-size: 11px;
            color: var(--success);
            margin-left: 12px;
        }
    </style>
</head>

<body>
    <h1><span class="logo">🎧</span> <span data-i18n="optionsHeading">MixAI Downloader settings</span></h1>

    <div class="field">
        <label for="baseUrl" data-i18n="baseUrlLabel">MixAI app base URL</label>
        <input type="url" id="baseUrl" placeholder="https://mixai.ro">
        <div class="hint" data-i18n="baseUrlHint">The URL of your MixAI app (default: https://mixai.ro; for local dev use
            http://localhost:13789)</div>
    </div>

    <div class="checkbox-field">
        <input type="checkbox" id="autoDownload">
        <label class="text" for="autoDownload">
            <div class="title" data-i18n="autoDownloadTitle">Auto-download on button click</div>
            <div class="desc" data-i18n="autoDownloadDesc">Start the download as soon as you click the MixAI button on a streaming site</div>
        </label>
    </div>

    <div class="checkbox-field">
        <input type="checkbox" id="audioOnly" checked>
        <label class="text" for="audioOnly">
            <div class="title" data-i18n="audioOnlyTitle">Audio only</div>
            <div class="desc" data-i18n="audioOnlyDesc">Ask MixAI to extract just the audio track (adds audio=1 to the download link)</div>
        </label>
    </div>

    <button class="btn-save" id="save" data-i18n="save">Save settings</button>
    <span class="saved-msg" id="saved-msg" role="status" data-i18n="saved">✓ Saved</span>

    <script src="vendor/browser-polyfill.min.js"></script>
    <script src="i18n.js"></script>
    <script src="options.js"></script>
</body>

</html>
