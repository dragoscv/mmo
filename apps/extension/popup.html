<!DOCTYPE html>
<html lang="en" data-accent="violet">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark light">
    <script>
        // Popup cannot read the site's localStorage; follow the OS scheme.
        var m = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-mode", m);
        document.documentElement.classList.toggle("dark", m === "dark");
    </script>
    <link rel="stylesheet" href="tokens.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: var(--font-sans);
            background: var(--background);
            color: var(--foreground);
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .header .logo {
            width: 28px;
            height: 28px;
            background: var(--brand-gradient);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .header h1 {
            font-family: var(--font-heading);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header .version {
            font-size: 10px;
            color: var(--muted-foreground);
            margin-left: auto;
        }

        .current-page {
            background: var(--card);
            color: var(--card-foreground);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 12px;
        }

        .current-page .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted-foreground);
            margin-bottom: 6px;
        }

        .current-page .title {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-page .platform {
            font-size: 10px;
            color: var(--muted-foreground);
            margin-top: 4px;
        }

        .current-page .platform.detected {
            color: var(--success);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: var(--control-h);
            padding: 0 12px;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: filter var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
            margin-bottom: 8px;
        }

        .btn:focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground);
        }

        .btn-primary:hover {
            filter: brightness(1.08);
            box-shadow: var(--surface-glow);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--secondary-foreground);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: var(--accent-foreground);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .status {
            text-align: center;
            font-size: 10px;
            color: var(--muted-foreground);
            margin-top: 8px;
        }

        .status a {
            color: var(--primary);
            text-decoration: none;
        }

        .status a:hover {
            text-decoration: underline;
        }

        .settings-link {
            display: block;
            text-align: center;
            font-size: 10px;
            color: var(--muted-foreground);
            margin-top: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .settings-link:hover {
            color: var(--foreground);
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">🎧</div>
        <h1 data-i18n="popupTitle">MixAI Downloader</h1>
        <span class="version" id="version"></span>
    </div>

    <div class="current-page" id="current-page">
        <div class="label" data-i18n="currentPage">Current page</div>
        <div class="title" id="page-title" data-i18n="loading">Loading…</div>
        <div class="platform" id="page-platform"></div>
    </div>

    <button class="btn btn-primary" id="btn-download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span id="btn-download-label" data-i18n="downloadAudio">Download audio</span>
    </button>

    <button class="btn btn-secondary" id="btn-open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
        <span data-i18n="openInMixai">Open in MixAI</span>
    </button>

    <div class="status">
        <span data-i18n="connectedTo">Connected to</span> <a href="#" id="base-url-link">mixai.ro</a>
    </div>
    <a class="settings-link" id="settings-link" href="#" data-i18n="settings">⚙ Settings</a>

    <script src="vendor/browser-polyfill.min.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
</body>

</html>
