<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header .logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #9333ea, #6366f1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .header h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header .version {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            margin-left: auto;
        }

        .current-page {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .current-page .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 6px;
        }

        .current-page .title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-page .platform {
            font-size: 10px;
            color: #a855f7;
            margin-top: 4px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            color: #fff;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #a855f7, #8b5cf6);
            box-shadow: 0 2px 12px rgba(147, 51, 234, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .status {
            text-align: center;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 8px;
        }

        .status a {
            color: #a855f7;
            text-decoration: none;
        }

        .status a:hover {
            text-decoration: underline;
        }

        .settings-link {
            display: block;
            text-align: center;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .settings-link:hover {
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">🎧</div>
        <h1>MuzicAI Downloader</h1>
        <span class="version">v1.0</span>
    </div>

    <div class="current-page" id="current-page">
        <div class="label">Current Page</div>
        <div class="title" id="page-title">Loading...</div>
        <div class="platform" id="page-platform"></div>
    </div>

    <button class="btn btn-primary" id="btn-download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Download Audio
    </button>

    <button class="btn btn-secondary" id="btn-open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
        Open in MuzicAI
    </button>

    <div class="status">
        Connected to <a href="#" id="base-url-link">muzicai.ro</a>
    </div>
    <a class="settings-link" id="settings-link">⚙ Settings</a>

    <script src="vendor/browser-polyfill.min.js"></script>
    <script src="popup.js"></script>
</body>

</html>
