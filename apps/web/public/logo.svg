<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="MuzicAI">
  <defs>
    <linearGradient id="muzicai-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#E84FF0"/>
    </linearGradient>
    <linearGradient id="muzicai-wave" x1="96" y1="256" x2="416" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E6FBFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="muzicai-glow" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#muzicai-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#muzicai-glow)"/>

  <!-- Waveform pulse: symmetric bars peak in the center, evoking an "M" rhythm -->
  <g fill="url(#muzicai-wave)">
    <rect x="120" y="226" width="26" height="60"  rx="13"/>
    <rect x="166" y="186" width="26" height="140" rx="13"/>
    <rect x="212" y="136" width="26" height="240" rx="13"/>
    <rect x="258" y="196" width="26" height="120" rx="13"/>
    <rect x="304" y="136" width="26" height="240" rx="13"/>
    <rect x="350" y="186" width="26" height="140" rx="13"/>
    <rect x="396" y="226" width="26" height="60"  rx="13"/>
  </g>

  <!-- AI spark dot (cyan accent) -->
  <circle cx="409" cy="150" r="22" fill="#22D3EE"/>
  <circle cx="409" cy="150" r="22" fill="#FFFFFF" fill-opacity="0.25"/>
</svg>
