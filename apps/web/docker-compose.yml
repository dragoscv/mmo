# Local development Postgres — mirrors the Cloud SQL `mmo` database schema.
#
#   docker compose up -d
#   export DATABASE_URL=postgres://postgres:dev@localhost:5432/mmo
#   pnpm exec drizzle-kit migrate

services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: dev
            POSTGRES_DB: mmo
        ports:
            - "5432:5432"
        volumes:
            - mmo-pg-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    mmo-pg-data:
