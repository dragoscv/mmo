# XcodeGen spec for the MixAI iPhone app (WP16-47, tracker D34/D36/D37/D38). The .xcodeproj is generated by
# scripts/build.sh and never committed. Signing team comes from $DEVELOPMENT_TEAM (no secrets here).
# Targets: MixAI (app) + MixAIWidgets (WidgetKit: Continue Watching, Now Playing, download/recording Live Activities)
# + MixAIWatch (watchOS remote + now playing over WatchConnectivity). App Group group.ro.mixai.app (portal id
# NKWP24X8HR) shares the widget snapshot; App IDs ro.mixai.app / .widgets / .watchkitapp exist in the portal.
name: MixAI
options:
  bundleIdPrefix: ro.mixai
  deploymentTarget:
    iOS: '26.0'
    watchOS: '11.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
# Remote packages pinned to exact versions. Linked into the app (Settings > Licences lists them):
#   VLCKit 4.0.0-a25 (LGPL-2.1-or-later, dynamically linked binary xcframework; fallback engine for containers
#   AVPlayer refuses, D36) and sentry-cocoa 9.33.0 (MIT; DSN from the SENTRY_DSN build setting, empty = off).
packages:
  MixaiCore:
    path: MixaiCore
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: 4.0.0-a25
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.33.0
targets:
  MixAI:
    type: application
    platform: iOS
    sources:
      - path: MixAI
      - path: Shared
    dependencies:
      - package: MixaiCore
      - package: VLCKit
      - package: Sentry
      - target: MixAIWidgets
        embed: true
        codeSign: true
      # The watchOS app (MixAIWatch) is NOT embedded in the 1.1.x App Store build: an embedded watch app makes
      # App Store require Apple Watch screenshots, and there is no Apple Watch or Simulator to produce them (or to
      # test it). Re-add `- target: MixAIWatch / embed: true` (lands in "Embed Watch Content") with Watch
      # screenshots in a later release (tracker WP16-48). The phone keeps its WatchConnectivity side.
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
      - sdk: AuthenticationServices.framework
      - sdk: UserNotifications.framework
      - sdk: BackgroundTasks.framework
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: Network.framework
      - sdk: Charts.framework
      - sdk: AppIntents.framework
    info:
      path: MixAI/Info.plist
      properties:
        # audio = background music + PiP; fetch/processing = offline progress flush + smart downloads
        # (BGProcessingTask, Wi-Fi + charging); remote-notification = push.
        UIBackgroundModes: [audio, fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [ro.mixai.app.smartdownloads]
        NSSupportsLiveActivities: true
        NSBonjourServices: [_mmo-companion._tcp]
        # Local MMO Servers speak plain HTTP on the LAN; nothing else is exempted from ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: [SpaceGrotesk-Variable.ttf, Inter-Variable.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: ro.mixai.app
            CFBundleURLSchemes: [mixai]
        UIUserInterfaceStyle: Dark
        CFBundleLocalizations: [en, ro]
        # Empty unless the build passes SENTRY_DSN (Telemetry.start() is a no-op then).
        SentryDSN: $(SENTRY_DSN)
    # CarPlay audio (`com.apple.developer.carplay-audio`) is requested from Apple; until it is granted the
    # CarPlay scene delegate is compiled out (MIXAI_CARPLAY) and neither the entitlement nor the scene role ships.
    entitlements:
      path: MixAI/MixAI.entitlements
      properties:
        # Xcode's App Store export rewrites this to `production` (TestFlight/App Store use the production APNs host).
        aps-environment: development
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ['applinks:mixai.ro']
        com.apple.security.application-groups: [group.ro.mixai.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.app
        PRODUCT_NAME: MixAI
        # iPhone only for the 1.1.x App Store release: App Store requires iPad screenshots + an iPad test when
        # family 2 is declared, and there is no iPad device or Simulator (vmui-mac). The regular-width
        # .sidebarAdaptable layout stays in code; re-enable '1,2' with iPad screenshots (tracker WP16-48).
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SENTRY_DSN: ''
        INFOPLIST_KEY_CFBundleDisplayName: MixAI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MixAI finds and connects to your MMO Server on this network to play your movies, shows and music.
        SWIFT_EMIT_LOC_STRINGS: YES
  MixAIWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MixAIWidgets
      - path: Shared
        excludes:
          - WatchMessages.swift
      - path: MixAI/Localizable.xcstrings
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    info:
      path: MixAIWidgets/Info.plist
      properties:
        CFBundleDisplayName: MixAI
        CFBundleLocalizations: [en, ro]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MixAIWidgets/MixAIWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.app.widgets
        PRODUCT_NAME: MixAIWidgets
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ''
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ''
        SWIFT_EMIT_LOC_STRINGS: NO
  # Apple Watch companion (D38): now playing + remote for TVs, everything through the iPhone (WatchConnectivity).
  MixAIWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: MixAIWatch
      - path: Shared/WatchMessages.swift
      - path: MixAI/Localizable.xcstrings
    info:
      path: MixAIWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: ro.mixai.app
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.app.watchkitapp
        PRODUCT_NAME: MixAIWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        # Archived inside the iPhone app only, never as a second top-level product.
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  MixAI:
    build:
      targets:
        MixAI: all
        MixAIWidgets: all
    run:
      config: Debug
    archive:
      config: Release
