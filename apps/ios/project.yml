# XcodeGen spec for the MixAI iPhone app (WP16-47, tracker D34/D36/D37). The .xcodeproj is generated by
# scripts/build.sh and never committed. Signing team comes from $DEVELOPMENT_TEAM (no secrets here).
name: MixAI
options:
  bundleIdPrefix: ro.mixai
  deploymentTarget:
    iOS: '26.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
packages:
  MixaiCore:
    path: MixaiCore
targets:
  MixAI:
    type: application
    platform: iOS
    sources:
      - path: MixAI
    dependencies:
      - package: MixaiCore
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
    info:
      path: MixAI/Info.plist
      properties:
        # audio = background music + PiP; fetch = progress queue flush (later slice: BGTaskScheduler).
        UIBackgroundModes: [audio, fetch]
        NSBonjourServices: [_mmo-companion._tcp]
        # Local MMO Servers speak plain HTTP on the LAN; nothing else is exempted from ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: [SpaceGrotesk-Variable.ttf, Inter-Variable.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: ro.mixai.app
            CFBundleURLSchemes: [mixai]
        UIUserInterfaceStyle: Dark
        CFBundleLocalizations: [en, ro]
    # Sign in with Apple (WP16-51 later) + universal links. App ID ro.mixai.app has APPLE_ID_AUTH,
    # ASSOCIATED_DOMAINS and APP_GROUPS (ASC API bundleIdCapabilities, 2026-11-05). applinks:mixai.ro needs
    # /.well-known/apple-app-site-association on mixai.ro (DNS still down) — harmless until then.
    entitlements:
      path: MixAI/MixAI.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ['applinks:mixai.ro']
        # Widgets / Live Activities (later slice) share state through this group.
        com.apple.security.application-groups: [group.ro.mixai.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.app
        PRODUCT_NAME: MixAI
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MixAI finds and connects to your MMO Server on this network to play your movies, shows and music.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  MixAI:
    build:
      targets:
        MixAI: all
