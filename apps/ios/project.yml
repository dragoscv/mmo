# XcodeGen spec for the MixAI iPhone app (WP16-47, tracker D34/D36/D37/D38). The .xcodeproj is generated by
# scripts/build.sh and never committed. Signing team comes from $DEVELOPMENT_TEAM (no secrets here).
# Targets: MixAI (app) + MixAIWidgets (WidgetKit: Continue Watching, Now Playing, download/recording Live Activities)
# + MixAIWatch (watchOS remote + now playing over WatchConnectivity). App Group group.ro.mixai.app (portal id
# NKWP24X8HR) shares the widget snapshot; App IDs ro.mixai.app / .widgets / .watchkitapp exist in the portal.
name: MixAI
options:
  bundleIdPrefix: ro.mixai
  deploymentTarget:
    iOS: '26.0'
    tvOS: '26.0'
    watchOS: '11.0'
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
# Remote packages pinned to exact versions. Linked into the app (Settings > Licences lists them):
#   VLCKit 4.0.0-a25 (LGPL-2.1-or-later, dynamically linked binary xcframework; fallback engine for containers
#   AVPlayer refuses, D36) and sentry-cocoa 9.33.0 (MIT; DSN from the SENTRY_DSN build setting, empty = off).
packages:
  MixaiCore:
    path: MixaiCore
  # Shared SwiftUI layer + music stack (WP17-42, D51); pulls AudioStreaming 1.4.5 (MIT) exact.
  MixaiUI:
    path: MixaiUI
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: 4.0.0-a25
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.33.0
  # MixAI Decks Rust core (WP19-15): DecksFFI.xcframework + generated Swift bindings, built by
  # scripts/build-decks-xcframework.sh (gitignored artefacts; Package.swift committed).
  DecksFFI:
    path: DecksFFI
  # MixAI Key & BPM Rust engine (WP18-05): KeyBpmFFI.xcframework (iOS + watchOS slices) + generated bindings, built by
  # scripts/build-keybpm-xcframework.sh (gitignored artefacts; Package.swift committed).
  KeyBpmFFI:
    path: KeyBpmFFI
  # MixAI Live controller core (WP21-09, ADR-0015): protocol v1 models, reducer, WebSocket LiveClient, watch link.
  LiveCore:
    path: LiveCore
targets:
  MixAI:
    type: application
    platform: iOS
    sources:
      - path: MixAI
      - path: Shared
    dependencies:
      - package: MixaiCore
      - package: MixaiUI
      - package: VLCKit
      - package: Sentry
      - target: MixAIWidgets
        embed: true
        codeSign: true
      # The watchOS app (MixAIWatch) is NOT embedded in the 1.1.x App Store build: an embedded watch app makes
      # App Store require Apple Watch screenshots, and there is no Apple Watch or Simulator to produce them (or to
      # test it). Re-add `- target: MixAIWatch / embed: true` (lands in "Embed Watch Content") with Watch
      # screenshots in a later release (tracker WP16-48). The phone keeps its WatchConnectivity side.
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
      - sdk: AuthenticationServices.framework
      - sdk: UserNotifications.framework
      - sdk: BackgroundTasks.framework
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: Network.framework
      - sdk: Charts.framework
      - sdk: AppIntents.framework
    info:
      path: MixAI/Info.plist
      properties:
        # audio = background music + PiP; fetch/processing = offline progress flush + smart downloads
        # (BGProcessingTask, Wi-Fi + charging); remote-notification = push.
        UIBackgroundModes: [audio, fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [ro.mixai.app.smartdownloads]
        NSSupportsLiveActivities: true
        NSBonjourServices: [_mmo-companion._tcp]
        # Local MMO Servers speak plain HTTP on the LAN; nothing else is exempted from ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: [SpaceGrotesk-Variable.ttf, Inter-Variable.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: ro.mixai.app
            CFBundleURLSchemes: [mixai]
        UIUserInterfaceStyle: Dark
        CFBundleLocalizations: [en, ro]
        # Empty unless the build passes SENTRY_DSN (Telemetry.start() is a no-op then).
        SentryDSN: $(SENTRY_DSN)
    # CarPlay audio (`com.apple.developer.carplay-audio`) is requested from Apple; until it is granted the
    # CarPlay scene delegate is compiled out (MIXAI_CARPLAY) and neither the entitlement nor the scene role ships.
    entitlements:
      path: MixAI/MixAI.entitlements
      properties:
        # Xcode's App Store export rewrites this to `production` (TestFlight/App Store use the production APNs host).
        aps-environment: development
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ['applinks:mixai.ro']
        com.apple.security.application-groups: [group.ro.mixai.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.app
        PRODUCT_NAME: MixAI
        # iPhone only for the 1.1.x App Store release: App Store requires iPad screenshots + an iPad test when
        # family 2 is declared, and there is no iPad device or Simulator (vmui-mac). The regular-width
        # .sidebarAdaptable layout stays in code; re-enable '1,2' with iPad screenshots (tracker WP16-48).
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SENTRY_DSN: ''
        INFOPLIST_KEY_CFBundleDisplayName: MixAI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MixAI finds and connects to your MMO Server on this network to play your movies, shows and music.
        SWIFT_EMIT_LOC_STRINGS: YES
  MixAIWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MixAIWidgets
      - path: Shared
        excludes:
          - WatchMessages.swift
      - path: MixAI/Localizable.xcstrings
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    info:
      path: MixAIWidgets/Info.plist
      properties:
        CFBundleDisplayName: MixAI
        CFBundleLocalizations: [en, ro]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MixAIWidgets/MixAIWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.app.widgets
        PRODUCT_NAME: MixAIWidgets
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ''
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ''
        SWIFT_EMIT_LOC_STRINGS: NO
  # Apple Watch companion (D38): now playing + remote for TVs, everything through the iPhone (WatchConnectivity).
  MixAIWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: MixAIWatch
      - path: Shared/WatchMessages.swift
      - path: MixAI/Localizable.xcstrings
    info:
      path: MixAIWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: ro.mixai.app
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.app.watchkitapp
        PRODUCT_NAME: MixAIWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        # Archived inside the iPhone app only, never as a second top-level product.
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  # MixAI TV for Apple TV (WP17-24, ADR-0013): same bundle id as the iPhone app = one App Store record, universal
  # purchase. SwiftUI focus engine + AVPlayerViewController; reuses MixaiCore, the generated Tokens, fonts and the
  # iPhone string catalog. No ActivityKit / WidgetKit / BackgroundTasks / WatchConnectivity / CarPlay on tvOS.
  MixAITV:
    type: application
    platform: tvOS
    deploymentTarget: '26.0'
    sources:
      - path: MixAITV
      - path: MixAI/Localizable.xcstrings
      - path: MixAI/Resources/Fonts
        buildPhase: resources
      - path: MixAI/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MixaiCore
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
      - sdk: Network.framework
    info:
      path: MixAITV/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSBonjourServices: [_mmo-companion._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: [SpaceGrotesk-Variable.ttf, Inter-Variable.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: ro.mixai.app
            CFBundleURLSchemes: [mixai]
        UIUserInterfaceStyle: Dark
        CFBundleLocalizations: [en, ro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.app
        PRODUCT_NAME: MixAITV
        TARGETED_DEVICE_FAMILY: '3'
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI TV
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MixAI TV finds and connects to your MixAI Server on this network to play your movies, shows and music.
        SWIFT_EMIT_LOC_STRINGS: NO
  # MixAI Music for iPhone (WP17-42, D51): separate App Store app `ro.mixai.music` on the shared MixaiCore +
  # MixaiUI music stack (AVAudioEngine engine, crossfade, loudness normalisation, downloads). App IDs
  # ro.mixai.music (K48R6VH2S5) / .widgets (FP2G859TP2) / .intents (92Z2D9FY23), App Group group.ro.mixai.music
  # (H579PJPC6H). CarPlay audio was requested 2026-11-08: when granted add `com.apple.developer.carplay-audio: true`
  # to the entitlements, the CarPlay scene to UIApplicationSceneManifest and MIXAI_CARPLAY to
  # SWIFT_ACTIVE_COMPILATION_CONDITIONS (MusicCarPlaySceneDelegate is compiled out until then).
  MixAIMusic:
    type: application
    platform: iOS
    sources:
      - path: MixAIMusic
      - path: MixAI/Localizable.xcstrings
      - path: MixAI/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: MixaiCore
      - package: MixaiUI
      - target: MixAIMusicWidgets
        embed: true
        codeSign: true
      - target: MixAIMusicIntents
        embed: true
        codeSign: true
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: AppIntents.framework
      - sdk: Intents.framework
      - sdk: WidgetKit.framework
      - sdk: Network.framework
    info:
      path: MixAIMusic/Info.plist
      properties:
        UIBackgroundModes: [audio, fetch]
        NSBonjourServices: [_mmo-companion._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: [SpaceGrotesk-Variable.ttf, Inter-Variable.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: ro.mixai.music
            CFBundleURLSchemes: [mixai-music]
        UIUserInterfaceStyle: Dark
        CFBundleLocalizations: [en, ro]
        INIntentsSupported: [INPlayMediaIntent]
        NSUserActivityTypes: [INPlayMediaIntent]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: MixAIMusic/MixAIMusic.entitlements
      properties:
        com.apple.developer.siri: true
        com.apple.security.application-groups: [group.ro.mixai.music]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.music
        PRODUCT_NAME: MixAIMusic
        MARKETING_VERSION: '0.1.0'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI Music
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MixAI Music finds and connects to your MixAI Server on this network to play your music.
        INFOPLIST_KEY_NSSiriUsageDescription: Ask Siri to play your albums, artists and mixes from your MixAI Server.
        SWIFT_EMIT_LOC_STRINGS: YES
  MixAIMusicWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MixAIMusicWidgets
      - path: MixAIMusic/Shared
      - path: MixAI/Localizable.xcstrings
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: MixAIMusicWidgets/Info.plist
      properties:
        CFBundleDisplayName: MixAI Music
        CFBundleLocalizations: [en, ro]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MixAIMusicWidgets/MixAIMusicWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.music]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.music.widgets
        PRODUCT_NAME: MixAIMusicWidgets
        MARKETING_VERSION: '0.1.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI Music
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ''
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ''
        SWIFT_EMIT_LOC_STRINGS: NO
  MixAIMusicIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: MixAIMusicIntents
      - path: MixAI/Localizable.xcstrings
    dependencies:
      - sdk: Intents.framework
    info:
      path: MixAIMusicIntents/Info.plist
      properties:
        CFBundleDisplayName: MixAI Music
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
          NSExtensionAttributes:
            IntentsSupported: [INPlayMediaIntent]
            SupportedMediaCategories: [INMediaCategoryMusic]
    entitlements:
      path: MixAIMusicIntents/MixAIMusicIntents.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.music]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.music.intents
        PRODUCT_NAME: MixAIMusicIntents
        MARKETING_VERSION: '0.1.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI Music
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  # MixAI Decks (WP19-15, ADR-0014 D61): native DJ app on the Rust core (decks-ffi). One SwiftUI source tree
  # (DecksApp/) for iPhone + iPad (MixAIDecks) and macOS 15+ (MixAIDecksMac), bundle id ro.mixai.dj for both.
  # The ro.mixai.dj App ID does NOT exist in the Apple portal yet (ASC bundleIds/apps empty, 2026-11-09):
  # unsigned compiles work; signed / TestFlight modes need the App ID + app records first (tracker WP19-24).
  MixAIDecks:
    type: application
    platform: iOS
    deploymentTarget: '26.0'
    sources:
      - path: DecksApp
        excludes: [Info-iOS.plist, Info-macOS.plist, '*.entitlements']
    dependencies:
      - package: MixaiCore
      - package: DecksFFI
      - sdk: AVFoundation.framework
      - sdk: CoreMIDI.framework
      - sdk: CoreAudioKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    info:
      path: DecksApp/Info-iOS.plist
      properties:
        UIBackgroundModes: [audio]
        # No UIUserInterfaceStyle here: the app follows the active skin (AppearanceStore →
        # DecksPalette.dark → `.preferredColorScheme`), so a light pack is not drawn dark-on-dark.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleLocalizations: [en, ro]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # .mixaipack skin / layout packs (WP19-34, docs/decks/packs.md § Native apps).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ro.mixai.mixaipack
            UTTypeDescription: MixAI Decks pack
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mixaipack]
        CFBundleDocumentTypes:
          - CFBundleTypeName: MixAI Decks pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [ro.mixai.mixaipack]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.dj
        PRODUCT_NAME: MixAIDecks
        MARKETING_VERSION: '2.0.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI Decks
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: MixAI Decks connects to Bluetooth MIDI DJ controllers you choose.
        SWIFT_EMIT_LOC_STRINGS: YES
  MixAIDecksMac:
    type: application
    platform: macOS
    deploymentTarget: '15.0'
    sources:
      - path: DecksApp
        excludes: [Info-iOS.plist, Info-macOS.plist, '*.entitlements']
    dependencies:
      - package: MixaiCore
      - package: DecksFFI
      - sdk: CoreMIDI.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    info:
      path: DecksApp/Info-macOS.plist
      properties:
        CFBundleLocalizations: [en, ro]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # .mixaipack skin / layout packs (WP19-34, docs/decks/packs.md § Native apps).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ro.mixai.mixaipack
            UTTypeDescription: MixAI Decks pack
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mixaipack]
        CFBundleDocumentTypes:
          - CFBundleTypeName: MixAI Decks pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [ro.mixai.mixaipack]
    # App Sandbox: user-selected folders read-write (library + security-scoped bookmarks), no microphone
    # (DVS input off in the MVP), outgoing network for the MixAI companion / server.
    entitlements:
      path: DecksApp/MixAIDecksMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.device.audio-input: false
        com.apple.security.device.usb: true
        com.apple.security.device.bluetooth: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.dj
        PRODUCT_NAME: MixAIDecks
        MARKETING_VERSION: '2.0.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI Decks
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: © 2026 Dragos Catalin Vladulescu
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  # MixAI Key & BPM (WP18-05, D69/D70): live key + BPM from the mic on the Rust engine (crates/mixai-listen-ffi),
  # Song ID (ShazamKit), set log + exports, tuner, tempo + MIDI clock, practice, optional MMO library. Own App Store
  # record ro.mixai.keybpm with an embedded INDEPENDENT watch app (own mic + engine). App IDs ro.mixai.keybpm /
  # .widgets / .watchkitapp / .watchkitapp.widgets with ShazamKit + App Group group.ro.mixai.keybpm.
  MixAIKeyBpm:
    type: application
    platform: iOS
    deploymentTarget: '26.0'
    sources:
      - path: KeyBpmApp
      - path: MixAI/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: MixaiCore
      - package: MixaiUI
      - package: KeyBpmFFI
      - target: MixAIKeyBpmWidgets
        embed: true
        codeSign: true
      - target: MixAIKeyBpmWatch
        embed: true
        codeSign: true
      - sdk: AVFoundation.framework
      - sdk: ShazamKit.framework
      - sdk: CoreMIDI.framework
      - sdk: CoreAudioKit.framework
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: MusicKit.framework
      - sdk: Charts.framework
    info:
      path: KeyBpmApp/Info.plist
      properties:
        # audio = keep listening with the screen locked, only when the user turned "Keep listening in the background"
        # on (default off) and always with the Live Activity + system mic indicator (review note in the store record).
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSBonjourServices: [_mmo-companion._tcp, _apple-midi._udp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: [SpaceGrotesk-Variable.ttf, Inter-Variable.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: ro.mixai.keybpm
            CFBundleURLSchemes: [mixai-keybpm]
        LSApplicationQueriesSchemes: [mixai-music]
        UIUserInterfaceStyle: Dark
        CFBundleLocalizations: [en, ro]
        UIFileSharingEnabled: false
    entitlements:
      path: KeyBpmApp/MixAIKeyBpm.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.keybpm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.keybpm
        PRODUCT_NAME: MixAIKeyBpm
        MARKETING_VERSION: '0.4.0'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Key & BPM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: MixAI listens to the music around you to show its key, BPM and tuning. Audio is analysed on your iPhone and never recorded; Song ID sends only an audio fingerprint to Apple's Shazam.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MixAI finds your MMO Server and network MIDI devices on this network.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: MixAI sends MIDI clock to Bluetooth MIDI devices you choose.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: MixAI saves the songs identified in your set as an Apple Music playlist when you ask it to.
        SWIFT_EMIT_LOC_STRINGS: YES
  MixAIKeyBpmWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '26.0'
    sources:
      - path: KeyBpmWidgets
      - path: KeyBpmApp/Shared
        excludes: [SetLog.swift]
      - path: KeyBpmApp/Localizable.xcstrings
    dependencies:
      - package: MixaiCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    info:
      path: KeyBpmWidgets/Info.plist
      properties:
        CFBundleDisplayName: Key & BPM
        CFBundleLocalizations: [en, ro]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KeyBpmWidgets/MixAIKeyBpmWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.keybpm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.keybpm.widgets
        PRODUCT_NAME: MixAIKeyBpmWidgets
        MARKETING_VERSION: '0.4.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Key & BPM
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ''
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ''
        SWIFT_EMIT_LOC_STRINGS: NO
  # Independent watch app (owner 2026-11-09): own mic + Rust engine (aarch64 watchOS = Series 9+ / Ultra 2+), iPhone
  # mirror over WatchConnectivity, haptic beat, Double Tap tap tempo, complications. Background audio mode keeps the
  # mic while the wrist is down (started in the foreground; no runtime / workout session).
  # watchOS 27 minimum (owner 2026-11-09): App Store requires an arm64_32 slice below 27, the Rust engine is arm64 only.
  MixAIKeyBpmWatch:
    type: application
    platform: watchOS
    deploymentTarget: '27.0'
    sources:
      - path: KeyBpmWatch
      - path: KeyBpmApp/Shared
        excludes: [KeyBpmActivity.swift, SetLog.swift]
      - path: KeyBpmApp/Engine/MicCapture.swift
      - path: MixaiCore/Sources/MixaiCore/Theme/Tokens.swift
      - path: KeyBpmApp/Localizable.xcstrings
    dependencies:
      - package: KeyBpmFFI
      - target: MixAIKeyBpmWatchWidgets
        embed: true
        codeSign: true
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
    info:
      path: KeyBpmWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: ro.mixai.keybpm
        WKRunsIndependentlyOfCompanionApp: true
        # `audio` is a UIBackgroundModes value on watchOS (WKBackgroundModes only takes workout/session types).
        UIBackgroundModes: [audio]
        CFBundleLocalizations: [en, ro]
    entitlements:
      path: KeyBpmWatch/MixAIKeyBpmWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.keybpm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.keybpm.watchkitapp
        # D69: aarch64 watches only (Series 9+ / Ultra 2+); the Rust engine has no arm64_32 slice.
        ARCHS[sdk=watchos*]: arm64
        WATCHOS_DEPLOYMENT_TARGET: '27.0'
        PRODUCT_NAME: MixAIKeyBpmWatch
        MARKETING_VERSION: '0.4.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Key & BPM
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: MixAI listens to the music around you to show its key and BPM on your watch. Audio is analysed on the watch and never recorded.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  MixAIKeyBpmWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: '27.0'
    sources:
      - path: KeyBpmWatchWidgets
      - path: KeyBpmApp/Shared/Harmony.swift
      - path: KeyBpmApp/Shared/KeyBpmShared.swift
      - path: MixaiCore/Sources/MixaiCore/Theme/Tokens.swift
      - path: KeyBpmApp/Localizable.xcstrings
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: KeyBpmWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Key & BPM
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KeyBpmWatchWidgets/MixAIKeyBpmWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.keybpm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.keybpm.watchkitapp.widgets
        ARCHS[sdk=watchos*]: arm64
        WATCHOS_DEPLOYMENT_TARGET: '27.0'
        PRODUCT_NAME: MixAIKeyBpmWatchWidgets
        MARKETING_VERSION: '0.4.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Key & BPM
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  # MixAI Live controller (WP21-09, ADR-0015): iPhone + iPad remote for the MixAI Live engine on the user's computer,
  # a pure client of control protocol v1 (WebSocket, docs/live/remote-protocol.md) — no audio, no Rust on the phone.
  # Own App Store record ro.mixai.live with an embedded watch app. App IDs ro.mixai.live / .watchkitapp /
  # .watchkitapp.widgets and App Group group.ro.mixai.live do NOT exist in the Apple portal yet (2026-11-09):
  # unsigned compiles work; signed / TestFlight builds need them first.
  MixAILive:
    type: application
    platform: iOS
    deploymentTarget: '26.0'
    sources:
      - path: LiveApp
      - path: MixAI/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: MixaiCore
      - package: LiveCore
      - target: MixAILiveWatch
        embed: true
        codeSign: true
      - sdk: Network.framework
      - sdk: VisionKit.framework
      - sdk: WatchConnectivity.framework
    info:
      path: LiveApp/Info.plist
      properties:
        NSBonjourServices: [_mixai-live._tcp]
        # The engine speaks plain HTTP / WebSocket on the LAN; nothing else is exempted from ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: [SpaceGrotesk-Variable.ttf, Inter-Variable.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: ro.mixai.live
            CFBundleURLSchemes: [mixai-live]
        UIUserInterfaceStyle: Dark
        CFBundleLocalizations: [en, ro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.live
        PRODUCT_NAME: MixAILive
        MARKETING_VERSION: '0.1.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI Live
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MixAI Live finds and controls the MixAI Live engine on your computer over this network.
        INFOPLIST_KEY_NSCameraUsageDescription: MixAI Live uses the camera only to scan the pairing QR code shown by MixAI Live on your computer.
        SWIFT_EMIT_LOC_STRINGS: YES
  # Watch controller: scene prev / next, mute / panic, current part, input level ring. Commands go through the iPhone
  # (WatchConnectivity); direct LAN to the engine (config from the phone's applicationContext) is the fallback.
  MixAILiveWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: LiveWatch
        excludes: [Complication/**]
      - path: MixaiCore/Sources/MixaiCore/Theme/Tokens.swift
      - path: LiveApp/Localizable.xcstrings
    dependencies:
      - package: LiveCore
      - target: MixAILiveWatchWidgets
        embed: true
        codeSign: true
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
    info:
      path: LiveWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: ro.mixai.live
        WKRunsIndependentlyOfCompanionApp: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations: [en, ro]
    entitlements:
      path: LiveWatch/MixAILiveWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.live]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.live.watchkitapp
        PRODUCT_NAME: MixAILiveWatch
        MARKETING_VERSION: '0.1.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI Live
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  MixAILiveWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: LiveWatch/Complication
      - path: LiveWatch/Shared
      - path: LiveApp/Localizable.xcstrings
    dependencies:
      - package: LiveCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LiveWatch/Complication/Info.plist
      properties:
        CFBundleDisplayName: MixAI Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LiveWatch/Complication/MixAILiveWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ro.mixai.live]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.mixai.live.watchkitapp.widgets
        PRODUCT_NAME: MixAILiveWatchWidgets
        MARKETING_VERSION: '0.1.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MixAI Live
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: NO
