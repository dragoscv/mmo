androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# MixAI Music home-screen widget (WP17-41f), latest stable on Google Maven 2026-11-07 (1.3 is alpha).
glance = "1.2.0"
# MixAI Music for Wear OS (WP17-41g), latest stable on Google Maven 2026-11-07.
wearCompose = "1.7.1"
wear = "1.4.0"
wearPhoneInteractions = "1.1.1"
wearRemoteInteractions = "1.2.0"
wearInput = "1.2.0"
playServicesWearable = "20.0.1"
# MixAI Music output picker (WP17-41h): same MediaRouter media3-cast 1.11.1 pulls in at runtime.
mediarouter = "1.8.1"
# MixAI Key & BPM (WP18-02): UniFFI Kotlin bindings run on JNA; latest on Maven Central 2026-11-08.
jna = "5.19.1"
# MixAI Key & BPM for Wear OS (WP18-04): tile (Material3TileService), complication, ongoing activity.
# Latest stable on Google Maven 2026-11-09 (Horologist has no stable release: not used).
wearTiles = "1.6.2"
protolayout = "1.4.2"
wearWatchface = "1.3.0"
wearOngoing = "1.1.0"
coroutinesPlayServices = "1.11.0"
# play-services-wearable pulls fragment 1.0; activity-result APIs need >= 1.3 (lint InvalidFragmentVersionForActivityResult).
fragment = "1.9.1"
# MixAI Decks (WP19-16/17): Compose Multiplatform for the shared Android + Desktop UI, latest stable on
# Maven Central 2026-11-09 (1.13 is beta). Coroutines core/swing = same `coroutines` version.
composeMultiplatform = "1.12.2"

# compose-bom 2026.09.00 / coil 3.6.2 AARs require compileSdk ≥ 37 (checkAarMetadata); targetSdk stays 36.
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

[libraries]
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
