[package]
name = "decks-packs"
version = "0.1.0"
description = "MixAI Decks .mixaipack reader: zip guards, Ed25519 trust, manifest/token/layout validation and a path-based PackStore (WP19-34)"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
# Internal crate of the MixAI Decks app (also lets cargo-deny accept the path dependency).
publish = false

[dependencies]
# zip (MIT, deflate via pure-Rust zlib-rs, no zstd/bzip2/aes), Ed25519 verification (BSD-3),
# SHA-256 + base64 (MIT/Apache-2.0).
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ed25519-dalek = "3.0.0"
sha2 = "0.10.9"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
