[package]
name = "decks-layout"
version = "0.1.0"
description = "MixAI Decks zero-scroll layout solver (weighted grid, panel tiers, dock) shared by the native apps (WP19-34)"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
# Internal crate of the MixAI Decks app (also lets cargo-deny accept the path dependency).
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
