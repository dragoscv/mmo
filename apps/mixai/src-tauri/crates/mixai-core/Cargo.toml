[package]
name = "mixai-core"
version = "1.0.0"
description = "MIXAI real-time DJ audio engine — cpal output, symphonia decode, native DSP signal chain."
authors = ["mwrty <vladulescu.catalin@gmail.com>"]
# Permissive license on purpose: this crate links ONLY permissive DSP and
# must remain distributable inside a proprietary/commercial build.
license = "MIT OR Apache-2.0"
edition = "2024"
# rubato 5.0.1 requires Rust 1.87.
rust-version = "1.90"
publish = false

[dependencies]
# Cross-platform low-latency audio I/O. Enable `asio` on Windows via a feature
# so a plain `cargo build` doesn't require the ASIO SDK during scaffolding.
# 0.18: `SampleRate` is a plain u32, `build_output_stream` takes `StreamConfig` by value,
# `DeviceTrait::name()` removed in favour of `description()` / `id()`, `play()` -> `start()` later.
cpal = "0.18.2"
# Pure-Rust audio decoding (MPL-2.0): mp3, aac, flac, wav, ogg, …
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
# High-quality async resampling (MIT) to match decode rate  device rate.
rubato = "5.0.1"
# Lock-free SPSC/MPSC for the UIaudio command path (no locks in the RT thread).
crossbeam-channel = "0.5.17"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
log = "0.4.35"
# WAV writing for master recording (MIT/Apache, permissive).
hound = "3.5.1"
# Signalsmith Stretch (MIT, C++ via cc + bindgen; needs a C++ compiler and libclang at build
# time): high-quality key-lock / key-shift time-stretch (WP19-07). WSOLA stays as fallback.
signalsmith-stretch = "0.1.3"

[features]
default = []
# Opt-in ASIO backend on Windows for sub-5ms latency (requires ASIO SDK).
asio = ["cpal/asio"]

[lib]
name = "mixai_core"
crate-type = ["rlib"]
