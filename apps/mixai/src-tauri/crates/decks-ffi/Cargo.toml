[package]
name = "decks-ffi"
version = "0.1.0"
description = "UniFFI bindings (Swift + Kotlin) for MixAI Decks: engine commands/snapshots, library, controller mapping, DVS and GPU views (ADR-0014 D61, WP19-04)"
authors = ["mwrty <vladulescu.catalin@gmail.com>"]
# Permissive on purpose (ADR-0014): links only the permissive decks crates and mixai-core.
license = "MIT OR Apache-2.0"
edition = "2024"
# mixai-core needs 1.90 (the strictest member it links).
rust-version = "1.90"
# Internal crate of the MixAI Decks app (also lets cargo-deny accept the path dependencies).
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "decks_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
mixai-core = { path = "../mixai-core" }
decks-analysis = { path = "../decks-analysis", features = ["decode"] }
decks-library = { path = "../decks-library" }
decks-mapping = { path = "../decks-mapping" }
decks-dvs = { path = "../decks-dvs" }
decks-render = { path = "../decks-render" }
decks-remote = { path = "../decks-remote" }
decks-transition = { path = "../decks-transition" }
decks-setlog = { path = "../decks-setlog" }
uniffi = "0.32.2"
thiserror = "2.0.21"
serde_json = "1.0.154"
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "android")'.dependencies]
# Hands the JavaVM + Context to cpal (AAudio) — see src/android.rs.
ndk-context = "0.1.1"

[dev-dependencies]
# Apache-2.0 — writes the generated test WAV.
hound = "3.5.1"
tempfile = "3"
