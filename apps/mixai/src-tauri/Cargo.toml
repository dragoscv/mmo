[package]
name = "mixai"
version = "1.7.0"
description = "MixAI Decks — native DJ software"
authors = ["mwrty <vladulescu.catalin@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/dragoscv/mmo"
edition = "2024"
rust-version = "1.90"
# Shipped as an app bundle, never to crates.io (also lets cargo-deny accept the path dep).
publish = false

# MixAI Decks crates (ADR-0014): every folder under crates/ is a member, so new crates need no edit here.
[workspace]
members = [".", "crates/*"]
resolver = "3"

[lib]
name = "mixai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"
env_logger = "0.11.11"
# The audio engine (local path crate, permissive-licensed).
mixai-core = { path = "crates/mixai-core" }
# Cross-platform MIDI I/O (MIT) for DJ controller support.
midir = "0.11.1"
# Direct Bluetooth LE MIDI (MIT/Apache-2.0/BSD-3): GATT central, no OS BLE-MIDI driver or pairing needed.
btleplug = "0.13.5"
futures = "0.3"
tokio = { version = "1", features = ["time"] }
uuid = "1"
# Cross-platform HID I/O (MIT) for CDJs and HID-class DJ controllers.
hidapi = "2.6.7"
# HTTP client to talk to the MMO Companion library API (rustls = no OpenSSL).
# reqwest 0.13: `rustls-tls` renamed to `rustls`; `query` is now an opt-in feature.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
# .mixaipack skins/layouts: zip (MIT, deflate via pure-Rust zlib-rs, no zstd/bzip2/aes),
# Ed25519 signature verification (BSD-3), SHA-256 + base64 (MIT/Apache-2.0).
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ed25519-dalek = "3.0.0"
sha2 = "0.10.9"
base64 = "0.22.1"
# Shared .mixaipack reader + PackStore (WP19-34), also used by the native apps via decks-ffi.
decks-packs = { path = "crates/decks-packs" }
# LAN tempo sync between Decks instances (WP19-29): own protocol, MIT/Apache (Ableton Link is GPL).
decks-link = { path = "crates/decks-link" }
# Connected mode in the desktop shell (WP19-42): phone remote, second screen, party requests.
decks-remote = { path = "crates/decks-remote" }
# Co-pilot (WP19-39): next-track ranking, phrase-aligned transition plans, set safety, intents.
decks-transition = { path = "crates/decks-transition" }

[target.'cfg(windows)'.dependencies]
# SendInput for the Windows 11 Snap Layouts flyout on the custom title bar; gig lock (src/gig.rs):
# power status, the keep-awake power request and the free space of the recording volume.
windows-sys = { version = "0.61.2", features = [
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_Foundation",
	"Win32_System_Power",
	"Win32_System_Threading",
	"Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
# statvfs for the free space of the recording volume (src/gig.rs). Already in the lock file
# through other crates; MIT / Apache-2.0.
libc = "0.2"

[features]
# Forward the ASIO opt-in to the core for low-latency Windows builds.
asio = ["mixai-core/asio"]

# Debug builds: the audio core runs in the real-time callback, where unoptimised DSP overruns
# the 10 ms buffer on a laptop (measured 2026-11-10: 30 % load idle, peaks > 100 %).
[profile.dev.package.mixai-core]
opt-level = 3

# Key lock runs the Signalsmith stretcher (C++ built by `cc`, which follows this package's
# opt-level) in the same callback. Unoptimised it overran the buffer as soon as a deck played
# with key lock on (measured 2026-11-11 on the laptop, two decks: 126 % load, 75 x-runs in 3 s;
# key lock off: 17 %, 0 x-runs).
[profile.dev.package.signalsmith-stretch]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = 3
strip = true
