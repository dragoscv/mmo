# Flathub manifest for MixAI Music (WP17-43). Offline build: cargo-sources.json + node-sources.json are generated with
# flatpak-builder-tools (scripts/linux/flatpak-sources.sh) from the committed Cargo.lock / pnpm-lock.yaml.
# Submit: fork github.com/flathub/flathub, branch new-pr, add this file + the two generated source lists.
app-id: ro.mixai.music.desktop
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: mixai-music
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # MPRIS media controls (souvlaki): own the player name on the session bus.
  - --own-name=org.mpris.MediaPlayer2.ro.mixai.music.desktop
  # Tray icon (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
modules:
  - name: mixai-music
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/mixai-music/cargo
        XDG_CACHE_HOME: /run/build/mixai-music/flatpak-node/cache
    build-commands:
      # The UI is remote (music.mixai.ro); the local launcher is static files, so only the Rust shell is built.
      - cd apps/music-desktop/src-tauri && cargo --offline build --release --features tauri/custom-protocol
      - install -Dm755 apps/music-desktop/src-tauri/target/release/mixai-music /app/bin/mixai-music
      - install -Dm644 apps/music-desktop/flatpak/ro.mixai.music.desktop.desktop /app/share/applications/ro.mixai.music.desktop.desktop
      - install -Dm644 apps/music-desktop/flatpak/ro.mixai.music.desktop.metainfo.xml /app/share/metainfo/ro.mixai.music.desktop.metainfo.xml
      - install -Dm644 apps/ios/MixAIMusic/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png /app/share/icons/hicolor/1024x1024/apps/ro.mixai.music.desktop.png
    sources:
      - type: git
        url: https://github.com/dragoscv/mmo.git
        tag: music-desktop-v0.1.0
      - cargo-sources.json
