<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>MMO</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: #0a0a0a;
                color: #f5f5f5;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                height: 100%;
                overflow: hidden;
            }
            .splash {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                align-items: center;
                justify-content: center;
                height: 100%;
            }
            .splash p {
                opacity: 0.6;
                font-size: 0.875rem;
            }
            .dot {
                width: 12px;
                height: 12px;
                background: #f5f5f5;
                border-radius: 50%;
                animation: pulse 1.4s infinite ease-in-out;
            }
            @keyframes pulse {
                0%,
                100% {
                    transform: scale(0.6);
                    opacity: 0.4;
                }
                50% {
                    transform: scale(1);
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <!--
      Placeholder shown only if the native shell ever loses the remote URL
      (offline + no service-worker cache). Tauri's main window is configured
      with `url: https://muzicai.ro/` so this file is normally not displayed.
    -->
        <div class="splash">
            <div class="dot"></div>
            <p>MMO</p>
        </div>
        <script>
            // Hard fallback: if we ever land here in a Tauri shell, force-redirect.
            if (typeof window !== "undefined" && navigator.onLine) {
                window.location.replace("https://muzicai.ro/");
            }
        </script>
    </body>
</html>
