<!doctype html>
<html lang="ro" data-tv data-mode="dark" data-accent="violet" data-surface="solid" data-motion="reduced">
<head>
    <meta charset="UTF-8" />
    <!-- TV defaults for the shared theme prefs (only when the user has none), then the
         shared prehydrate applies them to <html>. Classic scripts: file:// on Tizen. -->
    <script>try{var K="mixai:prefs:v1";if(!localStorage.getItem(K))localStorage.setItem(K,JSON.stringify({mode:"dark",accent:"violet",surface:"solid",density:"comfortable",radius:"md",motion:"reduced",locale:"ro",feedback:false}))}catch(e){}</script>
    <script src="./prehydrate.js"></script>
        <!-- device-width: 1920×1080 on 16:9 TVs, 2560×1080 / 3840×1080 on 21:9 / 32:9 monitors
            (config.xml base_screen_resolution=extensive). Layout is responsive in width. -->
        <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>MixAI TV</title>
    <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
