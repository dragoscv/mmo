<!doctype html>
<html lang="ro" data-tv data-mode="dark" data-accent="violet" data-surface="solid" data-motion="full">
<head>
    <meta charset="UTF-8" />
    <!-- TV defaults for the shared theme prefs (only when the user has none), then the shared prehydrate
        applies them to <html>. Motion defaults to "full" (short --dur-* tokens); an explicit user
        "reduced" is kept. One-shot migration: 1.x wrote motion:"reduced" as a forced default, not a
        user choice → flip it once (flag tvMotionV2). Classic scripts: file:// on Tizen. -->
    <script>try{var K="mixai:prefs:v1",r=localStorage.getItem(K),p=r?JSON.parse(r):null;if(!p)p={mode:"dark",accent:"violet",surface:"solid",density:"comfortable",radius:"md",motion:"full",locale:"ro",feedback:false};if(!p.tvMotionV2){if(p.motion==="reduced"&&!p.motionUserSet)p.motion="full";p.tvMotionV2=true}localStorage.setItem(K,JSON.stringify(p))}catch(e){}</script>
    <script src="./prehydrate.js"></script>
        <!-- device-width: 1920×1080 on 16:9 TVs, 2560×1080 / 3840×1080 on 21:9 / 32:9 monitors
            (config.xml base_screen_resolution=extensive). Layout is responsive in width. -->
        <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>MixAI TV</title>
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <!-- Boot screen styles (logo motion + brand colours). GENERATED between the markers by brand/scripts/build.mjs. -->
    <!-- brand:style:start --><style>
/* GENERATED by brand/scripts/build.mjs from brand/src/motion.mjs. Do not edit. */
.mixai-logo { overflow: visible; }
.mixai-logo-line { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 0; }
.mixai-logo-dot, .mixai-logo-body { transform-origin: 0 0; }

@keyframes mixai-logo-intro-line {
  0% { stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  29.99% { stroke-dashoffset: -1; opacity: 1; }
  30% { stroke-dashoffset: -1; opacity: 0; animation-timing-function: cubic-bezier(0, 0, 1, 1); }
  42% { stroke-dashoffset: -1; opacity: 0; animation-timing-function: cubic-bezier(0.2, 0, 0, 1); }
  42.01% { stroke-dashoffset: -1; opacity: 1; animation-timing-function: cubic-bezier(0.2, 0, 0, 1); }
  86% { stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(0, 0, 1, 1); }
  100% { stroke-dashoffset: 0; opacity: 1; }
}
@keyframes mixai-logo-intro-dot {
  0% { transform: scale(1); animation-timing-function: cubic-bezier(0, 0, 1, 1); }
  12% { transform: scale(1); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  38% { transform: scale(1.4); animation-timing-function: cubic-bezier(0, 0, 1, 1); }

  100% { transform: scale(1); }
}
.mixai-logo[data-anim="intro"] .mixai-logo-line { animation: mixai-logo-intro-line 900ms linear 1 both; }
.mixai-logo[data-anim="intro"] .mixai-logo-line { animation-delay: calc(var(--i, 0) * 90ms); }
.mixai-logo[data-anim="intro"] .mixai-logo-dot { animation: mixai-logo-intro-dot 900ms linear 1 both; }

@keyframes mixai-logo-loading-line {
  0% { opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  40% { opacity: 0.4; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  80% { opacity: 1; animation-timing-function: cubic-bezier(0, 0, 1, 1); }

}
@keyframes mixai-logo-loading-dot {

}
.mixai-logo[data-anim="loading"] .mixai-logo-line { animation: mixai-logo-loading-line 1400ms linear infinite both; }
.mixai-logo[data-anim="loading"] .mixai-logo-line { animation-delay: calc(var(--i, 0) * 280ms); }
.mixai-logo[data-anim="loading"] .mixai-logo-dot { animation: mixai-logo-loading-dot 1400ms linear infinite both; }

@keyframes mixai-logo-success-dot {
  0% { transform: scale(1); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
  40% { transform: scale(1.38); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  100% { transform: scale(1); }
}
.mixai-logo[data-anim="success"] .mixai-logo-dot { animation: mixai-logo-success-dot 320ms linear 1 both; }

@keyframes mixai-logo-error-body {
  0% { transform: translateX(0px); animation-timing-function: cubic-bezier(0, 0, 1, 1); }
  20% { transform: translateX(-2px); animation-timing-function: cubic-bezier(0, 0, 1, 1); }
  50% { transform: translateX(2px); animation-timing-function: cubic-bezier(0, 0, 1, 1); }
  80% { transform: translateX(-1.25px); animation-timing-function: cubic-bezier(0, 0, 1, 1); }
  100% { transform: translateX(0px); }
}
.mixai-logo[data-anim="error"] .mixai-logo-body { animation: mixai-logo-error-body 180ms linear 1 both; }

@keyframes mixai-logo-morph-line {
  0% { opacity: 1; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
  38% { opacity: 0; animation-timing-function: cubic-bezier(0, 0, 1, 1); }
  100% { opacity: 0; }
}
@keyframes mixai-logo-morph-dot {
  0% { transform: scale(calc(1 + 0 * (var(--mixai-logo-morph-scale, 60) - 1))); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  100% { transform: scale(calc(1 + 1 * (var(--mixai-logo-morph-scale, 60) - 1))); }
}
.mixai-logo[data-anim="morph"] .mixai-logo-line { animation: mixai-logo-morph-line 420ms linear 1 both; }
.mixai-logo[data-anim="morph"] .mixai-logo-dot { animation: mixai-logo-morph-dot 420ms linear 1 both; }

.mixai-logo-press { transition: transform 140ms cubic-bezier(0.16, 1, 0.3, 1); }
.mixai-logo-press:active { transform: scale(0.94); }

/* Reduced motion: the static mark. Loading states must show a text status next to it. */
@media (prefers-reduced-motion: reduce) {
  .mixai-logo[data-anim] .mixai-logo-line, .mixai-logo[data-anim] .mixai-logo-dot, .mixai-logo[data-anim] .mixai-logo-body { animation: none; }
  .mixai-logo[data-anim="morph"] { transition: opacity 150ms linear; }
  .mixai-logo-press { transition: opacity 140ms linear; }
  .mixai-logo-press:active { transform: none; opacity: 0.8; }
}
:root[data-motion="reduced"] .mixai-logo[data-anim] .mixai-logo-line, :root[data-motion="reduced"] .mixai-logo[data-anim] .mixai-logo-dot, :root[data-motion="reduced"] .mixai-logo[data-anim] .mixai-logo-body { animation: none; }
:root[data-motion="reduced"] .mixai-logo[data-anim="morph"] { transition: opacity 150ms linear; }
:root[data-motion="reduced"] .mixai-logo-press { transition: opacity 140ms linear; }
:root[data-motion="reduced"] .mixai-logo-press:active { transform: none; opacity: 0.8; }
.mixai-logo[data-product="tv"] .mixai-logo-line { stroke: var(--product-tv); }
.mixai-logo[data-product="tv"] .mixai-logo-dot, .mixai-wordmark[data-product="tv"] .mixai-ink { fill: var(--mark-signal); }
.mixai-wordmark[data-product="tv"] .mixai-accent { fill: var(--product-tv); }
.mixai-logo[data-product="tv"] .mixai-logo-line:nth-child(2) { --i: 1; }
.mixai-boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; --product-tv: #9f88ff; --mark-signal: #f5f1ea; background: #07060f; }
:root[data-mode="light"] .mixai-boot { --product-tv: #683ecf; --mark-signal: #0c0c16; background: #fbfbfe; }
</style><!-- brand:style:end -->
</head>
<body>
    <!-- Boot screen: the MixAI TV mark playing its intro until the app renders into #root (React replaces it).
        The markup between the brand markers is GENERATED by brand/scripts/build.mjs. -->
    <div id="root"><div class="mixai-boot"><!-- brand:logo:start --><svg class="mixai-logo" data-product="tv" data-anim="intro" width="160" height="160" viewBox="0 0 48 48" role="img" aria-label="MixAI TV"><g class="mixai-logo-body"><path class="mixai-logo-line" pathLength="1" d="M12 10H36A4 4 0 0 1 40 14V28A4 4 0 0 1 36 32H12A4 4 0 0 1 8 28V14A4 4 0 0 1 12 10Z" stroke-width="5"/><path class="mixai-logo-line" pathLength="1" d="M17 39H31" stroke-width="5"/><g transform="translate(24 21)"><circle class="mixai-logo-dot" r="4"/></g></g></svg><!-- brand:logo:end --></div></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
