[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["mwrty <vladulescu.catalin@gmail.com>"]
repository = "https://github.com/mwrty/mmo"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# DSP tests push seconds of audio through per-sample loops: unoptimised they take minutes.
# Debug assertions and overflow checks stay on (only the optimisation level changes).
[profile.dev.package.live-dsp]
opt-level = 2
