[package]
name = "live-ffi"
description = "MixAI Live UniFFI bindings (Kotlin + Swift): the engine runs on a phone as a backup processor, same Session/Control and protocol v1 (WP21-06)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "live_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
live-dsp = { path = "../live-dsp" }
live-engine = { path = "../live-engine" }
live-remote = { path = "../live-remote" }
uniffi = "0.32.2"
thiserror = "2.0.21"
serde_json = "1.0.154"

[target.'cfg(target_os = "android")'.dependencies]
# Hands the JavaVM + Context to cpal (AAudio), see src/android.rs.
ndk-context = "0.1.1"
# AAudio low-latency performance mode + audio thread priority (cpal `realtime`).
live-engine = { path = "../live-engine", features = ["realtime"] }
