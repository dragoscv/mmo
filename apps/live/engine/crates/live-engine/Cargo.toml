[package]
name = "live-engine"
description = "MixAI Live: realtime duplex vocal engine (device I/O, lock-free control, buses, presets, setlists, latency measurement)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
live-dsp = { path = "../live-dsp" }
cpal = "0.18.2"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.35"
clap = { version = "4.6.7", features = ["derive"] }

[features]
default = []
# Opt-in ASIO backend on Windows (needs the ASIO SDK; GPLv3/proprietary licence, ADR-0015 §8).
asio = ["cpal/asio"]
# PipeWire host on Linux.
pipewire = ["cpal/pipewire"]
jack = ["cpal/jack"]

[dev-dependencies]
assert_no_alloc = "1.1.2"

[[bin]]
name = "mixai-live-engine"
path = "src/bin/mixai-live-engine.rs"
