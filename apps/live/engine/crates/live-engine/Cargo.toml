[package]
name = "live-engine"
description = "MixAI Live: realtime duplex vocal engine (device I/O, lock-free control, buses, presets, setlists, latency measurement)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
live-dsp = { path = "../live-dsp" }
cpal = "0.18.2"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.35"

# Own WASAPI backend (exclusive + IAudioClient3 low-latency shared), MMCSS "Pro Audio", the system
# checkup (endpoint volume / properties, power plan) and the Voicemeeter Remote API loader
# (registry + LoadLibrary). Same version as cpal's WASAPI host, so the crate is compiled once.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
	"Win32_Devices_FunctionDiscovery",
	"Win32_Foundation",
	"Win32_Media",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	"Win32_Media_KernelStreaming",
	"Win32_Media_Multimedia",
	"Win32_Security",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_LibraryLoader",
	"Win32_System_Power",
	"Win32_System_Registry",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = []
# Opt-in ASIO backend on Windows (needs the ASIO SDK; GPLv3/proprietary licence, ADR-0015 §8).
asio = ["cpal/asio"]
# PipeWire host on Linux.
pipewire = ["cpal/pipewire"]
jack = ["cpal/jack"]
# AAudio low-latency performance mode + realtime audio thread priority (Android / Linux / WASAPI).
realtime = ["cpal/realtime"]

[dev-dependencies]
assert_no_alloc = "1.1.2"
